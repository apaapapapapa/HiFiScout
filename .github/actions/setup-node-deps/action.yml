name: Setup Vite+ dependencies
description: Install Vite+, the project-pinned Node.js/package manager, and locked dependencies

runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1.17.0
      with:
        version: "0.2.9"
        cache: true
        run-install: |
          - cwd: .
            args: ['--frozen-lockfile']
