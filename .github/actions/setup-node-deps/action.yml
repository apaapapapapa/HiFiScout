name: Setup Vite+ dependencies
description: Restore or install Vite+, the project-pinned Node.js/package manager, and locked dependencies

inputs:
  cache-write:
    description: Save shared Vite+ runtime and locked dependency caches on misses
    required: false
    default: "false"
  task-cache:
    description: Restore and save the Vite+ task result cache
    required: false
    default: "false"
  task-cache-scope:
    description: Isolate task caches for independent CI jobs
    required: false
    default: "default"

runs:
  using: composite
  steps:
    - name: Restore Vite+ runtime
      id: vite-plus-runtime
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.vite-plus
        key: vite-plus-runtime-${{ runner.os }}-${{ runner.arch }}-0.2.9
    - name: Activate cached Vite+
      if: steps.vite-plus-runtime.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "${HOME}/.vite-plus/bin" >> "${GITHUB_PATH}"
        "${HOME}/.vite-plus/bin/vp" --version
    - name: Install Vite+ on runtime cache miss
      if: steps.vite-plus-runtime.outputs.cache-hit != 'true'
      uses: voidzero-dev/setup-vp@v1.17.0
      with:
        version: "0.2.9"
        cache: false
        run-install: false
    - name: Restore locked dependencies
      id: locked-dependencies
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: node_modules
        key: vite-plus-deps-${{ runner.os }}-${{ runner.arch }}-0.2.9-${{ hashFiles('package.json', 'package-lock.json', '.npmrc') }}
    - name: Install locked dependencies on cache miss
      if: steps.locked-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: vp install --frozen-lockfile
    - name: Restore Vite+ task cache
      if: inputs.task-cache == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache-scope }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vite-task-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache-scope }}-${{ hashFiles('package-lock.json') }}-
    - name: Save locked dependencies
      if: inputs.cache-write == 'true' && steps.locked-dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: node_modules
        key: vite-plus-deps-${{ runner.os }}-${{ runner.arch }}-0.2.9-${{ hashFiles('package.json', 'package-lock.json', '.npmrc') }}
    - name: Save Vite+ runtime
      if: inputs.cache-write == 'true' && steps.vite-plus-runtime.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.vite-plus
        key: vite-plus-runtime-${{ runner.os }}-${{ runner.arch }}-0.2.9
