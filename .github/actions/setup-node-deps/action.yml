name: Setup Node dependencies
description: Install the root Node.js toolchain and locked dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci
