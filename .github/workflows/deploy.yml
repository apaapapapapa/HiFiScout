name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Apply backward-compatible D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Verify AudioUnion priced listings are visible as in stock
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute DB --remote --json --command "
            SELECT
              COUNT(*) AS active_count,
              SUM(CASE WHEN stock_status = 'in_stock' THEN 1 ELSE 0 END) AS in_stock_count,
              SUM(CASE WHEN stock_status = 'unknown' THEN 1 ELSE 0 END) AS unknown_count,
              MAX(last_seen_at) AS latest_seen_at
            FROM products
            WHERE shop_key = 'audiounion' AND is_active = 1;")"
          row="$(jq -c '.[0].results[0] // {}' <<< "$result")"
          echo "$row" | jq .
          in_stock="$(jq -r '.in_stock_count // 0' <<< "$row")"
          if [ "$in_stock" -le 0 ]; then
            echo "AudioUnion has no active in-stock listings after the priced-listing fix."
            exit 1
          fi
          echo "AudioUnion priced listings are present as in_stock; historical unknown rows are allowed until a compliant full-coverage source is available."
      - name: Deploy Worker and static assets
        run: npx wrangler deploy
      - name: Check production health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --retry 3 --retry-delay 2 https://hifiscout.raha3415kohei.workers.dev/api/health)"
          echo "$response" | jq .
          echo "$response" | jq -e '.shops[] | select(.shopKey == "audiounion" and .configured == true)'
