name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Record deployment identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment SHA: $DEPLOY_SHA" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SHA" > deployment-sha.txt
      - name: Publish deployment identity artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-identity
          path: deployment-sha.txt
          retention-days: 1
          if-no-files-found: error
      - name: Resolve production base URL
        shell: bash
        env:
          REPOSITORY_PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          source .github/config/production.env
          base_url="${REPOSITORY_PRODUCTION_BASE_URL:-$PRODUCTION_BASE_URL}"
          echo "PRODUCTION_BASE_URL=${base_url%/}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node-deps
      - name: Provision required Cloudflare resources
        run: bash scripts/provision-production-resources.sh
      - name: Install deploy-only Worker dependency
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(vp env exec npm pack @cloudflare/playwright@1.3.5 --silent)"
          mkdir -p node_modules/@cloudflare/playwright
          tar -xzf "$tarball" -C node_modules/@cloudflare/playwright --strip-components=1
          rm -f "$tarball"
      - name: Apply backward-compatible D1 migrations
        run: vp exec wrangler d1 migrations apply DB --remote
      - name: Build browser assets from TypeScript source
        run: vp run build:frontend
      - name: Deploy Worker and static assets
        run: vp exec wrangler deploy
      - name: Check production runtime health
        shell: bash
        run: |
          set -euo pipefail
          health_body="$(mktemp)"
          trap 'rm -f "$health_body"' EXIT
          http_status="$(curl -sS --retry 3 --retry-delay 2 -o "$health_body" -w '%{http_code}' "${PRODUCTION_BASE_URL}/api/health")"
          response="$(cat "$health_body")"

          if jq -e . >/dev/null 2>&1 <<< "$response"; then
            jq . <<< "$response"
            jq -e '.shops[] | select(.shopKey == "audiounion" and .configured == true)' <<< "$response" >/dev/null
          elif [[ "$http_status" == "429" ]] && grep -Eqi 'Error[[:space:]]+1027' <<< "$response"; then
            echo "::warning title=Production runtime health deferred::Cloudflare Workers daily request quota is exhausted (error 1027); the Worker deployment itself succeeded."
            echo "Production health endpoint returned HTTP ${http_status} because the account-wide Worker request quota is exhausted."
          else
            echo "Production health endpoint returned a non-JSON response (HTTP ${http_status}):" >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi

      # Product-search consistency, identity coverage and data-quality baselines intentionally live
      # in Production Operational Health. A data-state incident must not rewrite a successful
      # deployment as if the new Worker never reached production.

      - name: Publish deployment status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/publish-commit-status
        with:
          github-token: ${{ github.token }}
          sha: ${{ env.DEPLOY_SHA }}
          job-status: ${{ job.status }}
          context: deployment/cloudflare
          description-prefix: Cloudflare deployment
