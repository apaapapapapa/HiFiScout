name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Apply backward-compatible D1 migrations
        run: npx --yes wrangler@4.120.1 d1 migrations apply DB --remote
      - name: One-time repair malformed AudioUnion MAGICO A1 listing
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.1 d1 execute DB --remote --command "
            UPDATE products
               SET manufacturer = 'MAGICO',
                   raw_manufacturer = 'MAGICO',
                   manufacturer_id = 'magico',
                   model = 'A1',
                   title = 'MAGICO A1',
                   category = 'スピーカー',
                   raw_category = CASE WHEN raw_category IS NULL OR raw_category = '' OR raw_category = 'その他' THEN 'スピーカー' ELSE raw_category END,
                   primary_category_id = 'speaker',
                   category_ids = '[\"speaker\"]',
                   classification_status = 'classified'
             WHERE shop_key = 'audiounion'
               AND manufacturer = 'MAGICO'
               AND (model LIKE '%A1 A1%' OR title LIKE '%A1 A1%');
          "
          npx --yes wrangler@4.120.1 d1 execute DB --remote --json --command "
            SELECT id, manufacturer, model, title, category, price_yen
              FROM products
             WHERE shop_key = 'audiounion'
               AND manufacturer = 'MAGICO'
               AND (model = 'A1' OR title = 'MAGICO A1')
             ORDER BY last_seen_at DESC
             LIMIT 5;
          " | jq .
      - name: Verify AudioUnion priced listings are visible as in stock
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx --yes wrangler@4.120.1 d1 execute DB --remote --json --command "
            SELECT
              COUNT(*) AS active_count,
              SUM(CASE WHEN stock_status = 'in_stock' THEN 1 ELSE 0 END) AS in_stock_count,
              SUM(CASE WHEN stock_status = 'unknown' THEN 1 ELSE 0 END) AS unknown_count,
              MAX(last_seen_at) AS latest_seen_at
            FROM products
            WHERE shop_key = 'audiounion' AND is_active = 1;")"
          row="$(jq -c '.[0].results[0] // {}' <<< "$result")"
          echo "$row" | jq .
          in_stock="$(jq -r '.in_stock_count // 0' <<< "$row")"
          if [ "$in_stock" -le 0 ]; then
            echo "AudioUnion has no active in-stock listings after the priced-listing fix."
            exit 1
          fi
          echo "AudioUnion priced listings are present as in_stock; historical unknown rows are allowed until a compliant full-coverage source is available."
      - name: Deploy Worker and static assets
        run: npx --yes wrangler@4.120.1 deploy
      - name: Check production health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --retry 3 --retry-delay 2 https://hifiscout.raha3415kohei.workers.dev/api/health)"
          echo "$response" | jq .
          echo "$response" | jq -e '.shops[] | select(.shopKey == "audiounion" and .configured == true)'
