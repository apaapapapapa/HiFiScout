name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # D1 free-tier daily quotas reset at midnight UTC. A deployment deferred only because that
    # account-wide quota was exhausted gets one bounded retry after the reset without a new commit.
    - cron: "15 0 * * *"

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          target_sha=""

          case "$EVENT_NAME" in
            workflow_run)
              target_sha="$WORKFLOW_RUN_SHA"
              ;;
            workflow_dispatch)
              target_sha="$EVENT_SHA"
              ;;
            schedule)
              # Never deploy the schedule event's default-branch SHA. It may have reached main
              # while CI is still running or failing. Retry only the newest SHA that completed CI
              # successfully and whose latest deployment status says it was quota-deferred.
              target_sha="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // ""')"

              if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::notice title=Scheduled deployment retry skipped::No successful main CI SHA is available."
                echo "available=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              deployment_status="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/commits/${target_sha}/status" \
                --jq '[.statuses[] | select(.context == "deployment/cloudflare")][0] | [(.state // ""), (.description // "")] | @tsv')"
              IFS=$'\t' read -r deployment_state deployment_description <<< "$deployment_status"

              if [[ "$deployment_state" != "success" || \
                "$deployment_description" != "Cloudflare deployment deferred by D1 quota"* ]]; then
                echo "::notice title=Scheduled deployment retry skipped::Latest successful main CI SHA ${target_sha} is not currently D1-quota-deferred."
                echo "available=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              echo "Unsupported deployment event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment target SHA: $target_sha" >&2
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_SHA=$target_sha" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.target.outputs.available == 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Resolve production base URL
        if: steps.target.outputs.available == 'true'
        shell: bash
        env:
          REPOSITORY_PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          source .github/config/production.env
          base_url="${REPOSITORY_PRODUCTION_BASE_URL:-$PRODUCTION_BASE_URL}"
          echo "PRODUCTION_BASE_URL=${base_url%/}" >> "$GITHUB_ENV"

      - name: Determine required D1 migrations
        id: d1-migrations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A scheduled run with no eligible deferred CI-approved SHA is an intentional no-op. Set
          # the same output that the later deployment steps already use so none of them can run.
          if [[ "${{ steps.target.outputs.available }}" != "true" ]]; then
            echo "already_deployed=true" >> "$GITHUB_OUTPUT"
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment SHA: $DEPLOY_SHA" >&2
            exit 1
          fi

          # deployment-identity is the authority for what production actually runs. A Deploy
          # workflow run's head_sha can differ from the CI-authorized SHA stored in that artifact,
          # so read deployment-sha.txt from the newest valid unexpired artifact itself.
          artifact_rows="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=deployment-identity&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse[] | [.id, .created_at] | @tsv')"
          last_deployed_sha=""
          if [[ -n "$artifact_rows" ]]; then
            while IFS=$'\t' read -r artifact_id _created_at; do
              [[ "$artifact_id" =~ ^[0-9]+$ ]] || continue
              tmp_dir="$(mktemp -d)"
              zip_file="$tmp_dir/deployment-identity.zip"
              if gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$zip_file"; then
                candidate="$(unzip -p "$zip_file" deployment-sha.txt 2>/dev/null | tr -d '\r\n' || true)"
                if [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
                  last_deployed_sha="$candidate"
                  rm -rf "$tmp_dir"
                  break
                fi
              fi
              rm -rf "$tmp_dir"
            done <<< "$artifact_rows"
          fi

          echo "already_deployed=false" >> "$GITHUB_OUTPUT"
          if [[ -z "$last_deployed_sha" ]]; then
            echo "No confirmed production deployment identity artifact found; D1 migrations are required."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "last_deployed_sha=$last_deployed_sha" >> "$GITHUB_OUTPUT"
          if [[ "$last_deployed_sha" == "$DEPLOY_SHA" ]]; then
            echo "Production already runs $DEPLOY_SHA; deployment is a no-op."
            echo "already_deployed=true" >> "$GITHUB_OUTPUT"
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$last_deployed_sha"
          changed_migrations="$(git diff --diff-filter=AM --name-only \
            "$last_deployed_sha" "$DEPLOY_SHA" -- 'migrations/*.sql')"

          if [[ -n "$changed_migrations" ]]; then
            echo "D1 migrations added or modified since the last confirmed production deployment:"
            printf '%s\n' "$changed_migrations"
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "No D1 migration additions/modifications since deployed SHA $last_deployed_sha; skipping remote migration API."
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      # Use the same Vite+/Node/package-manager bootstrap as CI. package.json devEngines pins the
      # package manager, so actions/setup-node's npm cache probe can fail before npm is upgraded.
      - uses: ./.github/actions/setup-node-deps
        if: steps.d1-migrations.outputs.already_deployed != 'true'
      # Every `vp exec wrangler` below resolves to the Wrangler installed by the shared setup action,
      # pinned by package-lock.json. CI already exercises that exact binary through build:worker.
      - name: Provision required Cloudflare resources
        if: steps.d1-migrations.outputs.already_deployed != 'true'
        run: bash scripts/provision-production-resources.sh
      - name: Install deploy-only Worker dependency
        if: steps.d1-migrations.outputs.already_deployed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(vp env exec npm pack @cloudflare/playwright@1.3.5 --silent)"
          mkdir -p node_modules/@cloudflare/playwright
          tar -xzf "$tarball" -C node_modules/@cloudflare/playwright --strip-components=1
          rm -f "$tarball"
      - name: Apply backward-compatible D1 migrations
        id: d1-apply
        if: steps.d1-migrations.outputs.already_deployed != 'true' && steps.d1-migrations.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=4

          for attempt in $(seq 1 "$max_attempts"); do
            log_file="$(mktemp)"
            set +e
            vp exec wrangler d1 migrations apply DB --remote 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if (( status == 0 )); then
              rm -f "$log_file"
              exit 0
            fi

            if grep -Fq 'code: 7500' "$log_file" && \
              grep -Fq "exceeded D1's free tier daily row read limit" "$log_file"; then
              echo "::warning title=Production deployment deferred::D1 free-tier daily row-read quota is exhausted (7500). Migrations and Worker deployment are deferred until the quota-reset retry; production remains on the last confirmed deployed SHA."
              echo "deferred=d1_daily_quota" >> "$GITHUB_OUTPUT"
              rm -f "$log_file"
              exit 0
            fi

            if ! grep -Fq 'code: 7429' "$log_file"; then
              rm -f "$log_file"
              exit "$status"
            fi

            if (( attempt == max_attempts )); then
              rm -f "$log_file"
              echo "D1 migration apply still hit CPU reset after ${max_attempts} attempts." >&2
              exit "$status"
            fi

            delay_seconds=$((attempt * 60))
            echo "::warning title=D1 migration retry::D1 CPU reset (7429) on attempt ${attempt}/${max_attempts}; retrying in ${delay_seconds}s."
            rm -f "$log_file"
            sleep "$delay_seconds"
          done
      - name: Build browser assets from TypeScript source
        if: steps.d1-migrations.outputs.already_deployed != 'true' && steps.d1-apply.outputs.deferred != 'd1_daily_quota'
        run: vp run build:frontend
      - name: Deploy Worker and static assets
        if: steps.d1-migrations.outputs.already_deployed != 'true' && steps.d1-apply.outputs.deferred != 'd1_daily_quota'
        run: vp exec wrangler deploy
      - name: Check saved-search Atom feed and autodiscovery
        if: steps.d1-migrations.outputs.already_deployed != 'true' && steps.d1-apply.outputs.deferred != 'd1_daily_quota'
        shell: bash
        run: |
          set -euo pipefail
          feed_headers="$(mktemp)"
          feed_body="$(mktemp)"
          catalog_body="$(mktemp)"
          diagnostic_headers="$(mktemp)"
          diagnostic_body="$(mktemp)"
          tail_log="$(mktemp)"
          tail_pid=""
          cleanup() {
            if [[ -n "$tail_pid" ]]; then
              kill "$tail_pid" 2>/dev/null || true
              wait "$tail_pid" 2>/dev/null || true
            fi
            rm -f "$feed_headers" "$feed_body" "$catalog_body" \
              "$diagnostic_headers" "$diagnostic_body" "$tail_log"
          }
          trap cleanup EXIT

          feed_status="$(curl -sS --retry 3 --retry-delay 2 -D "$feed_headers" -o "$feed_body" -w '%{http_code}' \
            "${PRODUCTION_BASE_URL}/api/feed?manufacturer=TAD&inStock=true&limit=2")"
          if [[ "$feed_status" != "200" ]]; then
            # Cloudflare's outer 1101 page hides the Worker exception. Reproduce the same request
            # while tailing the deployed Worker, then correlate the response CF-Ray with that exact
            # tail event. Only the quota-specific D1 message from the matching request may defer the
            # smoke check; generic 1101s and unrelated concurrent quota errors remain fail-closed.
            timeout 30s vp exec wrangler tail hifiscout --format=json >"$tail_log" 2>&1 &
            tail_pid=$!
            sleep 5
            diagnostic_status="$(curl -sS --max-time 20 -D "$diagnostic_headers" -o "$diagnostic_body" -w '%{http_code}' \
              "${PRODUCTION_BASE_URL}/api/feed?manufacturer=TAD&inStock=true&limit=2" || true)"
            sleep 3
            kill "$tail_pid" 2>/dev/null || true
            wait "$tail_pid" 2>/dev/null || true
            tail_pid=""

            diagnostic_ray="$(awk 'BEGIN { IGNORECASE=1 } /^cf-ray:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); ray=$0 } END { print ray }' "$diagnostic_headers")"
            quota_message="D1_ERROR: Your account has exceeded D1's free tier daily row read limit."

            if [[ -n "$diagnostic_ray" ]] && jq -se \
              --arg ray "$diagnostic_ray" \
              --arg quota "$quota_message" \
              '[.[]
                | select((.event.request.headers["cf-ray"] // "") == $ray)
                | .exceptions[]?
                | select((.message // "") | contains($quota))]
               | length > 0' "$tail_log" >/dev/null; then
              echo "::warning title=Production runtime smoke deferred::The failing Atom request was correlated by CF-Ray to Cloudflare D1 free-tier daily row-read quota exhaustion. The Worker deployment itself succeeded; D1-dependent smoke checks are deferred until the quota resets."
              echo "PRODUCTION_RUNTIME_CHECK_DEFERRED=d1_daily_quota" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Production Atom feed returned HTTP ${feed_status}:" >&2
            cat "$feed_body" >&2
            echo "Diagnostic replay returned HTTP ${diagnostic_status}; CF-Ray=${diagnostic_ray:-missing}." >&2
            cat "$diagnostic_body" >&2
            echo "Worker tail did not correlate this request to the D1 daily row-read quota signature:" >&2
            cat "$tail_log" >&2
            exit 1
          fi

          content_type="$(awk 'BEGIN { IGNORECASE=1 } /^content-type:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$feed_headers")"
          cache_control="$(awk 'BEGIN { IGNORECASE=1 } /^cache-control:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$feed_headers")"
          [[ "$content_type" == application/atom+xml* ]] || {
            echo "Unexpected Atom Content-Type: ${content_type}" >&2
            exit 1
          }
          [[ "$cache_control" == *"max-age=120"* ]] || {
            echo "Unexpected Atom Cache-Control: ${cache_control}" >&2
            exit 1
          }

          python - "$feed_body" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          atom = "{http://www.w3.org/2005/Atom}"
          assert root.tag == f"{atom}feed"
          for name in ("id", "title", "updated"):
              assert root.find(f"{atom}{name}") is not None, name
          assert any(link.get("rel") == "self" for link in root.findall(f"{atom}link"))
          for entry in root.findall(f"{atom}entry"):
              for name in ("id", "title", "updated"):
                  assert entry.find(f"{atom}{name}") is not None, f"entry/{name}"
          PY

          catalog_status="$(curl -sS --retry 3 --retry-delay 2 -o "$catalog_body" -w '%{http_code}' \
            "${PRODUCTION_BASE_URL}/?manufacturer=TAD&newOnly=true")"
          if [[ "$catalog_status" != "200" ]]; then
            echo "Filtered catalog returned HTTP ${catalog_status}" >&2
            exit 1
          fi
          grep -F 'data-saved-search-feed' "$catalog_body" >/dev/null
          grep -F 'href="/api/feed?manufacturer=TAD&amp;inStock=true&amp;newOnly=true"' "$catalog_body" >/dev/null
      - name: Check production runtime health
        if: steps.d1-migrations.outputs.already_deployed != 'true' && steps.d1-apply.outputs.deferred != 'd1_daily_quota'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PRODUCTION_RUNTIME_CHECK_DEFERRED:-}" == "d1_daily_quota" ]]; then
            echo "Production runtime health check deferred because the failing production request was correlated to the D1 daily row-read quota signature."
            exit 0
          fi

          health_body="$(mktemp)"
          trap 'rm -f "$health_body"' EXIT
          http_status="$(curl -sS --retry 3 --retry-delay 2 -o "$health_body" -w '%{http_code}' "${PRODUCTION_BASE_URL}/api/health")"
          response="$(cat "$health_body")"

          if jq -e . >/dev/null 2>&1 <<< "$response"; then
            jq . <<< "$response"
            jq -e '.shops[] | select(.shopKey == "audiounion" and .configured == true)' <<< "$response" >/dev/null
          elif [[ "$http_status" == "429" ]] && grep -Eqi 'Error[[:space:]]+1027' <<< "$response"; then
            echo "::warning title=Production runtime health deferred::Cloudflare Workers daily request quota is exhausted (error 1027); the Worker deployment itself succeeded."
            echo "Production health endpoint returned HTTP ${http_status} because the account-wide Worker request quota is exhausted."
          else
            echo "Production health endpoint returned a non-JSON response (HTTP ${http_status}):" >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi

      # Publish deployment identity only after the Worker and deployment-owned smoke checks succeed.
      # A quota-deferred or scheduled no-op run deliberately has no identity artifact, so downstream
      # workflows cannot mistake an undeployed SHA for the production revision.
      - name: Record deployment identity
        if: steps.d1-migrations.outputs.already_deployed != 'true' && steps.d1-apply.outputs.deferred != 'd1_daily_quota'
        shell: bash
        run: printf '%s\n' "$DEPLOY_SHA" > deployment-sha.txt
      - name: Publish deployment identity artifact
        if: steps.d1-migrations.outputs.already_deployed != 'true' && steps.d1-apply.outputs.deferred != 'd1_daily_quota'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-identity
          path: deployment-sha.txt
          retention-days: 90
          if-no-files-found: error

      # Product-search consistency, identity coverage and data-quality baselines intentionally live
      # in Production Operational Health. A data-state incident must not rewrite a successful
      # deployment as if the new Worker never reached production.

      - name: Publish deployment status
        if: always() && steps.target.outputs.available == 'true'
        continue-on-error: true
        uses: ./.github/actions/publish-commit-status
        with:
          github-token: ${{ github.token }}
          sha: ${{ env.DEPLOY_SHA }}
          job-status: ${{ job.status }}
          context: deployment/cloudflare
          description-prefix: ${{ steps.d1-apply.outputs.deferred == 'd1_daily_quota' && 'Cloudflare deployment deferred by D1 quota' || steps.d1-migrations.outputs.already_deployed == 'true' && 'Cloudflare deployment already current' || 'Cloudflare deployment' }}
