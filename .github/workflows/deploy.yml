name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Record deployment identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment SHA: $DEPLOY_SHA" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SHA" > deployment-sha.txt
      - name: Publish deployment identity artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-identity
          path: deployment-sha.txt
          retention-days: 1
          if-no-files-found: error
      - name: Resolve production base URL
        shell: bash
        env:
          REPOSITORY_PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          source .github/config/production.env
          base_url="${REPOSITORY_PRODUCTION_BASE_URL:-$PRODUCTION_BASE_URL}"
          echo "PRODUCTION_BASE_URL=${base_url%/}" >> "$GITHUB_ENV"
      # Use the same Vite+/Node/package-manager bootstrap as CI. package.json devEngines pins the
      # package manager, so actions/setup-node's npm cache probe can fail before npm is upgraded.
      - uses: ./.github/actions/setup-node-deps
      # Every `vp exec wrangler` below resolves to the Wrangler installed by the shared setup action,
      # pinned by package-lock.json. CI already exercises that exact binary through build:worker.
      - name: Provision required Cloudflare resources
        run: bash scripts/provision-production-resources.sh
      - name: Install deploy-only Worker dependency
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(vp env exec npm pack @cloudflare/playwright@1.3.5 --silent)"
          mkdir -p node_modules/@cloudflare/playwright
          tar -xzf "$tarball" -C node_modules/@cloudflare/playwright --strip-components=1
          rm -f "$tarball"
      - name: Determine required D1 migrations
        id: d1-migrations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last_deployed_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"

          if [[ -z "$last_deployed_sha" ]]; then
            echo "No successful production deployment baseline found; D1 migrations are required."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$last_deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid successful deployment SHA: $last_deployed_sha" >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin "$last_deployed_sha"
          changed_migrations="$(git diff --diff-filter=AM --name-only \
            "$last_deployed_sha" "$DEPLOY_SHA" -- 'migrations/*.sql')"

          echo "last_deployed_sha=$last_deployed_sha" >> "$GITHUB_OUTPUT"
          if [[ -n "$changed_migrations" ]]; then
            echo "D1 migrations added or modified since the last successful production deployment:"
            printf '%s\n' "$changed_migrations"
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "No D1 migration additions/modifications since successful deploy $last_deployed_sha; skipping remote migration API."
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply backward-compatible D1 migrations
        if: steps.d1-migrations.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=4

          for attempt in $(seq 1 "$max_attempts"); do
            log_file="$(mktemp)"
            set +e
            vp exec wrangler d1 migrations apply DB --remote 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if (( status == 0 )); then
              rm -f "$log_file"
              exit 0
            fi

            if ! grep -Fq 'code: 7429' "$log_file"; then
              rm -f "$log_file"
              exit "$status"
            fi

            if (( attempt == max_attempts )); then
              rm -f "$log_file"
              echo "D1 migration apply still hit CPU reset after ${max_attempts} attempts." >&2
              exit "$status"
            fi

            delay_seconds=$((attempt * 60))
            echo "::warning title=D1 migration retry::D1 CPU reset (7429) on attempt ${attempt}/${max_attempts}; retrying in ${delay_seconds}s."
            rm -f "$log_file"
            sleep "$delay_seconds"
          done
      - name: Build browser assets from TypeScript source
        run: vp run build:frontend
      - name: Deploy Worker and static assets
        run: vp exec wrangler deploy
      - name: Detect exhausted D1 runtime quota
        shell: bash
        run: |
          set -euo pipefail
          probe_log="$(mktemp)"
          trap 'rm -f "$probe_log"' EXIT

          set +e
          vp exec wrangler d1 execute DB --remote --command 'SELECT 1 AS ok;' >"$probe_log" 2>&1
          probe_status=$?
          set -e

          if (( probe_status == 0 )); then
            exit 0
          fi

          if grep -Fq 'code: 7500' "$probe_log" && \
             grep -Fqi "exceeded D1's free tier daily row read limit" "$probe_log"; then
            echo "::warning title=Production runtime smoke deferred::Cloudflare D1 free-tier daily row read quota is exhausted (code 7500). The Worker deployment itself succeeded; D1-dependent smoke checks are deferred until the quota resets."
            echo "PRODUCTION_RUNTIME_CHECK_DEFERRED=d1_daily_quota" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::warning title=D1 availability probe inconclusive::The optional D1 probe did not confirm the free-tier daily row-read quota signature; production smoke checks will still run."
          cat "$probe_log" >&2
      - name: Check saved-search Atom feed and autodiscovery
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PRODUCTION_RUNTIME_CHECK_DEFERRED:-}" == "d1_daily_quota" ]]; then
            echo "Production Atom/catalog smoke check deferred because the D1 daily row-read quota signature was confirmed after deployment."
            exit 0
          fi

          feed_headers="$(mktemp)"
          feed_body="$(mktemp)"
          catalog_body="$(mktemp)"
          trap 'rm -f "$feed_headers" "$feed_body" "$catalog_body"' EXIT

          feed_status="$(curl -sS --retry 3 --retry-delay 2 -D "$feed_headers" -o "$feed_body" -w '%{http_code}' \
            "${PRODUCTION_BASE_URL}/api/feed?manufacturer=TAD&inStock=true&limit=2")"
          if [[ "$feed_status" != "200" ]]; then
            echo "Production Atom feed returned HTTP ${feed_status}:" >&2
            cat "$feed_body" >&2
            exit 1
          fi

          content_type="$(awk 'BEGIN { IGNORECASE=1 } /^content-type:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$feed_headers")"
          cache_control="$(awk 'BEGIN { IGNORECASE=1 } /^cache-control:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$feed_headers")"
          [[ "$content_type" == application/atom+xml* ]] || {
            echo "Unexpected Atom Content-Type: ${content_type}" >&2
            exit 1
          }
          [[ "$cache_control" == *"max-age=120"* ]] || {
            echo "Unexpected Atom Cache-Control: ${cache_control}" >&2
            exit 1
          }

          python - "$feed_body" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          atom = "{http://www.w3.org/2005/Atom}"
          assert root.tag == f"{atom}feed"
          for name in ("id", "title", "updated"):
              assert root.find(f"{atom}{name}") is not None, name
          assert any(link.get("rel") == "self" for link in root.findall(f"{atom}link"))
          for entry in root.findall(f"{atom}entry"):
              for name in ("id", "title", "updated"):
                  assert entry.find(f"{atom}{name}") is not None, f"entry/{name}"
          PY

          catalog_status="$(curl -sS --retry 3 --retry-delay 2 -o "$catalog_body" -w '%{http_code}' \
            "${PRODUCTION_BASE_URL}/?manufacturer=TAD&newOnly=true")"
          if [[ "$catalog_status" != "200" ]]; then
            echo "Filtered catalog returned HTTP ${catalog_status}" >&2
            exit 1
          fi
          grep -F 'data-saved-search-feed' "$catalog_body" >/dev/null
          grep -F 'href="/api/feed?manufacturer=TAD&amp;inStock=true&amp;newOnly=true"' "$catalog_body" >/dev/null
      - name: Check production runtime health
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PRODUCTION_RUNTIME_CHECK_DEFERRED:-}" == "d1_daily_quota" ]]; then
            echo "Production runtime health check deferred because the D1 daily row-read quota signature was confirmed after deployment."
            exit 0
          fi

          health_body="$(mktemp)"
          trap 'rm -f "$health_body"' EXIT
          http_status="$(curl -sS --retry 3 --retry-delay 2 -o "$health_body" -w '%{http_code}' "${PRODUCTION_BASE_URL}/api/health")"
          response="$(cat "$health_body")"

          if jq -e . >/dev/null 2>&1 <<< "$response"; then
            jq . <<< "$response"
            jq -e '.shops[] | select(.shopKey == "audiounion" and .configured == true)' <<< "$response" >/dev/null
          elif [[ "$http_status" == "429" ]] && grep -Eqi 'Error[[:space:]]+1027' <<< "$response"; then
            echo "::warning title=Production runtime health deferred::Cloudflare Workers daily request quota is exhausted (error 1027); the Worker deployment itself succeeded."
            echo "Production health endpoint returned HTTP ${http_status} because the account-wide Worker request quota is exhausted."
          else
            echo "Production health endpoint returned a non-JSON response (HTTP ${http_status}):" >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi

      # Product-search consistency, identity coverage and data-quality baselines intentionally live
      # in Production Operational Health. A data-state incident must not rewrite a successful
      # deployment as if the new Worker never reached production.

      - name: Publish deployment status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/publish-commit-status
        with:
          github-token: ${{ github.token }}
          sha: ${{ env.DEPLOY_SHA }}
          job-status: ${{ job.status }}
          context: deployment/cloudflare
          description-prefix: Cloudflare deployment
