name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Apply backward-compatible D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker and static assets
        run: npx wrangler deploy
      - name: Inspect AudioUnion sync state
        run: >-
          npx wrangler d1 execute DB --remote --command
          "SELECT shop_key, last_attempt_at, last_success_at, consecutive_failures, last_error, last_item_count, queued_at FROM shop_sync_state WHERE shop_key = 'audiounion'"
      - name: Check production health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --retry 3 --retry-delay 2 https://hifiscout.raha3415kohei.workers.dev/api/health)"
          echo "$response" | jq .
          echo "$response" | jq -e '.shops[] | select(.shopKey == "audiounion")'
