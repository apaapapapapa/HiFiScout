name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve production base URL
        shell: bash
        env:
          REPOSITORY_PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          source .github/config/production.env
          base_url="${REPOSITORY_PRODUCTION_BASE_URL:-$PRODUCTION_BASE_URL}"
          echo "PRODUCTION_BASE_URL=${base_url%/}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install deploy-only Worker dependency
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack @cloudflare/playwright@1.3.5 --silent)"
          mkdir -p node_modules/@cloudflare/playwright
          tar -xzf "$tarball" -C node_modules/@cloudflare/playwright --strip-components=1
          rm -f "$tarball"
      - name: Apply backward-compatible D1 migrations
        run: npx --yes wrangler@4.120.1 d1 migrations apply DB --remote
      - name: Verify AudioUnion priced listings are visible as in stock
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx --yes wrangler@4.120.1 d1 execute DB --remote --json --command "
            SELECT
              COUNT(*) AS active_count,
              SUM(CASE WHEN stock_status = 'in_stock' THEN 1 ELSE 0 END) AS in_stock_count,
              SUM(CASE WHEN stock_status = 'unknown' THEN 1 ELSE 0 END) AS unknown_count,
              MAX(last_seen_at) AS latest_seen_at
            FROM products
            WHERE shop_key = 'audiounion' AND is_active = 1;")"
          row="$(jq -c '.[0].results[0] // {}' <<< "$result")"
          echo "$row" | jq .
          in_stock="$(jq -r '.in_stock_count // 0' <<< "$row")"
          if [ "$in_stock" -le 0 ]; then
            echo "AudioUnion has no active in-stock listings after the priced-listing fix."
            exit 1
          fi
          echo "AudioUnion priced listings are present as in_stock; historical unknown rows are allowed until a compliant full-coverage source is available."
      - name: Deploy Worker and static assets
        run: npx --yes wrangler@4.120.1 deploy
      - name: Check production health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --retry 3 --retry-delay 2 "${PRODUCTION_BASE_URL}/api/health")"
          echo "$response" | jq .
          echo "$response" | jq -e '.shops[] | select(.shopKey == "audiounion" and .configured == true)'
