name: Backup D1

on:
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backup.yml'
      - 'scripts/backup-d1-logical.ts'

permissions:
  contents: read

concurrency:
  group: production-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps

      - name: Resolve inherited production D1 binding
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          info="$(vp exec wrangler d1 info DB --json)"
          id="$(jq -r '.uuid // .database_id // .id // empty' <<< "$info")"
          if [[ -z "$id" ]]; then
            echo 'Could not resolve the deployed DB binding to an explicit D1 id.' >&2
            jq . <<< "$info" >&2
            exit 1
          fi
          echo "database_id=$id" >> "$GITHUB_OUTPUT"

      - name: Export remote D1 logical backup
        id: export
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          file="hifiscout-d1-${stamp}.sql"
          vp exec tsx scripts/backup-d1-logical.ts --output "$file"
          test -s "$file"
          gzip -9 "$file"
          gzip -t "${file}.gz"
          echo "file=${file}.gz" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - name: Retain backup as GitHub artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d1-backup-${{ steps.export.outputs.stamp }}
          path: ${{ steps.export.outputs.file }}
          retention-days: 90
          if-no-files-found: error

      - name: Copy backup to R2 when configured
        if: ${{ vars.HIFISCOUT_BACKUP_BUCKET != '' }}
        run: >-
          vp exec wrangler r2 object put
          "${{ vars.HIFISCOUT_BACKUP_BUCKET }}/d1/${{ steps.export.outputs.file }}"
          --remote
          --file="${{ steps.export.outputs.file }}"
          --content-type=application/gzip
          --force
