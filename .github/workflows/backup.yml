name: Backup D1

on:
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Export remote D1
        id: export
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          file="hifiscout-d1-${stamp}.sql"
          npx wrangler d1 export DB --remote --output="$file"
          gzip -9 "$file"
          echo "file=${file}.gz" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - name: Retain backup as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ steps.export.outputs.stamp }}
          path: ${{ steps.export.outputs.file }}
          retention-days: 90
          if-no-files-found: error
      - name: Copy backup to R2 when configured
        if: ${{ vars.HIFISCOUT_BACKUP_BUCKET != '' }}
        run: >-
          npx wrangler r2 object put
          "${{ vars.HIFISCOUT_BACKUP_BUCKET }}/d1/${{ steps.export.outputs.file }}"
          --remote
          --file="${{ steps.export.outputs.file }}"
          --content-type=application/gzip
          --force
