name: Apply E2E Title Control Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/e2e-product-title-control'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update stale product-title expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/tests/catalog.spec.ts')
          text = path.read_text()
          old = '''    const titleLink = page.locator(".product-title-link").first();
              await expect(titleLink).toBeVisible();
              await expect(titleLink).toHaveAttribute("target", "_blank");'''.replace('              ', '    ')
          new = '''    const titleControl = page.locator(".product-title-link").first();
              await expect(titleControl).toBeVisible();
              await expect(titleControl).toHaveAttribute("data-offers", /.+/);'''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('expected stale E2E snippet was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- e2e/tests/catalog.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/tests/catalog.spec.ts
          git commit -m 'fix(e2e): assert product offer control semantics'
          git push origin HEAD:${{ github.head_ref }}
