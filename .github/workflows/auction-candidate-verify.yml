name: Auction candidate verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auction-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/703-yahoo-auction-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - name: Package the candidate and pinned dependencies without checkout credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/auction-candidate
          git ls-files -z | tar --null -T - -czf /tmp/auction-candidate/source.tgz
          tar -czf /tmp/auction-candidate/dependencies.tgz node_modules
          tar -C "$HOME" -czf /tmp/auction-candidate/runtime.tgz .vite-plus
          git rev-parse HEAD > /tmp/auction-candidate/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auction-candidate-environment
          path: /tmp/auction-candidate/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Run canonical verification and retain any formatter changes
        shell: bash
        run: |
          set +e
          vp run verify
          result=$?
          echo '::group::Candidate formatter patch'
          git diff --
          echo '::endgroup::'
          exit "$result"
