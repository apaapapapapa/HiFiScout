name: Temporary category taxonomy PR trigger v3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/refine-audio-category-taxonomy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/refine-audio-category-taxonomy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract, harden and apply patch
        shell: bash
        run: |
          python3 <<'PYEXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/tmp-category-taxonomy-patch.yml').read_text()
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script = '\n'.join(lines) + '\n'
          old = "text = replace_once(text, old_cd_rule, new_cd_rule, 'cd transport rule')"
          new = """pattern = r'  \\[\\n    \\\"cd_sacd_player\\\",\\n    /.*?\\n  \\],'
          text, count = re.subn(pattern, lambda _match: new_cd_rule.rstrip(), text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f\"cd transport rule: expected 1 rule block, got {count}\")"""
          if script.count(old) != 1:
              raise SystemExit(f'expected one CD rule application line, got {script.count(old)}')
          script = script.replace(old, new, 1)
          Path('/tmp/apply-category-taxonomy.py').write_text(script)
          PYEXTRACT
          python3 /tmp/apply-category-taxonomy.py
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npm run format
      - name: Validate
        run: npm run check
      - name: Commit implementation and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/tmp-category-taxonomy-patch.yml
          rm .github/workflows/tmp-category-taxonomy-pr-trigger.yml
          rm .github/workflows/tmp-category-taxonomy-pr-trigger-v2.yml
          rm .github/workflows/tmp-category-taxonomy-pr-trigger-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine audio category taxonomy"
          git push origin HEAD:feat/refine-audio-category-taxonomy
