name: Agent fix cable DQ model scope

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply cable model-optional category fix
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("src/db/data-quality-repository.ts")
          text = p.read_text()
          old = '''const MODEL_OPTIONAL_CATEGORIES = [
            "cable",
            "rack",
            "power_accessory",
            "vacuum_tube",
            "other_accessory",
            "other",
          ];'''
          new = '''const MODEL_OPTIONAL_CATEGORIES = [
            "cable",
            "cable_xlr",
            "cable_rca",
            "cable_phono",
            "cable_usb",
            "cable_lan",
            "cable_digital",
            "cable_power",
            "cable_other",
            "rack",
            "power_accessory",
            "vacuum_tube",
            "other_accessory",
            "other",
          ];'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("data-quality MODEL_OPTIONAL_CATEGORIES state is unexpected")
          p.write_text(text)

          p = Path(".github/workflows/deploy.yml")
          text = p.read_text()
          old_sql = "'other_accessory','cable','rack','power_accessory','vacuum_tube','other'"
          new_sql = "'other_accessory','cable','cable_xlr','cable_rca','cable_phono','cable_usb','cable_lan','cable_digital','cable_power','cable_other','rack','power_accessory','vacuum_tube','other'"
          old_count = text.count(old_sql)
          new_count = text.count(new_sql)
          if old_count == 3:
              text = text.replace(old_sql, new_sql)
          elif not (old_count == 0 and new_count == 3):
              raise SystemExit(f"unexpected deploy baseline lists: old={old_count}, new={new_count}")
          p.write_text(text)

          p = Path("test/data-quality-repository.test.ts")
          text = p.read_text()
          if '"cable_xlr"' not in text:
              pattern = r'(test\("model expectation excludes canonical accessory categories and other", async \(\) => \{\n)\s*assert\.deepEqual\(MODEL_OPTIONAL_CATEGORIES, \[.*?\n\s*\]\);'
              replacement = r'''\1  assert.deepEqual(MODEL_OPTIONAL_CATEGORIES, [
            "cable",
            "cable_xlr",
            "cable_rca",
            "cable_phono",
            "cable_usb",
            "cable_lan",
            "cable_digital",
            "cable_power",
            "cable_other",
            "rack",
            "power_accessory",
            "vacuum_tube",
            "other_accessory",
            "other",
          ]);'''
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected one data-quality test expectation, found {count}")
          p.write_text(text)

      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npx oxfmt --write src/db/data-quality-repository.ts test/data-quality-repository.test.ts .github/workflows/deploy.yml
      - name: Validate
        run: |
          npm run check
          npm run build
      - name: Commit source and test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/db/data-quality-repository.ts test/data-quality-repository.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: exclude cable leaves from model quality metrics'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Export validated deploy workflow
        shell: bash
        run: |
          echo 'DEPLOY_YML_BASE64_BEGIN'
          base64 -w0 .github/workflows/deploy.yml
          echo
          echo 'DEPLOY_YML_BASE64_END'
