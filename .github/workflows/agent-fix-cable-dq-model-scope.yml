name: Agent fix cable DQ model scope

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage-deploy-blob:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build validated deploy workflow content
        shell: python
        run: |
          from pathlib import Path

          p = Path('.github/workflows/deploy.yml')
          text = p.read_text()
          old = "'other_accessory','cable','rack','power_accessory','vacuum_tube','other'"
          new = "'other_accessory','cable','cable_xlr','cable_rca','cable_phono','cable_usb','cable_lan','cable_digital','cable_power','cable_other','rack','power_accessory','vacuum_tube','other'"
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 3:
              text = text.replace(old, new)
          elif not (old_count == 0 and new_count == 3):
              raise SystemExit(f'unexpected deploy baseline lists: old={old_count}, new={new_count}')
          p.write_text(text)
      - run: npm ci
      - name: Format and validate workflow content
        run: |
          npx oxfmt --write .github/workflows/deploy.yml
          npm run check
          npm run build
      - name: Stage deploy workflow as ordinary blob file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          cp .github/workflows/deploy.yml .tmp/deploy-workflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/deploy-workflow.yml
          git commit -m 'chore: stage validated deploy workflow blob'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
