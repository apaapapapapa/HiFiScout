name: Production Operational Health

on:
  workflow_run:
    workflows: ["Deploy Cloudflare"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: production-operational-health
  cancel-in-progress: false

jobs:
  data-platform:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The bounded crawl/search convergence windows can stack; leave headroom for setup and D1 queries.
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Download deployed SHA
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deployment-identity
          path: .deployment
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve deployed SHA
        id: deployment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if [[ ! -s .deployment/deployment-sha.txt ]]; then
              echo "::notice title=Data-platform health skipped::Deploy Cloudflare completed without a new deployment identity; the deployment was deferred or already current."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sha="$(tr -d '\r\n' < .deployment/deployment-sha.txt)"
          else
            sha="$MANUAL_SHA"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployed SHA: $sha" >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.deployment.outputs.available == 'true'
        with:
          ref: ${{ steps.deployment.outputs.sha }}
      - uses: ./.github/actions/setup-node-deps
        if: steps.deployment.outputs.available == 'true'
      - name: Wait for active crawl convergence
        if: steps.deployment.outputs.available == 'true'
        run: bash scripts/wait-for-active-crawl-convergence.sh
      - name: Verify production data platform and data quality
        if: steps.deployment.outputs.available == 'true'
        run: bash scripts/production-operational-health.sh
      - name: Verify Product Search identity grouping
        if: steps.deployment.outputs.available == 'true'
        run: bash scripts/product-search-identity-health.sh
      - name: Publish data-platform health status
        if: always() && steps.deployment.outputs.available == 'true' && steps.deployment.outputs.sha != ''
        continue-on-error: true
        uses: ./.github/actions/publish-commit-status
        with:
          github-token: ${{ github.token }}
          sha: ${{ steps.deployment.outputs.sha }}
          job-status: ${{ job.status }}
          context: operations/data-platform
          description-prefix: Data platform health

  knowledge-catalog:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download deployed SHA
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deployment-identity
          path: .deployment
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve deployed SHA
        id: deployment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if [[ ! -s .deployment/deployment-sha.txt ]]; then
              echo "::notice title=Knowledge Catalog health skipped::Deploy Cloudflare completed without a new deployment identity; the deployment was deferred or already current."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sha="$(tr -d '\r\n' < .deployment/deployment-sha.txt)"
          else
            sha="$MANUAL_SHA"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployed SHA: $sha" >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.deployment.outputs.available == 'true'
        with:
          ref: ${{ steps.deployment.outputs.sha }}
      - name: Resolve production base URL
        if: steps.deployment.outputs.available == 'true'
        shell: bash
        env:
          REPOSITORY_PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          source .github/config/production.env
          base_url="${REPOSITORY_PRODUCTION_BASE_URL:-$PRODUCTION_BASE_URL}"
          echo "PRODUCTION_BASE_URL=${base_url%/}" >> "$GITHUB_ENV"
      - name: Verify Knowledge Catalog runtime operations
        if: steps.deployment.outputs.available == 'true'
        run: bash scripts/knowledge-catalog-operational-health.sh
      - name: Publish Knowledge Catalog health status
        if: always() && steps.deployment.outputs.available == 'true' && steps.deployment.outputs.sha != ''
        continue-on-error: true
        uses: ./.github/actions/publish-commit-status
        with:
          github-token: ${{ github.token }}
          sha: ${{ steps.deployment.outputs.sha }}
          job-status: ${{ job.status }}
          context: operations/knowledge-catalog
          description-prefix: Knowledge Catalog health
