name: Product Search Identity Audit

on:
  workflow_run:
    workflows: ["Deploy Cloudflare"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit product-level identity grouping
        shell: bash
        run: |
          set -euo pipefail

          query() {
            npx wrangler d1 execute DB --remote --json --command "$1" | jq '.[0].results // []'
          }

          split_groups="$(query "
            SELECT
              p.canonical_manufacturer_id,
              p.normalized_model,
              COUNT(*) AS listing_count,
              COUNT(DISTINCT p.shop_key) AS shop_count,
              COUNT(DISTINCT m.entity_id) AS entity_count
            FROM products p
            JOIN product_search_entity_offers m ON m.listing_product_id = p.id
            WHERE p.is_active = 1
              AND p.model_resolution_status = 'resolved'
              AND COALESCE(p.canonical_manufacturer_id, '') <> ''
              AND COALESCE(p.normalized_model, '') <> ''
              AND NOT EXISTS (
                SELECT 1
                FROM product_identity_resolutions r
                JOIN knowledge_catalog_products kp
                  ON kp.id = r.catalog_product_id AND kp.verification_status = 'verified'
                WHERE r.listing_product_id = p.id AND r.status = 'matched'
              )
              AND (
                SELECT COUNT(DISTINCT CASE
                  WHEN peer.primary_category_id <> 'other' THEN peer.primary_category_id
                  ELSE NULL
                END)
                FROM products peer
                WHERE peer.is_active = 1
                  AND peer.model_resolution_status = 'resolved'
                  AND COALESCE(peer.canonical_manufacturer_id, '') <> ''
                  AND COALESCE(peer.normalized_model, '') <> ''
                  AND NOT EXISTS (
                    SELECT 1
                    FROM product_identity_resolutions r2
                    JOIN knowledge_catalog_products kp2
                      ON kp2.id = r2.catalog_product_id AND kp2.verification_status = 'verified'
                    WHERE r2.listing_product_id = peer.id AND r2.status = 'matched'
                  )
                  AND peer.canonical_manufacturer_id = p.canonical_manufacturer_id
                  AND peer.normalized_model = p.normalized_model
              ) <= 1
            GROUP BY p.canonical_manufacturer_id, p.normalized_model
            HAVING COUNT(*) > 1 AND COUNT(DISTINCT m.entity_id) > 1
            ORDER BY listing_count DESC, shop_count DESC
            LIMIT 50;")"

          echo 'Safe exact identities still split across cards:'
          jq . <<< "$split_groups"
          split_count="$(jq 'length' <<< "$split_groups")"
          if [ "$split_count" -ne 0 ]; then
            echo "${split_count} safe exact product identities are still split across search entities." >&2
            exit 1
          fi

          grouped="$(query "
            SELECT
              e.manufacturer,
              e.model,
              e.offer_count,
              e.shop_count,
              e.lowest_price_yen,
              e.highest_price_yen
            FROM product_search_entities e
            WHERE e.offer_count > 1
            ORDER BY e.shop_count DESC, e.offer_count DESC, e.latest_activity_at DESC
            LIMIT 30;")"
          echo 'Representative grouped products after deployment:'
          jq . <<< "$grouped"

          candidates="$(query "
            SELECT
              p.canonical_manufacturer_id,
              MIN(p.model) AS sample_model,
              COUNT(*) AS listing_count,
              COUNT(DISTINCT p.shop_key) AS shop_count,
              GROUP_CONCAT(DISTINCT p.shop_key) AS shops
            FROM products p
            WHERE p.is_active = 1
              AND p.model_resolution_status <> 'resolved'
              AND COALESCE(p.canonical_manufacturer_id, '') <> ''
              AND COALESCE(TRIM(p.model), '') <> ''
            GROUP BY p.canonical_manufacturer_id, UPPER(TRIM(p.model))
            HAVING COUNT(*) > 1
            ORDER BY shop_count DESC, listing_count DESC
            LIMIT 30;")"
          echo 'Repeated unresolved model presentations for follow-up (diagnostic only):'
          jq . <<< "$candidates"
