name: Verify taxonomy post-merge

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-taxonomy-post-merge'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TARGET_SHA: edcba60715a9a60a3790b80cc7890d7c6150b699
      PRODUCTION_URL: https://hifiscout.tokyojp.workers.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for main CI, deployment, and full E2E
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100"

          latest_run() {
            local name="$1"
            jq -c --arg name "$name" '[.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | last // {}'
          }

          for attempt in $(seq 1 90); do
            payload="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"

            echo "=== attempt ${attempt} ==="
            jq -r '.workflow_runs | sort_by(.created_at)[] | [.name, .event, .status, (.conclusion // "-"), (.id|tostring)] | @tsv' <<<"$payload"

            failed="$(jq -r '[.workflow_runs[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "startup_failure" or .conclusion == "action_required"))] | length' <<<"$payload")"
            if [ "$failed" -gt 0 ]; then
              echo 'A post-merge workflow failed:' >&2
              jq -r '.workflow_runs[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "startup_failure" or .conclusion == "action_required")) | [.name, .conclusion, .html_url] | @tsv' <<<"$payload" >&2
              exit 1
            fi

            ci="$(latest_run CI <<<"$payload")"
            deploy="$(latest_run 'Deploy Cloudflare' <<<"$payload")"
            e2e="$(latest_run E2E <<<"$payload")"

            ci_ok="$(jq -r '.status == "completed" and .conclusion == "success"' <<<"$ci")"
            deploy_ok="$(jq -r '.status == "completed" and .conclusion == "success"' <<<"$deploy")"
            e2e_ok="$(jq -r '.status == "completed" and .conclusion == "success"' <<<"$e2e")"

            if [ "$ci_ok" = true ] && [ "$deploy_ok" = true ] && [ "$e2e_ok" = true ]; then
              echo 'Required post-merge workflows are green.'
              break
            fi

            if [ "$attempt" -eq 90 ]; then
              echo 'Post-merge workflows did not reach green within the verification window.' >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify production taxonomy metadata
        shell: bash
        run: |
          set -euo pipefail
          payload="$(curl -fsSL --retry 5 --retry-delay 2 "${PRODUCTION_URL%/}/api/meta")"
          jq -e '
            (.categoryFacets | map({key: .id, value: .}) | from_entries) as $c
            | $c.wired_headphone.name == "有線ヘッドホン"
            and $c.wired_earphone.name == "有線イヤホン"
            and $c.btw_headphone.name == "BTWヘッドホン"
            and $c.btw_earphone.name == "BTWイヤホン"
            and $c.power_strip.name == "電源タップ"
            and $c.clean_power.name == "クリーン電源"
            and $c.cd_sacd_transport.parentId == "digital"
            and $c.cd_sacd_player.parentId == "digital"
            and $c.phono_step_up_transformer.parentId == "analog"
            and $c.phono_eq.parentId == "analog"
          ' <<<"$payload" >/dev/null
          echo 'Production /api/meta exposes the refined taxonomy.'
