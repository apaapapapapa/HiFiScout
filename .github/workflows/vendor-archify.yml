name: Vendor Archify skill

on:
  push:
    branches:
      - chore/add-archify-skill

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Install Archify v2.15.0
        run: >-
          npx -y skills@1.5.23 add
          https://github.com/tt-a1i/archify/tree/v2.15.0/archify
          --skill archify
          --agent codex
          --copy
          --yes

      - name: Verify Archify runtime
        run: node .agents/skills/archify/bin/archify.mjs doctor

      - name: Commit vendored skill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills/archify skills-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: vendor Archify v2.15.0"
          git push origin HEAD:chore/add-archify-skill
