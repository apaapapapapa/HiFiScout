name: Verify cable post-merge pipeline

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_SHA: dee68ef61d0d365591fefda64cb2b0655d5c0cf4
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_BASE_URL: https://hifiscout.tokyojp.workers.dev
    steps:
      - name: Verify main CI and Cloudflare deploy
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100"
          runs="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"

          echo "Runs for ${TARGET_SHA}:"
          jq -r '.workflow_runs[] | [.id, .name, .event, .status, (.conclusion // "-"), .html_url] | @tsv' <<< "$runs" | sort -k2

          ci="$(jq -r '[.workflow_runs[] | select(.name == "CI" and .event == "push")][0].conclusion // "missing"' <<< "$runs")"
          deploy="$(jq -r '[.workflow_runs[] | select(.name == "Deploy Cloudflare")][0].conclusion // "missing"' <<< "$runs")"
          test "$ci" = success
          test "$deploy" = success

          e2e_id="$(jq -r '[.workflow_runs[] | select(.name == "E2E")][0].id // empty' <<< "$runs")"
          if [[ -n "$e2e_id" ]]; then
            echo "E2E_RUN_ID=${e2e_id}" >> "$GITHUB_ENV"
            echo "E2E run id: ${e2e_id}"
            curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${e2e_id}/jobs?per_page=100" \
              | jq -r '.jobs[] | [.id, .name, .status, (.conclusion // "-"), .html_url] | @tsv'
          fi

      - name: Verify production endpoint is reachable
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl -sS --retry 3 --retry-delay 2 -o "$body" -w '%{http_code}' "${PRODUCTION_BASE_URL}/api/health")"
          response="$(cat "$body")"

          if jq -e . >/dev/null 2>&1 <<< "$response"; then
            jq . <<< "$response"
            jq -e '.shops[] | select(.shopKey == "audiounion" and .configured == true)' <<< "$response" >/dev/null
            echo "Production health endpoint returned JSON over HTTP ${status}; overall shop health may be non-green independently of deploy success."
          elif [[ "$status" == "429" ]] && grep -Eqi 'Error[[:space:]]+1027' <<< "$response"; then
            echo "Cloudflare Worker request quota is exhausted (1027); deploy success above remains authoritative."
          else
            echo "Unexpected production health response HTTP ${status}:" >&2
            cat "$body" >&2
            exit 1
          fi
