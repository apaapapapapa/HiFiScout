name: Sync AudioUnion Relay Secret

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-audiounion-relay-secret
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ap-northeast-1
      FUNCTION_NAME: hifiscout-audiounion-fetcher
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Synchronize relay token to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          relay_token="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables.RELAY_TOKEN' \
            --output text)"

          if [ -z "$relay_token" ] || [ "$relay_token" = "None" ]; then
            echo "Lambda RELAY_TOKEN is not configured."
            exit 1
          fi

          printf '%s' "$relay_token" | npx wrangler secret put AUDIOUNION_RELAY_TOKEN
          echo "AudioUnion relay token synchronized without exposing its value."

      - name: Verify secret is registered
        run: |
          npx wrangler secret list | jq -e '.[] | select(.name == "AUDIOUNION_RELAY_TOKEN")' >/dev/null
          echo "AUDIOUNION_RELAY_TOKEN is registered in Cloudflare."

      - name: Wait for AudioUnion health recovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            response="$(curl -fsS --retry 2 --retry-delay 1 https://hifiscout.raha3415kohei.workers.dev/api/health)"
            status="$(jq -r '.shops[] | select(.shopKey == "audiounion") | .status' <<< "$response")"
            reason="$(jq -r '.shops[] | select(.shopKey == "audiounion") | .reason' <<< "$response")"
            failures="$(jq -r '.shops[] | select(.shopKey == "audiounion") | .consecutiveFailures' <<< "$response")"
            echo "AudioUnion health: status=$status reason=$reason failures=$failures (attempt $attempt/24)"

            if [ "$status" = "healthy" ]; then
              jq '.shops[] | select(.shopKey == "audiounion")' <<< "$response"
              exit 0
            fi

            sleep 15
          done

          echo "AudioUnion did not recover within the verification window."
          npx wrangler d1 execute DB --remote --command \
            "SELECT shop_key, last_attempt_at, last_success_at, consecutive_failures, last_error, last_item_count, queued_at FROM shop_sync_state WHERE shop_key = 'audiounion'"
          exit 1
