name: Sync AudioUnion Relay Secret

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-audiounion-relay-secret
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ap-northeast-1
      FUNCTION_NAME: hifiscout-audiounion-fetcher
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Synchronize shared relay secrets to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          relay_token="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables.RELAY_TOKEN' \
            --output text)"
          relay_url="$(aws lambda get-function-url-config \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'FunctionUrl' \
            --output text)"

          if [ -z "$relay_token" ] || [ "$relay_token" = "None" ]; then
            echo "Lambda RELAY_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$relay_url" ] || [ "$relay_url" = "None" ]; then
            echo "Lambda Function URL is not configured."
            exit 1
          fi

          secrets_json="$(jq -cn \
            --arg relay_url "$relay_url" \
            --arg relay_token "$relay_token" \
            '{CRAWL_RELAY_URL: $relay_url, CRAWL_RELAY_TOKEN: $relay_token}')"

          status=1
          for attempt in $(seq 1 60); do
            set +e
            output="$(printf '%s' "$secrets_json" | npx wrangler secret bulk 2>&1)"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Shared relay URL and token synchronized without exposing their values."
              break
            fi

            if grep -Fq "latest version of your Worker isn't currently deployed" <<< "$output"; then
              echo "Cloudflare has an undeployed Worker version; retrying relay secret sync (attempt $attempt/60)."
              sleep 5
              continue
            fi

            echo "$output" >&2
            exit "$status"
          done

          if [ "$status" -ne 0 ]; then
            echo "Timed out waiting for the latest Cloudflare Worker version to be deployed."
            exit 1
          fi

      - name: Verify shared relay secrets are registered
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(npx wrangler secret list)"
          jq -e '.[] | select(.name == "CRAWL_RELAY_URL")' <<< "$secrets" >/dev/null
          jq -e '.[] | select(.name == "CRAWL_RELAY_TOKEN")' <<< "$secrets" >/dev/null
          echo "Shared relay URL and token are registered in Cloudflare."
