name: Sync AudioUnion Relay Secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-audiounion-relay-secret.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-audiounion-relay-secret
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ap-northeast-1
      FUNCTION_NAME: hifiscout-audiounion-fetcher
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Synchronize relay token to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          relay_token="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables.RELAY_TOKEN' \
            --output text)"

          if [ -z "$relay_token" ] || [ "$relay_token" = "None" ]; then
            echo "Lambda RELAY_TOKEN is not configured."
            exit 1
          fi

          printf '%s' "$relay_token" | npx wrangler secret put AUDIOUNION_RELAY_TOKEN
          echo "AudioUnion relay token synchronized without exposing its value."

      - name: Verify secret is registered
        run: |
          npx wrangler secret list | jq -e '.[] | select(.name == "AUDIOUNION_RELAY_TOKEN")' >/dev/null
          echo "AUDIOUNION_RELAY_TOKEN is registered in Cloudflare."
