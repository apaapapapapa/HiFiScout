name: Sync AudioUnion Relay Secret

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-audiounion-relay-secret
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ap-northeast-1
      FUNCTION_NAME: hifiscout-audiounion-fetcher
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CRAWL_QUEUE_NAME: hifiscout-crawl

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Synchronize relay token to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          relay_token="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables.RELAY_TOKEN' \
            --output text)"

          if [ -z "$relay_token" ] || [ "$relay_token" = "None" ]; then
            echo "Lambda RELAY_TOKEN is not configured."
            exit 1
          fi

          printf '%s' "$relay_token" | npx wrangler secret put AUDIOUNION_RELAY_TOKEN
          echo "AudioUnion relay token synchronized without exposing its value."

      - name: Verify relay secrets are registered
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(npx wrangler secret list)"
          jq -e '.[] | select(.name == "AUDIOUNION_RELAY_URL")' <<< "$secrets" >/dev/null
          jq -e '.[] | select(.name == "AUDIOUNION_RELAY_TOKEN")' <<< "$secrets" >/dev/null
          echo "AudioUnion relay URL and token are registered in Cloudflare."

      - name: Record verification start
        shell: bash
        run: |
          set -euo pipefail
          echo "VERIFY_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_ENV"

      - name: Force a fresh AudioUnion crawl through Cloudflare Queue
        shell: bash
        run: |
          set -euo pipefail
          queues="$(curl -fsS --retry 3 --retry-delay 2 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          queue_id="$(jq -r --arg name "$CRAWL_QUEUE_NAME" '.result[] | select(.queue_name == $name) | .queue_id' <<< "$queues" | head -n 1)"

          if [ -z "$queue_id" ] || [ "$queue_id" = "null" ]; then
            echo "Cloudflare Queue $CRAWL_QUEUE_NAME was not found."
            exit 1
          fi

          payload="$(jq -nc --arg requestedAt "$VERIFY_STARTED_AT" \
            '{body:{shopKey:"audiounion",force:true,requestedAt:$requestedAt},content_type:"json"}')"
          response="$(curl -fsS --retry 3 --retry-delay 2 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${queue_id}/messages" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          jq -e '.success == true' <<< "$response" >/dev/null
          echo "Fresh AudioUnion crawl message submitted at $VERIFY_STARTED_AT."

      - name: Verify fresh crawl persisted products
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            result="$(npx wrangler d1 execute DB --remote --json --command "
              SELECT
                s.shop_key,
                s.last_attempt_at,
                s.last_success_at,
                s.consecutive_failures,
                s.last_error,
                s.last_item_count,
                s.queued_at,
                (SELECT COUNT(*) FROM products p WHERE p.shop_key = 'audiounion' AND p.is_active = 1) AS active_product_count,
                (SELECT item_count FROM crawl_runs r WHERE r.shop_key = 'audiounion' AND r.started_at >= '${VERIFY_STARTED_AT}' ORDER BY r.id DESC LIMIT 1) AS verified_run_item_count,
                (SELECT status FROM crawl_runs r WHERE r.shop_key = 'audiounion' AND r.started_at >= '${VERIFY_STARTED_AT}' ORDER BY r.id DESC LIMIT 1) AS verified_run_status
              FROM shop_sync_state s
              WHERE s.shop_key = 'audiounion';")"
            row="$(jq -c '.[0].results[0] // {}' <<< "$result")"

            last_attempt="$(jq -r '.last_attempt_at // ""' <<< "$row")"
            last_success="$(jq -r '.last_success_at // ""' <<< "$row")"
            failures="$(jq -r '.consecutive_failures // 0' <<< "$row")"
            last_item_count="$(jq -r '.last_item_count // 0' <<< "$row")"
            active_product_count="$(jq -r '.active_product_count // 0' <<< "$row")"
            run_item_count="$(jq -r '.verified_run_item_count // 0' <<< "$row")"
            run_status="$(jq -r '.verified_run_status // ""' <<< "$row")"

            echo "AudioUnion verification: attempt=$last_attempt success=$last_success failures=$failures last_items=$last_item_count active_products=$active_product_count run_status=$run_status run_items=$run_item_count ($attempt/36)"

            if [[ "$last_attempt" > "$VERIFY_STARTED_AT" ]] \
              && [[ "$last_success" > "$VERIFY_STARTED_AT" ]] \
              && [ "$failures" -eq 0 ] \
              && [ "$last_item_count" -gt 0 ] \
              && [ "$active_product_count" -gt 0 ] \
              && [ "$run_status" = "success" ] \
              && [ "$run_item_count" -gt 0 ]; then
              jq . <<< "$row"
              exit 0
            fi

            sleep 10
          done

          echo "AudioUnion did not complete a fresh non-empty crawl within the verification window."
          npx wrangler d1 execute DB --remote --command \
            "SELECT shop_key, last_attempt_at, last_success_at, consecutive_failures, last_error, last_item_count, queued_at FROM shop_sync_state WHERE shop_key = 'audiounion'"
          npx wrangler d1 execute DB --remote --command \
            "SELECT id, started_at, finished_at, status, item_count, page_count, message FROM crawl_runs WHERE shop_key = 'audiounion' ORDER BY id DESC LIMIT 5"
          exit 1
