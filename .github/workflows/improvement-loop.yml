name: Improvement loop intake

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Failed CI run to inspect
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: improvement-loop-intake-${{ github.event.workflow_run.id || inputs.ci_run_id }}
  cancel-in-progress: false

jobs:
  intake:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A workflow_run payload is untrusted input. Execute only the trusted main collector.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - name: Collect bounded CI tasks
        env:
          GH_TOKEN: ${{ github.token }}
          LOOP_CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        run: vp run harness loop intake-ci "$GITHUB_REPOSITORY" "$LOOP_CI_RUN_ID" .generated/loop-intake
      - name: Preserve intake and contracts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loop-intake
          path: .generated/loop-intake/
          retention-days: 30
          if-no-files-found: warn
