name: Deploy Catalog Admin

on:
  workflow_run:
    workflows: ["Deploy Cloudflare"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: cloudflare-catalog-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CATALOG_ADMIN_WORKER: hifiscout-admin
      CATALOG_ADMIN_DOMAIN: hifiscout-admin.tokyojp.workers.dev
    steps:
      - name: Download deployed SHA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deployment-identity
          path: .deployment
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve deployed SHA
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < .deployment/deployment-sha.txt)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployed SHA: $sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.deployment.outputs.sha }}
      - uses: ./.github/actions/setup-node-deps
      - name: Build catalog admin browser assets
        run: npm run build:frontend:admin
      - name: Deploy fail-closed admin Worker
        run: >-
          npx wrangler deploy --config wrangler.admin.jsonc
          --var ACCESS_TEAM_DOMAIN:https://invalid.cloudflareaccess.com
          --var ACCESS_AUD:unconfigured
      - name: Provision Cloudflare Access
        id: access
        run: npx tsx scripts/provision-catalog-admin-access.ts
      - name: Deploy admin Worker with Access verification
        run: >-
          npx wrangler deploy --config wrangler.admin.jsonc
          --var ACCESS_TEAM_DOMAIN:${{ steps.access.outputs.access_team_domain }}
          --var ACCESS_AUD:${{ steps.access.outputs.access_aud }}
      - name: Verify public Worker no longer exposes Catalog Admin
        shell: bash
        run: |
          set -euo pipefail
          public_base="https://hifiscout.tokyojp.workers.dev"
          page="$(curl -fsS --max-time 20 "${public_base}/catalog-admin" || true)"
          if grep -q "Knowledge Catalog 管理" <<< "$page"; then
            echo "Public Worker still serves the Catalog Admin page." >&2
            exit 1
          fi
          status="$(curl -sS -o /tmp/public-admin-api -w '%{http_code}' --max-time 20 "${public_base}/api/admin/knowledge-catalog/products")"
          if [[ "$status" != "404" ]]; then
            echo "Expected retired public Catalog Admin API to return 404; got ${status}." >&2
            cat /tmp/public-admin-api >&2
            exit 1
          fi
      - name: Verify Cloudflare Access protects admin Worker without redirect loops
        shell: bash
        env:
          ADMIN_URL: ${{ steps.access.outputs.admin_url }}
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          status="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --max-time 20 "$ADMIN_URL")"
          location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, ""); print substr($0, 11) }' "$headers" | tail -1)"
          if [[ ! "$status" =~ ^30[12378]$ ]] || [[ "$location" != *"/cdn-cgi/access/"* ]]; then
            echo "Expected an initial Cloudflare Access challenge; got HTTP ${status}, location=${location}." >&2
            cat "$body" >&2
            exit 1
          fi
          echo "Initial Cloudflare Access challenge confirmed (${status})."

          follow="$(curl -LsS --max-redirs 8 -o "$body" -w '%{http_code}|%{url_effective}' --max-time 20 "$ADMIN_URL")"
          final_status="${follow%%|*}"
          effective_url="${follow#*|}"
          echo "Access redirect chain terminated with HTTP ${final_status} at ${effective_url}."
          if [[ "$final_status" != "200" ]] || [[ "$effective_url" != *".cloudflareaccess.com/cdn-cgi/access/"* ]]; then
            echo "Cloudflare Access login did not terminate at its login page." >&2
            cat "$body" >&2
            exit 1
          fi
          echo "Cloudflare Access login page reached without a redirect loop."
      - name: Publish Catalog Admin deployment status
        if: always() && steps.deployment.outputs.sha != ''
        uses: ./.github/actions/publish-commit-status
        with:
          github-token: ${{ github.token }}
          sha: ${{ steps.deployment.outputs.sha }}
          job-status: ${{ job.status }}
          context: deployment/catalog-admin
          description-prefix: Catalog Admin deployment
