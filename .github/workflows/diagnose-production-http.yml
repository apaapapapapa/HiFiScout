name: Diagnose Production HTTP

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-production-http.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - name: Probe production surfaces with Worker tail
        shell: bash
        run: |
          set -uo pipefail
          base="https://hifiscout.tokyojp.workers.dev"
          tail_log="$(mktemp)"
          trap 'rm -f "$tail_log"' EXIT

          timeout 30s vp exec wrangler tail hifiscout --format=json >"$tail_log" 2>&1 &
          tail_pid=$!
          sleep 5

          probe() {
            local label="$1"
            local path="$2"
            local headers body status
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "${base}${path}" || true)"
            echo "=== ${label} ${path} ==="
            echo "HTTP ${status}"
            grep -Ei '^(content-type|cf-ray|server|cache-control):' "$headers" || true
            head -c 600 "$body" || true
            echo
            rm -f "$headers" "$body"
          }

          probe static-asset "/styles.css"
          probe worker-root "/"
          probe api-unknown "/api/__diagnostic_not_found"
          probe api-meta "/api/meta"
          probe api-health "/api/health"
          probe api-feed "/api/feed?manufacturer=TAD&inStock=true&limit=2"

          sleep 5
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo "=== worker-tail ==="
          cat "$tail_log"
