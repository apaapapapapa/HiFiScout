name: Agent speaker and AV amp taxonomy update

on:
  push:
    branches:
      - feat/expand-speaker-avamp-categories

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply taxonomy changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          def regex_replace_once(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex replacement, found {count}: {pattern!r}")
              p.write_text(updated)

          replace_once(
              "src/catalog/types.ts",
              '  | "headphone_amp"\n  | "dac"',
              '  | "headphone_amp"\n  | "av_amp"\n  | "dac"',
          )
          replace_once(
              "src/catalog/types.ts",
              '  | "speaker_floorstanding"\n  | "subwoofer"\n  | "speaker_other"',
              '  | "speaker_floorstanding"\n  | "center_speaker"\n  | "subwoofer"\n  | "active_speaker"',
          )
          replace_once(
              "src/catalog/types.ts",
              "/** Every id present in `CATEGORIES` (36 entries). */",
              "/** Every id present in `CATEGORIES` (38 entries). */",
          )

          av_amp = '''  {
            id: "av_amp",
            name: "AVアンプ",
            parentId: "amplifier",
            order: 5,
            classifiable: true,
            filterable: true,
            aliases: [
              "av amp",
              "av amplifier",
              "av receiver",
              "audio video receiver",
              "AVアンプ",
              "AVレシーバー",
              "AVレシーバ",
            ],
          },

          '''
          replace_once(
              "src/catalog/categories.ts",
              '  {\n    id: "digital",',
              av_amp + '  {\n    id: "digital",',
          )

          replace_once(
              "src/catalog/categories.ts",
              '    name: "フロア型",\n    parentId: "speaker",',
              '    name: "フロア型・トールボーイ",\n    parentId: "speaker",',
          )
          replace_once(
              "src/catalog/categories.ts",
              '      "トールボーイ",\n      "フロア型",',
              '      "トールボーイ",\n      "フロア型・トールボーイ",\n      "フロア型",',
          )

          center = '''  {
            id: "center_speaker",
            name: "センタースピーカー",
            parentId: "speaker",
            order: 3,
            classifiable: true,
            filterable: true,
            aliases: [
              "center speaker",
              "centre speaker",
              "center channel speaker",
              "centre channel speaker",
              "センタースピーカー",
              "センター・スピーカー",
            ],
          },
          '''
          replace_once(
              "src/catalog/categories.ts",
              '  {\n    id: "subwoofer",\n    name: "サブウーファー",\n    parentId: "speaker",\n    order: 3,',
              center + '  {\n    id: "subwoofer",\n    name: "サブウーファー",\n    parentId: "speaker",\n    order: 4,',
          )

          active = '''  {
            id: "active_speaker",
            name: "アクティブスピーカー",
            parentId: "speaker",
            order: 5,
            classifiable: true,
            filterable: true,
            aliases: [
              "active speaker",
              "active speakers",
              "powered speaker",
              "powered speakers",
              "powered monitor",
              "powered monitors",
              "アクティブスピーカー",
              "パワードスピーカー",
            ],
          },

          '''
          regex_replace_once(
              "src/catalog/categories.ts",
              r'  \{\n    id: "speaker_other",\n.*?  \},\n\n',
              active,
          )

          for old in [
              '      "av receiver",\n',
              '      "av amplifier",\n',
              '      "av amp",\n',
              '      "AVアンプ",\n',
              '      "AVレシーバー",\n',
          ]:
              replace_once("src/catalog/categories.ts", old, "")

          replace_once(
              "src/catalog/category-rules.ts",
              '  ["rack", /audio\\s+rack|オーディオラック/i],\n  ["speaker_other", /\\bsound\\s*bars?\\b|サウンドバー/i],\n',
              '  ["rack", /audio\\s+rack|オーディオラック/i],\n'
              '  ["av_amp", /\\bav\\s+(?:receiver|amplifier|amp)\\b|audio\\s+video\\s+receiver|av(?:サラウンド)?(?:レシーバ(?:ー)?|アンプ)|\\bavr[-\\s]?[a-z0-9]/i],\n',
          )
          replace_once(
              "src/catalog/category-rules.ts",
              '    /\\bav\\s+(?:receiver|amplifier)\\b|av(?:サラウンド)?(?:レシーバー|アンプ)|\\bavr[-\\s]?[a-z0-9]|voicing\\s+equalizer|graphic\\s+equalizer|\\bequalizer\\b|音場補正|イコライザ(?:ー)?|frequency\\s+dividing\\s+network|channel\\s+divider|\\bcrossover\\b|チャンネル(?:デバイダ|ディバイダ)(?:ー)?|周波数分割|(?:dds\\s+)?(?:fm|am\\s*\\/\\s*fm)\\s+stereo\\s+tuner|\\btuner\\b|チューナー/i,',
              '    /voicing\\s+equalizer|graphic\\s+equalizer|\\bequalizer\\b|音場補正|イコライザ(?:ー)?|frequency\\s+dividing\\s+network|channel\\s+divider|\\bcrossover\\b|チャンネル(?:デバイダ|ディバイダ)(?:ー)?|周波数分割|(?:dds\\s+)?(?:fm|am\\s*\\/\\s*fm)\\s+stereo\\s+tuner|\\btuner\\b|チューナー/i,',
          )
          replace_once(
              "src/catalog/category-rules.ts",
              '  ["speaker_bookshelf", /bookshelf(?:\\s+speaker)?|stand[\\s-]?mount|ブックシェルフ(?:型)?/i],\n',
              '  ["active_speaker", /active\\s+speakers?|powered\\s+(?:speakers?|monitors?)|アクティブスピーカー|パワードスピーカー/i],\n'
              '  ["center_speaker", /cent(?:er|re)(?:\\s+channel)?\\s+speaker|センター(?:・)?スピーカー/i],\n'
              '  ["speaker_bookshelf", /bookshelf(?:\\s+speaker)?|stand[\\s-]?mount|ブックシェルフ(?:型)?/i],\n',
          )
          replace_once(
              "src/catalog/category-rules.ts",
              '  ["subwoofer", /sub[\\s-]?woofer|サブウーファー/i],\n  ["speaker_other", /\\bspeakers?\\b|スピーカー/i],\n',
              '  ["subwoofer", /sub[\\s-]?woofer|サブウーファー/i],\n'
              '  ["other", /\\bsound\\s*bars?\\b|サウンドバー|\\bspeakers?\\b|スピーカー/i],\n',
          )

          replace_once(
              "src/catalog/product-normalizer.ts",
              "const CLASSIFICATION_METADATA_VERSION = 4;",
              "const CLASSIFICATION_METADATA_VERSION = 5;",
          )

          replace_once(
              "test/category-taxonomy-v2.test.ts",
              '["integrated_amp", "pre_amp", "power_amp", "headphone_amp"],',
              '["integrated_amp", "pre_amp", "power_amp", "headphone_amp", "av_amp"],',
          )
          replace_once(
              "test/category-taxonomy-v2.test.ts",
              '["speaker_bookshelf", "speaker_floorstanding", "subwoofer", "speaker_other"],',
              '[\n      "speaker_bookshelf",\n      "speaker_floorstanding",\n      "center_speaker",\n      "subwoofer",\n      "active_speaker",\n    ],',
          )
          replace_once(
              "test/category-taxonomy-v2.test.ts",
              '  assert.deepEqual(inferExplicitCategoryIds("DHT-S217 Soundbar", { context: "detail" }), [\n    "speaker_other",\n  ]);',
              '  assert.deepEqual(inferExplicitCategoryIds("DHT-S217 Soundbar", { context: "detail" }), [\n    "other",\n  ]);',
          )
          replace_once(
              "test/category-taxonomy-v2.test.ts",
              '  assert.deepEqual(inferExplicitCategoryIds("RX-V4A AV Receiver", { context: "detail" }), [\n    "other",\n  ]);',
              '  assert.deepEqual(inferExplicitCategoryIds("RX-V4A AV Receiver", { context: "detail" }), [\n    "av_amp",\n  ]);',
          )
          replace_once(
              "test/category-taxonomy-v2.test.ts",
              'test("speaker classification uses strong form-factor evidence only", () => {\n  assert.equal(classify("Bookshelf Speaker Model A").primaryCategoryId, "speaker_bookshelf");\n  assert.equal(\n    classify("Floorstanding Speaker Model B").primaryCategoryId,\n    "speaker_floorstanding",\n  );\n  assert.equal(classify("Subwoofer Model C").primaryCategoryId, "subwoofer");\n  assert.equal(classify("Speaker Model D").primaryCategoryId, "speaker_other");\n  assert.equal(classify("SUB Model E").primaryCategoryId, "other");\n});',
              'test("speaker classification uses the requested five canonical leaves", () => {\n  assert.equal(classify("Bookshelf Speaker Model A").primaryCategoryId, "speaker_bookshelf");\n  assert.equal(\n    classify("Floorstanding Speaker Model B").primaryCategoryId,\n    "speaker_floorstanding",\n  );\n  assert.equal(classify("Center Speaker Model C").primaryCategoryId, "center_speaker");\n  assert.equal(classify("Subwoofer Model D").primaryCategoryId, "subwoofer");\n  assert.equal(classify("Active Speaker Model E").primaryCategoryId, "active_speaker");\n  assert.equal(\n    classify("Active Bookshelf Speaker Model F").primaryCategoryId,\n    "active_speaker",\n  );\n  assert.equal(classify("Speaker Model G").primaryCategoryId, "other");\n  assert.equal(classify("SUB Model H").primaryCategoryId, "other");\n});',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format touched files
        run: npx oxfmt src/catalog/categories.ts src/catalog/types.ts src/catalog/category-rules.ts src/catalog/product-normalizer.ts test/category-taxonomy-v2.test.ts

      - name: Validate
        run: |
          npm run check
          npm run build

      - name: Commit implementation
        run: |
          rm .github/workflows/agent-speaker-avamp-expansion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalog/categories.ts src/catalog/types.ts src/catalog/category-rules.ts src/catalog/product-normalizer.ts test/category-taxonomy-v2.test.ts .github/workflows/agent-speaker-avamp-expansion.yml
          git commit -m "feat: expand speaker and AV amplifier categories"
          git push origin HEAD:feat/expand-speaker-avamp-categories
