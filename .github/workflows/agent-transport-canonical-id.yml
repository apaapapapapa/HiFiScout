name: Agent transport canonical id migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/transport-canonical-id'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show legacy transport references before migration
        run: grep -RInE 'cd_sacd_transport|network_transport' src test e2e scripts frontend infra .github --exclude='agent-transport-canonical-id.yml' || true
      - name: Migrate canonical transport id
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path('src'), Path('test'), Path('e2e'), Path('scripts'), Path('frontend'), Path('infra')]
          suffixes = {'.ts', '.tsx', '.mts', '.cts'}
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in suffixes:
                      text = path.read_text()
                      if 'cd_sacd_transport' in text:
                          path.write_text(text.replace('cd_sacd_transport', 'transport'))

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old!r}')
              p.write_text(text.replace(old, new))

          # The former canonical id becomes a legacy alias alongside network_transport.
          replace(
              'src/catalog/types.ts',
              'export type LegacyCategoryAlias =\n  | "network_transport"',
              'export type LegacyCategoryAlias =\n  | "network_transport"\n  | "cd_sacd_transport"',
          )
          replace(
              'src/catalog/categories.ts',
              'const LEGACY_ALIASES: Readonly<Record<string, ClassifiableCategoryId>> = Object.freeze({\n  network_transport: "transport",',
              'const LEGACY_ALIASES: Readonly<Record<string, ClassifiableCategoryId>> = Object.freeze({\n  network_transport: "transport",\n  cd_sacd_transport: "transport",',
          )
          replace(
              'src/catalog/categories.ts',
              '    // Historical id retained so existing URLs/data remain compatible; the category is now medium-agnostic.\n    id: "transport",',
              '    id: "transport",',
          )
          replace(
              'src/catalog/product-normalizer.ts',
              'const CLASSIFICATION_METADATA_VERSION = 8;',
              'const CLASSIFICATION_METADATA_VERSION = 9;',
          )
          # First-party mappings must emit the canonical id directly; legacy ids are input compatibility only.
          replace(
              'src/crawler/shops/hifido.ts',
              '  ネットワークトランスポート: "network_transport",',
              '  ネットワークトランスポート: "transport",',
          )
          replace(
              'src/catalog/types.ts',
              ' * aliases (`network_transport`, `accessory`) and to group ids, and a value may be an',
              ' * legacy aliases (for compatibility), canonical ids and group ids, and a value may be an',
          )

          # Lock both legacy ids to the new canonical id and ensure neither appears in canonical definitions.
          taxonomy = Path('test/category-taxonomy-v2.test.ts')
          text = taxonomy.read_text()
          needle = '  assert.equal(categoryIdForFilter("network_transport"), "transport");'
          if needle not in text:
              raise SystemExit('legacy network transport assertion not found')
          text = text.replace(
              needle,
              needle + '\n  assert.equal(categoryIdForFilter("cd_sacd_transport"), "transport");\n  assert.equal(getCategory("cd_sacd_transport")?.id, "transport");\n  assert.equal(CATEGORIES.map((category) => String(category.id)).includes("cd_sacd_transport"), false);',
          )
          taxonomy.write_text(text)

          feature_test = Path('test/category-feature-query.test.ts')
          text = feature_test.read_text()
          anchor = '''test("legacy network transport filter resolves to transport", async () => {\n  const db = captureDatabase();\n  await searchProducts(db, productQuery("?category=network_transport"));\n  assert.equal(db.calls[0].binds[0], "transport");\n});'''
          if anchor not in text:
              raise SystemExit('legacy transport filter test anchor not found')
          text = text.replace(
              anchor,
              anchor + '''\n\ntest("legacy CD/SACD transport filter resolves to transport", async () => {\n  const db = captureDatabase();\n  await searchProducts(db, productQuery("?category=cd_sacd_transport"));\n  assert.equal(db.calls[0].binds[0], "transport");\n});''',
          )
          feature_test.write_text(text)
          PY
      - name: Format changed files
        run: npx oxfmt src/catalog/types.ts src/catalog/categories.ts src/catalog/category-rules.ts src/catalog/product-normalizer.ts src/crawler/shops/hifido.ts test/category-taxonomy-v2.test.ts test/category-taxonomy-refinement.test.ts test/catalog-normalization.test.ts test/category-feature-query.test.ts e2e/tests/category-taxonomy.spec.ts
      - name: Verify legacy ids only remain as compatibility aliases/tests
        shell: bash
        run: |
          echo '=== remaining legacy transport id references ==='
          grep -RInE 'cd_sacd_transport|network_transport' src test e2e scripts frontend infra || true
          if grep -RIn 'id: "cd_sacd_transport"' src test e2e scripts frontend infra; then
            echo 'Legacy CD/SACD id remains as a canonical definition' >&2
            exit 1
          fi
          if grep -RIn '\["cd_sacd_transport"' src/catalog/category-rules.ts; then
            echo 'Legacy CD/SACD id remains in classifier rules' >&2
            exit 1
          fi
          if grep -RIn 'ネットワークトランスポート: "network_transport"' src; then
            echo 'First-party mapping still emits legacy network_transport' >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test e2e
          git commit -m 'refactor: make transport the canonical category id'
          git push origin HEAD:${{ github.head_ref }}
