name: Phase 2.5 Bootstrap

on:
  push:
    branches:
      - feat/phase-2-5-typescript-complete-migration

permissions:
  contents: write

concurrency:
  group: phase-2-5-bootstrap
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/phase-2-5-typescript-complete-migration
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Run mechanical TypeScript bootstrap
        run: bash scripts/phase-2-5-bootstrap.sh
      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: migrate first-party source to TypeScript'
          git push origin HEAD:feat/phase-2-5-typescript-complete-migration
