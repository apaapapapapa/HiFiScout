name: Audit Live Digital Category

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch live product-search results
        shell: bash
        run: |
          set -euo pipefail
          url='https://hifiscout.tokyojp.workers.dev/api/product-search?category=digital&sort=priceDesc&limit=50&includeTotal=true'
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$url" -o result.json
          echo '=== META ==='
          jq -r '"totalCount=\(.totalCount // "null") totalPages=\(.totalPages // "null") shown=\(.items|length)"' result.json
          echo '=== ITEMS ==='
          jq -r '.items | to_entries[] | [(.key + 1), .value.key, .value.manufacturer, .value.model, .value.primary_category_id, .value.category, (.value.lowest_price_yen // ""), (.value.highest_price_yen // ""), (.value.representative_offer.shop_key // ""), (.value.representative_offer.title // ""), (.value.representative_offer.source_url // "")] | @tsv' result.json
