name: Deploy AudioUnion Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'infra/audiounion-lambda/index.mjs'
      - '.github/workflows/deploy-audiounion-lambda.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-audiounion-lambda
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS Tokyo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_REGION: ap-northeast-1
      FUNCTION_NAME: hifiscout-audiounion-fetcher

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda
        run: |
          cd infra/audiounion-lambda
          zip -j "$RUNNER_TEMP/audiounion-lambda.zip" index.mjs

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$RUNNER_TEMP/audiounion-lambda.zip" \
            --query '{FunctionName:FunctionName,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'

      - name: Wait for Lambda update
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(aws lambda get-function-configuration \
              --region "$AWS_REGION" \
              --function-name "$FUNCTION_NAME" \
              --query 'LastUpdateStatus' \
              --output text)"

            echo "Lambda update status: $status (attempt $attempt/30)"

            if [ "$status" = "Successful" ]; then
              exit 0
            fi

            if [ "$status" = "Failed" ]; then
              aws lambda get-function-configuration \
                --region "$AWS_REGION" \
                --function-name "$FUNCTION_NAME" \
                --query '{LastUpdateStatus:LastUpdateStatus,Reason:LastUpdateStatusReason,ReasonCode:LastUpdateStatusReasonCode}'
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for Lambda update to complete."
          exit 1

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'
