name: Deploy AudioUnion Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'infra/audiounion-lambda/index.mjs'
      - '.github/workflows/deploy-audiounion-lambda.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-audiounion-lambda
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS Tokyo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_REGION: ap-northeast-1
      FUNCTION_NAME: hifiscout-audiounion-fetcher
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda
        run: |
          cd infra/audiounion-lambda
          zip -j "$RUNNER_TEMP/audiounion-lambda.zip" index.mjs

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$RUNNER_TEMP/audiounion-lambda.zip" \
            --query '{FunctionName:FunctionName,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'

      - name: Wait for Lambda update
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(aws lambda get-function-configuration \
              --region "$AWS_REGION" \
              --function-name "$FUNCTION_NAME" \
              --query 'LastUpdateStatus' \
              --output text)"

            echo "Lambda update status: $status (attempt $attempt/30)"

            if [ "$status" = "Successful" ]; then
              exit 0
            fi

            if [ "$status" = "Failed" ]; then
              aws lambda get-function-configuration \
                --region "$AWS_REGION" \
                --function-name "$FUNCTION_NAME" \
                --query '{LastUpdateStatus:LastUpdateStatus,Reason:LastUpdateStatusReason,ReasonCode:LastUpdateStatusReasonCode}'
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for Lambda update to complete."
          exit 1

      - name: Synchronize shared relay secrets to Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          relay_token="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables.RELAY_TOKEN' \
            --output text)"
          relay_url="$(aws lambda get-function-url-config \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'FunctionUrl' \
            --output text)"

          if [ -z "$relay_token" ] || [ "$relay_token" = "None" ]; then
            echo "Lambda RELAY_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$relay_url" ] || [ "$relay_url" = "None" ]; then
            echo "Lambda Function URL is not configured."
            exit 1
          fi

          printf '%s' "$relay_url" | npx wrangler secret put CRAWL_RELAY_URL
          printf '%s' "$relay_token" | npx wrangler secret put CRAWL_RELAY_TOKEN
          echo "Shared relay URL and token synchronized to Cloudflare."

      - name: Verify shared relay secrets are registered
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(npx wrangler secret list)"
          jq -e '.[] | select(.name == "CRAWL_RELAY_URL")' <<< "$secrets" >/dev/null
          jq -e '.[] | select(.name == "CRAWL_RELAY_TOKEN")' <<< "$secrets" >/dev/null
          echo "Shared relay secrets are registered in Cloudflare."

      - name: Probe AudioUnion full-search page 1
        shell: bash
        run: |
          set -euo pipefail
          relay_token="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables.RELAY_TOKEN' \
            --output text)"
          relay_url="$(aws lambda get-function-url-config \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'FunctionUrl' \
            --output text)"
          target='https://www.audiounion.jp/ct/search?m=used&p=1&q=&s=new_enddate&d=1&option=1&order=date_desc'
          payload="$(jq -nc --arg url "$target" '{url:$url,requestDelayMs:10000,userAgent:"HiFiScoutBot/0.1 (+https://github.com/apaapapapapa/HiFiScout)"}')"
          status="$(curl -sS -o "$RUNNER_TEMP/audiounion-full-search.html" -w '%{http_code}' \
            -X POST "$relay_url" \
            -H "Authorization: Bearer $relay_token" \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          echo "AudioUnion full-search upstream status: $status"
          test "$status" = "200"
          python3 - "$RUNNER_TEMP/audiounion-full-search.html" <<'PY'
          import html, re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors='replace')
          ids = list(dict.fromkeys(re.findall(r'/ct/detail/used/(\d+)/?', text, re.I)))
          pages = sorted({int(v) for v in re.findall(r'[?&]p=(\d+)', html.unescape(text)) if int(v) >= 1})
          stripped = re.sub(r'<[^>]+>', ' ', text)
          stripped = re.sub(r'\s+', ' ', html.unescape(stripped))
          count_candidates = re.findall(r'(?:全|検索結果|該当)[^0-9]{0,12}([0-9,]{1,8})\s*件', stripped)
          print(f'full_search_unique_products_page1={len(ids)}')
          print(f'full_search_pagination_pages={pages[:30]} max={max(pages) if pages else 1}')
          print(f'full_search_count_candidates={count_candidates[:10]}')
          print(f'full_search_has_sales_price={"販売価格" in stripped}')
          PY

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'
