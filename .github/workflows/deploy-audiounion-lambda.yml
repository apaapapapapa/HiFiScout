name: Deploy AudioUnion Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'infra/audiounion-lambda/index.ts'
      - '.github/workflows/deploy-audiounion-lambda.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-audiounion-lambda
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS Tokyo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_REGION: ap-northeast-1
      FUNCTION_NAME: hifiscout-audiounion-fetcher
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-node-deps

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda bundle from TypeScript source
        run: vp run build:lambda

      - name: Package Lambda
        run: |
          cd dist/audiounion-lambda
          zip -j "$RUNNER_TEMP/audiounion-lambda.zip" index.mjs

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$RUNNER_TEMP/audiounion-lambda.zip" \
            --query '{FunctionName:FunctionName,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'

      - name: Wait for Lambda update
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(aws lambda get-function-configuration \
              --region "$AWS_REGION" \
              --function-name "$FUNCTION_NAME" \
              --query 'LastUpdateStatus' \
              --output text)"

            echo "Lambda update status: $status (attempt $attempt/30)"

            if [ "$status" = "Successful" ]; then
              exit 0
            fi

            if [ "$status" = "Failed" ]; then
              aws lambda get-function-configuration \
                --region "$AWS_REGION" \
                --function-name "$FUNCTION_NAME" \
                --query '{LastUpdateStatus:LastUpdateStatus,Reason:LastUpdateStatusReason,ReasonCode:LastUpdateStatusReasonCode}'
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for Lambda update to complete."
          exit 1

      - name: Synchronize shared relay secrets to Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          relay_token="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables.RELAY_TOKEN' \
            --output text)"
          relay_url="$(aws lambda get-function-url-config \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'FunctionUrl' \
            --output text)"

          if [ -z "$relay_token" ] || [ "$relay_token" = "None" ]; then
            echo "Lambda RELAY_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$relay_url" ] || [ "$relay_url" = "None" ]; then
            echo "Lambda Function URL is not configured."
            exit 1
          fi

          secrets_json="$(jq -cn \
            --arg relay_url "$relay_url" \
            --arg relay_token "$relay_token" \
            '{CRAWL_RELAY_URL: $relay_url, CRAWL_RELAY_TOKEN: $relay_token}')"

          status=1
          for attempt in $(seq 1 60); do
            set +e
            output="$(printf '%s' "$secrets_json" | vp exec wrangler secret bulk 2>&1)"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Shared relay URL and token synchronized to Cloudflare."
              break
            fi

            if grep -Fq "latest version of your Worker isn't currently deployed" <<< "$output"; then
              echo "Cloudflare has an undeployed Worker version; retrying relay secret sync (attempt $attempt/60)."
              sleep 5
              continue
            fi

            echo "$output" >&2
            exit "$status"
          done

          if [ "$status" -ne 0 ]; then
            echo "Timed out waiting for the latest Cloudflare Worker version to be deployed."
            exit 1
          fi

      - name: Verify shared relay secrets are registered
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(vp exec wrangler secret list)"
          jq -e '.[] | select(.name == "CRAWL_RELAY_URL")' <<< "$secrets" >/dev/null
          jq -e '.[] | select(.name == "CRAWL_RELAY_TOKEN")' <<< "$secrets" >/dev/null
          echo "Shared relay secrets are registered in Cloudflare."

      - name: Probe relay-backed shops through Tokyo relay
        shell: bash
        run: |
          set -euo pipefail

          relay_token="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables.RELAY_TOKEN' \
            --output text)"
          relay_url="$(aws lambda get-function-url-config \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'FunctionUrl' \
            --output text)"

          product_json="$(vp exec wrangler d1 execute DB --remote --json --command "
            SELECT source_url
            FROM products
            WHERE shop_key = 'audiounion'
              AND is_active = 1
              AND stock_status = 'in_stock'
              AND source_url LIKE 'https://www.audiounion.jp/ct/detail/used/%'
            ORDER BY last_seen_at DESC
            LIMIT 1;")"
          detail_url="$(jq -r '.[0].results[0].source_url // empty' <<< "$product_json")"

          if [ -z "$detail_url" ]; then
            echo "No active AudioUnion used-detail URL is available for the deployment probe."
            exit 1
          fi

          request_body="$(jq -cn --arg url "$detail_url" '{url: $url, requestDelayMs: 0}')"
          headers_file="$RUNNER_TEMP/audiounion-detail-headers.txt"
          body_file="$RUNNER_TEMP/audiounion-detail.html"
          status="$(curl -sS --max-time 35 \
            -D "$headers_file" \
            -o "$body_file" \
            -w '%{http_code}' \
            -X POST "$relay_url" \
            -H "Authorization: Bearer $relay_token" \
            -H 'Content-Type: application/json' \
            --data "$request_body")"

          echo "AudioUnion detail probe HTTP status: $status"
          grep -i '^x-hifiscout-aws-region:' "$headers_file" || true
          if [ "$status" = "409" ]; then
            echo "AudioUnion used-detail access is disallowed by the current robots.txt policy."
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "AudioUnion used-detail probe did not return HTTP 200."
            exit 1
          fi
          grep -qi '^x-hifiscout-aws-region:[[:space:]]*ap-northeast-1' "$headers_file"
          test -s "$body_file"

          hifido_url='https://www.hifido.co.jp/?L=50&LNG=J&O=0&OD=0'
          request_body="$(jq -cn --arg url "$hifido_url" '{url: $url, requestDelayMs: 0}')"
          headers_file="$RUNNER_TEMP/hifido-relay-headers.txt"
          body_file="$RUNNER_TEMP/hifido-relay.html"
          status="$(curl -sS --max-time 35 \
            -D "$headers_file" \
            -o "$body_file" \
            -w '%{http_code}' \
            -X POST "$relay_url" \
            -H "Authorization: Bearer $relay_token" \
            -H 'Content-Type: application/json' \
            --data "$request_body")"

          echo "Hifido relay HTTP status: $status"
          grep -i '^x-hifiscout-aws-region:' "$headers_file" || true
          grep -i '^x-hifiscout-upstream-status:' "$headers_file" || true
          test "$status" = "200"
          grep -qi '^x-hifiscout-aws-region:[[:space:]]*ap-northeast-1' "$headers_file"
          test -s "$body_file"
          grep -Eqi 'list-item|ハイファイ堂|hifido' "$body_file"
          echo "AudioUnion and Hifido are reachable through the Tokyo relay."

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'
