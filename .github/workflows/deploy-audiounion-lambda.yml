name: Deploy AudioUnion Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'infra/audiounion-lambda/index.ts'
      - 'infra/audiounion-lambda/template.yaml'
      - '.github/workflows/deploy-audiounion-lambda.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-audiounion-lambda
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS Tokyo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_REGION: ap-northeast-1
      FUNCTION_NAME: hifiscout-audiounion-fetcher
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-node-deps

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure relay permit signing secret
        shell: bash
        run: |
          set -euo pipefail

          environment_json="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)"
          permit_secret="$(jq -r '.RELAY_PERMIT_SECRET // empty' <<< "$environment_json")"

          if [ "${#permit_secret}" -ge 32 ]; then
            echo "Relay permit signing secret is already configured."
            exit 0
          fi

          permit_secret="$(openssl rand -hex 32)"
          jq -n \
            --argjson vars "$environment_json" \
            --arg permit_secret "$permit_secret" \
            '{Variables: ($vars + {RELAY_PERMIT_SECRET: $permit_secret})}' \
            > "$RUNNER_TEMP/lambda-environment.json"

          aws lambda update-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --environment "file://$RUNNER_TEMP/lambda-environment.json" \
            --query '{FunctionName:FunctionName,LastUpdateStatus:LastUpdateStatus}'

          for attempt in $(seq 1 30); do
            status="$(aws lambda get-function-configuration \
              --region "$AWS_REGION" \
              --function-name "$FUNCTION_NAME" \
              --query 'LastUpdateStatus' \
              --output text)"
            echo "Lambda configuration update status: $status (attempt $attempt/30)"
            if [ "$status" = "Successful" ]; then
              exit 0
            fi
            if [ "$status" = "Failed" ]; then
              aws lambda get-function-configuration \
                --region "$AWS_REGION" \
                --function-name "$FUNCTION_NAME" \
                --query '{LastUpdateStatus:LastUpdateStatus,Reason:LastUpdateStatusReason,ReasonCode:LastUpdateStatusReasonCode}'
              exit 1
            fi
            sleep 2
          done

          echo "Timed out waiting for Lambda configuration update to complete."
          exit 1

      - name: Build Lambda bundle from TypeScript source
        run: vp run build:lambda

      - name: Package Lambda
        run: |
          cd dist/audiounion-lambda
          zip -j "$RUNNER_TEMP/audiounion-lambda.zip" index.mjs

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$RUNNER_TEMP/audiounion-lambda.zip" \
            --query '{FunctionName:FunctionName,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'

      - name: Wait for Lambda update
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(aws lambda get-function-configuration \
              --region "$AWS_REGION" \
              --function-name "$FUNCTION_NAME" \
              --query 'LastUpdateStatus' \
              --output text)"

            echo "Lambda update status: $status (attempt $attempt/30)"

            if [ "$status" = "Successful" ]; then
              exit 0
            fi

            if [ "$status" = "Failed" ]; then
              aws lambda get-function-configuration \
                --region "$AWS_REGION" \
                --function-name "$FUNCTION_NAME" \
                --query '{LastUpdateStatus:LastUpdateStatus,Reason:LastUpdateStatusReason,ReasonCode:LastUpdateStatusReasonCode}'
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for Lambda update to complete."
          exit 1

      - name: Synchronize shared relay secrets to Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          relay_token="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables.RELAY_TOKEN' \
            --output text)"
          relay_url="$(aws lambda get-function-url-config \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'FunctionUrl' \
            --output text)"

          if [ -z "$relay_token" ] || [ "$relay_token" = "None" ]; then
            echo "Lambda RELAY_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$relay_url" ] || [ "$relay_url" = "None" ]; then
            echo "Lambda Function URL is not configured."
            exit 1
          fi

          secrets_json="$(jq -cn \
            --arg relay_url "$relay_url" \
            --arg relay_token "$relay_token" \
            '{CRAWL_RELAY_URL: $relay_url, CRAWL_RELAY_TOKEN: $relay_token}')"

          status=1
          for attempt in $(seq 1 60); do
            set +e
            output="$(printf '%s' "$secrets_json" | vp exec wrangler secret bulk 2>&1)"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Shared relay URL and token synchronized to Cloudflare."
              break
            fi

            if grep -Fq "latest version of your Worker isn't currently deployed" <<< "$output"; then
              echo "Cloudflare has an undeployed Worker version; retrying relay secret sync (attempt $attempt/60)."
              sleep 5
              continue
            fi

            echo "$output" >&2
            exit "$status"
          done

          if [ "$status" -ne 0 ]; then
            echo "Timed out waiting for the latest Cloudflare Worker version to be deployed."
            exit 1
          fi

      - name: Verify shared relay secrets are registered
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(vp exec wrangler secret list)"
          jq -e '.[] | select(.name == "CRAWL_RELAY_URL")' <<< "$secrets" >/dev/null
          jq -e '.[] | select(.name == "CRAWL_RELAY_TOKEN")' <<< "$secrets" >/dev/null
          echo "Shared relay secrets are registered in Cloudflare."

      - name: Probe Relay PREPARE/FETCH for AudioUnion and Hifido
        shell: bash
        run: |
          set -euo pipefail

          relay_token="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables.RELAY_TOKEN' \
            --output text)"
          relay_url="$(aws lambda get-function-url-config \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'FunctionUrl' \
            --output text)"

          product_json="$(vp exec wrangler d1 execute DB --remote --json --command "
            SELECT source_url
            FROM products
            WHERE shop_key = 'audiounion'
              AND is_active = 1
              AND stock_status = 'in_stock'
              AND source_url LIKE 'https://www.audiounion.jp/ct/detail/used/%'
            ORDER BY last_seen_at DESC
            LIMIT 1;")"
          detail_url="$(jq -r '.[0].results[0].source_url // empty' <<< "$product_json")"
          if [ -z "$detail_url" ]; then
            echo "No active AudioUnion used-detail URL is available for the deployment probe."
            exit 1
          fi

          hifido_url='https://www.hifido.co.jp/?L=50&LNG=J&O=0&OD=0'

          prepare_relay() {
            local target_url="$1"
            local output_file="$2"
            local request_body status
            request_body="$(jq -cn --arg url "$target_url" \
              '{operation: "prepare", url: $url, requestDelayMs: 0}')"
            status="$(curl -sS --max-time 15 \
              -o "$output_file" \
              -w '%{http_code}' \
              -X POST "$relay_url" \
              -H "Authorization: Bearer $relay_token" \
              -H 'Content-Type: application/json' \
              --data "$request_body")"
            echo "Relay PREPARE $target_url -> HTTP $status"
            test "$status" = "200"
            jq -e '.permit and .targetUrl and .requestedUserAgent and (.notBeforeMs | type == "number")' \
              "$output_file" >/dev/null
          }

          audiounion_prepare="$RUNNER_TEMP/audiounion-prepare.json"
          hifido_prepare="$RUNNER_TEMP/hifido-prepare.json"
          prepare_relay "$detail_url" "$audiounion_prepare"
          prepare_relay "$hifido_url" "$hifido_prepare"

          max_not_before_ms="$(jq -s 'map(.notBeforeMs) | max' \
            "$audiounion_prepare" "$hifido_prepare")"
          now_ms="$(date +%s%3N)"
          if [ "$now_ms" -lt "$max_not_before_ms" ]; then
            wait_ms=$((max_not_before_ms - now_ms + 1000))
            wait_seconds=$(((wait_ms + 999) / 1000))
            echo "Waiting $wait_seconds seconds outside Lambda until both permits are valid."
            sleep "$wait_seconds"
          fi

          fetch_relay() {
            local prepared_file="$1"
            local headers_file="$2"
            local body_file="$3"
            local request_body status
            request_body="$(jq -cn --slurpfile prepared "$prepared_file" \
              '{operation: "fetch", permit: $prepared[0].permit, url: $prepared[0].targetUrl, userAgent: $prepared[0].requestedUserAgent}')"
            status="$(curl -sS --max-time 15 \
              -D "$headers_file" \
              -o "$body_file" \
              -w '%{http_code}' \
              -X POST "$relay_url" \
              -H "Authorization: Bearer $relay_token" \
              -H 'Content-Type: application/json' \
              --data "$request_body")"
            echo "Relay FETCH $(jq -r '.targetUrl' "$prepared_file") -> HTTP $status"
            test "$status" = "200"
            grep -qi '^x-hifiscout-aws-region:[[:space:]]*ap-northeast-1' "$headers_file"
            test -s "$body_file"
          }

          audiounion_headers="$RUNNER_TEMP/audiounion-detail-headers.txt"
          audiounion_body="$RUNNER_TEMP/audiounion-detail.html"
          hifido_headers="$RUNNER_TEMP/hifido-relay-headers.txt"
          hifido_body="$RUNNER_TEMP/hifido-relay.html"
          fetch_relay "$audiounion_prepare" "$audiounion_headers" "$audiounion_body"
          fetch_relay "$hifido_prepare" "$hifido_headers" "$hifido_body"

          grep -Eqi 'list-item|ハイファイ堂|hifido' "$hifido_body"
          echo "AudioUnion and Hifido PREPARE/FETCH protocol verified through the Tokyo relay."

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'