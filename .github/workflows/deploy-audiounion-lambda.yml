name: Deploy AudioUnion Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'infra/audiounion-lambda/index.mjs'
      - '.github/workflows/deploy-audiounion-lambda.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-audiounion-lambda
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS Tokyo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_REGION: ap-northeast-1
      FUNCTION_NAME: hifiscout-audiounion-fetcher
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_NAME: hifiscout

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda
        run: |
          cd infra/audiounion-lambda
          zip -j "$RUNNER_TEMP/audiounion-lambda.zip" index.mjs

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$RUNNER_TEMP/audiounion-lambda.zip" \
            --query '{FunctionName:FunctionName,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'

      - name: Wait for Lambda update
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(aws lambda get-function-configuration \
              --region "$AWS_REGION" \
              --function-name "$FUNCTION_NAME" \
              --query 'LastUpdateStatus' \
              --output text)"

            echo "Lambda update status: $status (attempt $attempt/30)"

            if [ "$status" = "Successful" ]; then
              exit 0
            fi

            if [ "$status" = "Failed" ]; then
              aws lambda get-function-configuration \
                --region "$AWS_REGION" \
                --function-name "$FUNCTION_NAME" \
                --query '{LastUpdateStatus:LastUpdateStatus,Reason:LastUpdateStatusReason,ReasonCode:LastUpdateStatusReasonCode}'
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for Lambda update to complete."
          exit 1

      - name: Synchronize shared relay secrets to Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          relay_token="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables.RELAY_TOKEN' \
            --output text)"
          relay_url="$(aws lambda get-function-url-config \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query 'FunctionUrl' \
            --output text)"

          if [ -z "$relay_token" ] || [ "$relay_token" = "None" ]; then
            echo "Lambda RELAY_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$relay_url" ] || [ "$relay_url" = "None" ]; then
            echo "Lambda Function URL is not configured."
            exit 1
          fi

          put_secret() {
            local name="$1"
            local value="$2"
            response="$(curl -fsS --retry 3 --retry-delay 2 \
              -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_WORKER_NAME}/secrets" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg name "$name" --arg text "$value" '{name:$name,text:$text,type:"secret_text"}')")"
            jq -e '.success == true' <<< "$response" >/dev/null
          }

          put_secret CRAWL_RELAY_URL "$relay_url"
          put_secret CRAWL_RELAY_TOKEN "$relay_token"
          echo "Shared relay URL and token synchronized to Cloudflare."

      - name: Verify shared relay secrets are registered
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 3 --retry-delay 2 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_WORKER_NAME}/secrets" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          jq -e '.result[] | select(.name == "CRAWL_RELAY_URL")' <<< "$response" >/dev/null
          jq -e '.result[] | select(.name == "CRAWL_RELAY_TOKEN")' <<< "$response" >/dev/null
          echo "Shared relay secrets are registered in Cloudflare."

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'
