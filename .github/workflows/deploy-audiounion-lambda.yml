name: Deploy AudioUnion Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'infra/audiounion-lambda/index.mjs'
      - '.github/workflows/deploy-audiounion-lambda.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-audiounion-lambda
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS Tokyo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_REGION: ap-northeast-1
      FUNCTION_NAME: hifiscout-audiounion-fetcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          token="$(jq -r '.value' <<< "$response")"
          payload="$(cut -d. -f2 <<< "$token")"

          PAYLOAD="$payload" python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["PAYLOAD"]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload.encode()).decode())

          allowed = [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "ref",
              "ref_type",
              "event_name",
              "workflow",
              "job_workflow_ref",
              "environment",
          ]

          print("GitHub OIDC claims used for AWS trust-policy matching:")
          for key in allowed:
              if key in claims:
                  print(f"{key}={claims[key]}")
          PY

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda
        run: |
          cd infra/audiounion-lambda
          zip -j "$RUNNER_TEMP/audiounion-lambda.zip" index.mjs

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$RUNNER_TEMP/audiounion-lambda.zip"

          aws lambda wait function-updated-v2 \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME"

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'
