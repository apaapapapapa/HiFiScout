name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # PR updates may cancel stale validation, but every main push must reach a terminal
  # conclusion so the workflow_run deployment gate can observe a successful CI run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/change-scope
        id: scope
      - uses: ./.github/actions/setup-node-deps
        with:
          cache-write: "true"
          task-cache: "true"
          task-cache-scope: static-checks
      - name: Verify canonical Vite+ migration state
        shell: bash
        run: |
          set -euo pipefail
          vp migrate --no-interactive
          vp env pin 22 --target dev-engines
          git diff --exit-code
      - name: Reject legacy project toolchain entrypoints
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'uses:[[:space:]]+actions/setup-node@|run:[[:space:]]+(npm|npx)([[:space:]]|$)|^[[:space:]]+(npm|npx)[[:space:]]' .github/workflows; then
            echo 'A workflow bypasses Vite+ runtime/tool resolution.' >&2
            exit 1
          fi
          if grep -RInE '^[[:space:]]*(npm|npx)[[:space:]]' README.md AGENTS.md docs; then
            echo 'Documentation contains a standalone npm/npx command; document the Vite+ entrypoint instead.' >&2
            exit 1
          fi
      - run: vp run ci:lint
      - run: vp run ci:format-check
      - run: vp run ci:no-js-source
      - name: Typecheck source
        if: steps.scope.outputs.application == 'true'
        run: vp run ci:typecheck
      - name: Compare parser stages with relative CPU baselines
        if: steps.scope.outputs.application == 'true'
        run: vp run ci:parser-benchmark
      - name: Build application bundles
        if: steps.scope.outputs.application == 'true'
        run: vp run ci:build

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/change-scope
        id: scope
      - uses: ./.github/actions/setup-node-deps
        if: steps.scope.outputs.application == 'true'
      - run: vp run ci:test-shard-${{ matrix.shard }}
        if: steps.scope.outputs.application == 'true'
      - name: Preserve unit timing profiles
        if: success() && steps.scope.outputs.application == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-timings-${{ matrix.shard }}
          path: .generated/unit-timings-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/change-scope
        id: scope
      - uses: ./.github/actions/setup-node-deps
        if: steps.scope.outputs.application == 'true'
      - run: vp run db:migrate:local
        if: steps.scope.outputs.application == 'true'
      - name: Verify listing admin overrides survive crawler writes
        if: steps.scope.outputs.application == 'true'
        run: vp exec tsx scripts/verify-listing-admin-overrides.ts
      - name: Verify D1 FTS search migration
        if: steps.scope.outputs.application == 'true'
        run: vp exec tsx scripts/verify-search-integration.ts

  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/change-scope
        id: scope
      - uses: ./.github/actions/setup-node-deps
        if: steps.scope.outputs.application == 'true'
      - name: Verify frozen migrations and seeded upgrade with previous runtime
        if: steps.scope.outputs.application == 'true'
        run: vp run test:migrations

  component:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/change-scope
        id: scope
      - uses: ./.github/actions/setup-node-deps
        if: steps.scope.outputs.application == 'true'
      - uses: ./.github/actions/setup-playwright
        if: steps.scope.outputs.application == 'true'
        with:
          cache-write: "${{ github.event_name == 'push' }}"
          japanese-fonts: "true"
      - name: Run Playwright component suite
        if: steps.scope.outputs.application == 'true'
        run: vp exec playwright test --config e2e/playwright.components.config.ts
      - name: Preserve component screenshots and failure traces
        if: always() && steps.scope.outputs.application == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-ui-review
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/change-scope
        id: scope
      - uses: ./.github/actions/setup-node-deps
        if: steps.scope.outputs.application == 'true'
      # Vite+ 0.2.9's `vp pm audit` does not accept npm's positional `signatures`
      # subcommand. Run the project-pinned npm inside the Vite+ environment instead.
      - name: Verify npm registry signatures and provenance
        if: steps.scope.outputs.application == 'true'
        run: vp env exec npm audit signatures
      - name: Fail on high or critical dependency vulnerabilities
        if: steps.scope.outputs.application == 'true'
        run: vp env exec npm audit --audit-level=high

  fan-out:
    name: fan-out
    needs:
      - static-checks
      - unit-test
      - integration
      - migration-safety
      - component
      - dependency-security
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify CI fan-out
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static-checks.result }}
          UNIT_RESULT: ${{ needs.unit-test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          MIGRATION_RESULT: ${{ needs.migration-safety.result }}
          COMPONENT_RESULT: ${{ needs.component.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-security.result }}
        run: |
          set -euo pipefail
          for result in \
            "${STATIC_RESULT}" \
            "${UNIT_RESULT}" \
            "${INTEGRATION_RESULT}" \
            "${MIGRATION_RESULT}" \
            "${COMPONENT_RESULT}" \
            "${DEPENDENCY_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Required CI job finished with result: ${result}" >&2
              exit 1
            fi
          done
      - name: Summarize CI job durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### CI job durations'
            echo '| Job | Result | Job seconds | Before first step |'
            echo '| --- | --- | ---: | ---: |'
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name != "fan-out" and .completed_at != null) |
                [.name, .conclusion,
                 ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)),
                 (if (.steps | length) > 0 then ((.steps[0].started_at | fromdateiso8601) - (.started_at | fromdateiso8601)) else 0 end)] |
                "| " + (map(tostring) | join(" | ")) + " |"'
            echo 'Parallel job durations are not additive wall time; compare cold and warm caches separately.'
          } >> "$GITHUB_STEP_SUMMARY"
