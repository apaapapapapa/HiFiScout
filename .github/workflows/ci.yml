name: CI

on:
  push:
    branches: [main, chore/zero-oxlint-warnings]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-lint-cleanup:
    if: github.ref == 'refs/heads/chore/zero-oxlint-warnings' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/zero-oxlint-warnings
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format lint-cleanup files
        run: >-
          npx oxfmt
          src/catalog/categories.js
          src/catalog/category-evidence.js
          src/catalog/category-rules.js
          src/catalog/knowledge-source-verifier-v2.js
          src/catalog/knowledge-source-verifier-v4.js
          src/catalog/knowledge-source-verifier.js
          src/catalog/manufacturers.js
          src/catalog/product-features.js
          src/crawler/category-enricher.js
          src/crawler/parser.js
          src/crawler/shops/audiounion.js
          src/index.js
      - run: npm run lint
      - run: npm test
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: format lint-cleanup files"
          git push origin HEAD:chore/zero-oxlint-warnings
