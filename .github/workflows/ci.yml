name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # PR updates may cancel stale validation, but every main push must reach a terminal
  # conclusion so the workflow_run deployment gate can observe a successful CI run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: TypeScript-only source check
        run: npm run check:no-js-source
      - name: Typecheck
        run: npm run typecheck
      - name: Locate failing unit test
        id: locate-unit-failure
        continue-on-error: true
        shell: bash
        run: |
          set -u
          mkdir -p .diagnostics
          : > .diagnostics/failing-unit-test.txt
          while IFS= read -r file; do
            if ! vp test run "$file" --reporter=dot >/dev/null 2>&1; then
              printf '%s\n' "$file" > .diagnostics/failing-unit-test.txt
              exit 1
            fi
          done < <(find test -type f -name '*.test.ts' | sort)
      - name: Upload unit-test diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failing-unit-test
          path: .diagnostics/failing-unit-test.txt
          retention-days: 1
          if-no-files-found: error
      - name: Enforce unit-test diagnostic result
        if: steps.locate-unit-failure.outcome == 'failure'
        run: exit 1
      - name: Unit tests
        if: steps.locate-unit-failure.outcome == 'success'
        run: npm run test:unit
      - run: npm run db:migrate:local
      - name: Verify listing admin overrides survive crawler writes
        run: npx tsx scripts/verify-listing-admin-overrides.ts
      - name: Verify D1 FTS search migration
        run: npx tsx scripts/verify-search-integration.ts
      - run: npm run build

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - name: Verify npm registry signatures and provenance
        run: npm audit signatures
      - name: Fail on high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

  playwright-browser-cache:
    if: github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - name: Resolve installed Playwright version
        id: playwright-version
        shell: bash
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
