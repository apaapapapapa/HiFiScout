name: CI

on:
  push:
    branches: [main, chore/zero-oxlint-warnings]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-lint:
    if: github.ref == 'refs/heads/chore/zero-oxlint-warnings' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/zero-oxlint-warnings
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove final unused bindings
        shell: bash
        run: |
          sed -i "s/    } catch (error) {/    } catch {/" src/index.js
          sed -i "/import { normalizeCatalogModel } from '.\/knowledge-catalog.js';/d" src/catalog/knowledge-source-verifier-v2.js
      - run: npm run lint
      - run: npm test
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/catalog/knowledge-source-verifier-v2.js
          git commit -m "fix: remove remaining oxlint warnings"
          git push origin HEAD:chore/zero-oxlint-warnings
