name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:migrate:local
      - name: Verify D1 FTS search migration
        run: npx tsx scripts/verify-search-integration.ts
      - run: npm run build

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify npm registry signatures and provenance
        run: npm audit signatures
      - name: Fail on high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

  other-category-audit:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit active listings classified as other
        shell: bash
        run: |
          set -euo pipefail
          query() {
            npx wrangler d1 execute DB --remote --json --command "$1" | jq 'if type == "array" then .[0].results else . end'
          }
          echo '=== hifido speaker accessory cable ==='
          query "SELECT id, raw_category, title, manufacturer, model FROM products WHERE is_active = 1 AND primary_category_id = 'other' AND shop_key = 'hifido' AND raw_category IN ('スピーカー','アクセサリー','ケーブル') ORDER BY raw_category, id DESC LIMIT 180;"
          echo '=== fujiya broad buckets ==='
          query "SELECT id, raw_category, title, manufacturer, model FROM products WHERE is_active = 1 AND primary_category_id = 'other' AND shop_key = 'fujiya-avic' AND raw_category IN ('DAP・ヘッドホンアンプ','アンプ・スピーカー・プレーヤー') ORDER BY raw_category, id DESC LIMIT 180;"
          echo '=== blank categories ==='
          query "SELECT id, shop_key, title, manufacturer, model FROM products WHERE is_active = 1 AND primary_category_id = 'other' AND COALESCE(TRIM(raw_category), '') = '' AND shop_key IN ('hifido','fujiya-avic','ippinkan','audiounion') ORDER BY id DESC LIMIT 240;"

  playwright-browser-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-package-lock
      - name: Resolve installed Playwright version
        id: playwright-version
        working-directory: e2e
        shell: bash
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install chromium
