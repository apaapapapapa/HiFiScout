name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No history is needed: the source gate is repository-wide rather than diff-scoped, and
      # `check:no-js-source` reads the index with `git ls-files`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same gate contributors run locally: lint, format check, TypeScript-only check, type check,
      # unit tests. Keeping it as one script means CI and `npm run verify` cannot drift apart.
      - run: npm run check
      - run: npm run db:migrate:local
      - name: Verify D1 FTS search migration
        run: npx tsx scripts/verify-search-integration.ts
      - run: npm run build

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify npm registry signatures and provenance
        run: npm audit signatures
      - name: Fail on high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

  playwright-browser-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-package-lock
      - name: Resolve installed Playwright version
        id: playwright-version
        working-directory: e2e
        shell: bash
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install chromium

  verify-admin-html-fix-rollout:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      TARGET_SHA: c012de0214bcb35719ed4907797a38fa87e5d59b
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for main rollout
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100"
          ci=""
          public_deploy=""
          admin_deploy=""
          for _ in $(seq 1 90); do
            runs="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
            ci="$(jq -c '[.workflow_runs[] | select(.name == "CI" and .event == "push")] | sort_by(.created_at) | last // empty' <<<"$runs")"
            public_deploy="$(jq -c '[.workflow_runs[] | select(.name == "Deploy Cloudflare" and .event == "workflow_run" and .conclusion != "skipped")] | sort_by(.created_at) | last // empty' <<<"$runs")"
            admin_deploy="$(jq -c '[.workflow_runs[] | select(.name == "Deploy Catalog Admin" and .event == "workflow_run" and .conclusion != "skipped")] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$ci" && -n "$public_deploy" && -n "$admin_deploy" ]] && \
               [[ "$(jq -r .status <<<"$ci")" == completed ]] && \
               [[ "$(jq -r .status <<<"$public_deploy")" == completed ]] && \
               [[ "$(jq -r .status <<<"$admin_deploy")" == completed ]]; then
              break
            fi
            sleep 10
          done
          [[ -n "$ci" && "$(jq -r .conclusion <<<"$ci")" == success ]]
          [[ -n "$public_deploy" && "$(jq -r .conclusion <<<"$public_deploy")" == success ]]
          [[ -n "$admin_deploy" && "$(jq -r .conclusion <<<"$admin_deploy")" == success ]]
          echo "CI_RUN_ID=$(jq -r .id <<<"$ci")"
          echo "PUBLIC_DEPLOY_RUN_ID=$(jq -r .id <<<"$public_deploy")"
          echo "ADMIN_DEPLOY_RUN_ID=$(jq -r .id <<<"$admin_deploy")"
