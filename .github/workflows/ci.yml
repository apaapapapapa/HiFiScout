name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # PR updates may cancel stale validation, but every main push must reach a terminal
  # conclusion so the workflow_run deployment gate can observe a successful CI run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
        with:
          cache-write: "true"
      - name: Verify canonical Vite+ migration state
        shell: bash
        run: |
          set -euo pipefail
          vp migrate --no-interactive
          vp env pin 22 --target dev-engines
          git diff --exit-code
      - name: Reject legacy project toolchain entrypoints
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'uses:[[:space:]]+actions/setup-node@|run:[[:space:]]+(npm|npx)([[:space:]]|$)|^[[:space:]]+(npm|npx)[[:space:]]' .github/workflows; then
            echo 'A workflow bypasses Vite+ runtime/tool resolution.' >&2
            exit 1
          fi
          if grep -RInE '^[[:space:]]*(npm|npx)[[:space:]]' README.md AGENTS.md docs; then
            echo 'Documentation contains a standalone npm/npx command; document the Vite+ entrypoint instead.' >&2
            exit 1
          fi
      - run: vp run ci:lint
      - run: vp run ci:format-check
      - run: vp run ci:no-js-source

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
        with:
          task-cache: "true"
          task-cache-scope: typecheck
      - run: vp run ci:typecheck

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - run: vp run ci:test-shard-${{ matrix.shard }}

  parser-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - name: Compare parser stages with relative CPU baselines
        run: vp run ci:parser-benchmark

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - run: vp run db:migrate:local
      - name: Verify listing admin overrides survive crawler writes
        run: vp exec tsx scripts/verify-listing-admin-overrides.ts
      - name: Verify D1 FTS search migration
        run: vp exec tsx scripts/verify-search-integration.ts

  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-deps
      - name: Verify frozen migrations and seeded upgrade with previous runtime
        run: vp run test:migrations

  component:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - name: Resolve installed Playwright version
        id: playwright-version
        shell: bash
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vp exec playwright install chromium
      - name: Run Playwright component suite
        run: vp exec playwright test --config e2e/playwright.components.config.ts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
        with:
          task-cache: "true"
          task-cache-scope: build
      - run: vp run ci:build

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      # Vite+ 0.2.9's `vp pm audit` does not accept npm's positional `signatures`
      # subcommand. Run the project-pinned npm inside the Vite+ environment instead.
      - name: Verify npm registry signatures and provenance
        run: vp env exec npm audit signatures
      - name: Fail on high or critical dependency vulnerabilities
        run: vp env exec npm audit --audit-level=high

  fan-out:
    name: fan-out
    needs:
      - static-checks
      - typecheck
      - unit-test
      - parser-cpu
      - integration
      - migration-safety
      - component
      - build
      - dependency-security
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify CI fan-out
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static-checks.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit-test.result }}
          PARSER_CPU_RESULT: ${{ needs.parser-cpu.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          MIGRATION_RESULT: ${{ needs.migration-safety.result }}
          COMPONENT_RESULT: ${{ needs.component.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-security.result }}
        run: |
          set -euo pipefail
          for result in \
            "${STATIC_RESULT}" \
            "${TYPECHECK_RESULT}" \
            "${UNIT_RESULT}" \
            "${PARSER_CPU_RESULT}" \
            "${INTEGRATION_RESULT}" \
            "${MIGRATION_RESULT}" \
            "${COMPONENT_RESULT}" \
            "${BUILD_RESULT}" \
            "${DEPENDENCY_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Required CI job finished with result: ${result}" >&2
              exit 1
            fi
          done

  playwright-browser-cache:
    if: github.event_name == 'push'
    # Cache warming is an optimization, not a release-quality gate. A transient browser
    # download/cache failure must not suppress the production deployment after test/build pass.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - name: Resolve installed Playwright version
        id: playwright-version
        shell: bash
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vp exec playwright install chromium
