name: Force Fujiya Crawl

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-fujiya-crawl.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  force-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Wait for this commit to reach production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=50"
          deployed=false
          for attempt in $(seq 1 120); do
            runs="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api")"
            deploy="$(jq -c '[.workflow_runs[] | select(.name == "Deploy Cloudflare")] | sort_by(.created_at) | last // empty' <<< "$runs")"
            if [ -n "$deploy" ]; then
              status="$(jq -r '.status' <<< "$deploy")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$deploy")"
              echo "Deploy Cloudflare: status=$status conclusion=${conclusion:-pending}"
              if [ "$status" = 'completed' ]; then
                if [ "$conclusion" = 'success' ]; then
                  deployed=true
                  break
                fi
                echo "Production deploy failed with conclusion: $conclusion" >&2
                exit 1
              fi
            else
              echo 'Deploy Cloudflare has not started yet.'
            fi
            sleep 5
          done
          if [ "$deployed" != true ]; then
            echo 'Production deploy did not complete successfully in the observation window.' >&2
            exit 1
          fi
      - name: Capture current Fujiya crawl id
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx --yes wrangler@4.120.1 d1 execute DB --remote --json --command "SELECT COALESCE(MAX(id), 0) AS max_id FROM crawl_runs WHERE shop_key = 'fujiya-avic';")"
          max_id="$(jq -r '.[0].results[0].max_id // 0' <<< "$result")"
          echo "max_id=$max_id" >> "$GITHUB_OUTPUT"
          echo "Baseline Fujiya crawl id: $max_id"
      - name: Push forced Fujiya crawl to production queue
        shell: bash
        run: |
          set -euo pipefail
          queues="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues")"
          queue_id="$(jq -r '.result[] | select(.queue_name == "hifiscout-crawl") | .queue_id' <<< "$queues" | head -n1)"
          if [ -z "$queue_id" ] || [ "$queue_id" = "null" ]; then
            echo 'hifiscout-crawl queue was not found.' >&2
            echo "$queues" | jq . >&2
            exit 1
          fi
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          payload="$(jq -nc --arg requestedAt "$requested_at" '{body:{shopKey:"fujiya-avic",force:true,requestedAt:$requestedAt},content_type:"json"}')"
          response="$(curl -fsS \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$queue_id/messages")"
          echo "$response" | jq .
          jq -e '.success == true' <<< "$response" >/dev/null
      - name: Wait for forced crawl and report result
        shell: bash
        env:
          BASELINE_ID: ${{ steps.baseline.outputs.max_id }}
        run: |
          set -euo pipefail
          latest=''
          for attempt in $(seq 1 60); do
            result="$(npx --yes wrangler@4.120.1 d1 execute DB --remote --json --command "SELECT id, started_at, finished_at, status, item_count, page_count, message FROM crawl_runs WHERE shop_key = 'fujiya-avic' AND id > $BASELINE_ID ORDER BY id DESC LIMIT 1;")"
            latest="$(jq -c '.[0].results[0] // empty' <<< "$result")"
            if [ -n "$latest" ]; then
              status="$(jq -r '.status' <<< "$latest")"
              echo "$latest" | jq .
              if [ "$status" = 'success' ] || [ "$status" = 'failed' ]; then
                break
              fi
            fi
            sleep 10
          done
          if [ -z "$latest" ]; then
            echo 'Forced Fujiya crawl did not start.' >&2
            exit 1
          fi
          status="$(jq -r '.status' <<< "$latest")"
          if [ "$status" != 'success' ]; then
            echo "Forced Fujiya crawl finished with status: $status" >&2
            exit 1
          fi
      - name: Verify newest-sorted Fujiya products in D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.1 d1 execute DB --remote --json --command "
            SELECT id, manufacturer, model, title, price_yen, stock_status, source_url, first_seen_at, last_seen_at, last_activity_at
            FROM products
            WHERE shop_key = 'fujiya-avic' AND is_active = 1
            ORDER BY last_activity_at DESC, id DESC
            LIMIT 20;" | jq .
