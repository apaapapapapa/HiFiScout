name: Apply Approved Category Audit

on:
  push:
    branches: [main]
    paths:
      - 'migrations/0031_correct_audited_product_categories.sql'
      - 'migrations/0032_correct_n05xd_category.sql'
      - 'scripts/apply-approved-category-audit.ts'
      - '.github/workflows/apply-approved-category-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: approved-category-audit-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Wait for the production deployment of this commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs" -f branch=main -f head_sha="${GITHUB_SHA}" -f per_page=20)"
            run="$(jq -c '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA)] | sort_by(.created_at) | last // empty' <<< "$runs")"
            if [[ -z "$run" ]]; then
              echo "Waiting for Deploy Cloudflare run for ${GITHUB_SHA} (${attempt}/120)"
              sleep 15
              continue
            fi
            status="$(jq -r '.status' <<< "$run")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$run")"
            run_id="$(jq -r '.id' <<< "$run")"
            echo "Deploy Cloudflare run ${run_id}: status=${status} conclusion=${conclusion:-pending}"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "Deploy Cloudflare did not succeed for ${GITHUB_SHA}." >&2
                exit 1
              fi
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for Deploy Cloudflare for ${GITHUB_SHA}." >&2
          exit 1

      - name: Resolve production D1 binding
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          info="$(npx wrangler d1 info DB --json)"
          id="$(jq -r '.uuid // .database_id // .id // empty' <<< "$info")"
          if [[ -z "$id" ]]; then
            echo 'Could not resolve the deployed DB binding to an explicit D1 id.' >&2
            jq . <<< "$info" >&2
            exit 1
          fi
          echo "database_id=$id" >> "$GITHUB_OUTPUT"

      - name: Replay verified category corrections and refresh search entities
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: npx tsx scripts/apply-approved-category-audit.ts

      - name: Verify user-confirmed category policy and EDISCREATION spelling
        shell: bash
        run: |
          set -euo pipefail
          protected="$(npx wrangler d1 execute DB --remote --json --command "
            SELECT id, model, primary_category_id
            FROM products
            WHERE is_active = 1
              AND canonical_manufacturer_id = 'esoteric'
              AND (model LIKE 'N-01XD SE%' OR model = 'N-05XD')
              AND primary_category_id <> 'network_player';")"
          if [[ "$(jq '.[0].results | length' <<< "$protected")" -ne 0 ]]; then
            echo 'User-confirmed ESOTERIC network-player classifications regressed:' >&2
            jq '.[0].results' <<< "$protected" >&2
            exit 1
          fi

          edis="$(npx wrangler d1 execute DB --remote --json --command "
            SELECT id, raw_manufacturer, manufacturer, canonical_manufacturer_id
            FROM products
            WHERE is_active = 1
              AND normalized_raw_manufacturer = 'ediscreation'
              AND (manufacturer <> 'EDISCREATION' OR canonical_manufacturer_id <> 'ediscreation');")"
          if [[ "$(jq '.[0].results | length' <<< "$edis")" -ne 0 ]]; then
            echo 'EDISCREATION canonical spelling did not converge:' >&2
            jq '.[0].results' <<< "$edis" >&2
            exit 1
          fi
