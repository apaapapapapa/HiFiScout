name: E2E

on:
  workflow_run:
    workflows: ['Deploy Cloudflare']
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: Development environment base URL
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hifiscout-e2e
  cancel-in-progress: true

jobs:
  playwright:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.base_url || vars.E2E_BASE_URL || 'https://hifiscout.raha3415kohei.workers.dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-package-lock
      - name: Resolve installed Playwright version
        id: playwright-version
        working-directory: e2e
        shell: bash
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install chromium
      - name: Run Playwright against development environment
        working-directory: e2e
        run: npm test
      - name: Report Knowledge Catalog operational status
        shell: bash
        run: |
          set -euo pipefail
          status_url="${E2E_BASE_URL%/}/api/knowledge-catalog/status"
          payload=''
          verifier_status=''
          verifier_version=0
          expected_version=0

          for attempt in $(seq 1 12); do
            payload="$(curl -fsS --retry 3 --retry-delay 2 "$status_url")"
            verifier_status="$(jq -r '.verifier.status // empty' <<< "$payload")"
            verifier_version="$(jq -r '.verifier.version // 0' <<< "$payload")"
            expected_version="$(jq -r '.verifier.expectedVersion // 0' <<< "$payload")"
            if [ "$verifier_status" = 'failed' ]; then
              break
            fi
            if [ "$expected_version" -gt 0 ] && [ "$verifier_version" -ge "$expected_version" ] && [ "$verifier_status" = 'success' ]; then
              break
            fi
            echo "Knowledge Catalog verifier rollout is not finished yet (attempt ${attempt}/12)."
            sleep 30
          done

          echo "$payload" | jq .
          {
            echo '## Knowledge Catalog operational status'
            echo
            echo '```json'
            echo "$payload" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$expected_version" -le 0 ]; then
            echo 'Knowledge Catalog verifier version is not exposed.' >&2
            exit 1
          fi
          if [ "$verifier_status" != 'success' ]; then
            echo "Knowledge Catalog verifier rollout status is ${verifier_status:-missing}." >&2
            exit 1
          fi
          if [ "$verifier_version" -lt "$expected_version" ]; then
            echo "Knowledge Catalog verifier v${expected_version} did not complete within the observation window; current v${verifier_version}." >&2
            exit 1
          fi
          if [ "$(jq -r '.latestReview.status // empty' <<< "$payload")" != 'success' ]; then
            echo 'Knowledge Catalog latest review did not complete successfully.' >&2
            exit 1
          fi
