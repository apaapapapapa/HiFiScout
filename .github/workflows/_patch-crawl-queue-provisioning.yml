name: Patch crawl queue provisioning

on:
  push:
    branches: ["fix/provision-crawl-queue-lanes"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - name: Patch deploy workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text()
          needle = '''      - name: Apply backward-compatible D1 migrations
                run: npx wrangler d1 migrations apply DB --remote
              - name: Provision Knowledge Catalog queues
          '''
          replacement = '''      - name: Apply backward-compatible D1 migrations
                run: npx wrangler d1 migrations apply DB --remote
              - name: Provision crawl queues
                shell: bash
                run: |
                  set -euo pipefail
                  for queue in \
                    hifiscout-crawl hifiscout-crawl-dlq \
                    hifiscout-crawl-fast hifiscout-crawl-fast-dlq \
                    hifiscout-crawl-heavy hifiscout-crawl-heavy-dlq \
                    hifiscout-crawl-relay hifiscout-crawl-relay-dlq; do
                    if npx wrangler queues info "$queue" >/dev/null 2>&1; then
                      echo "Queue already exists: $queue"
                    else
                      npx wrangler queues create "$queue"
                    fi
                  done
              - name: Provision Knowledge Catalog queues
          '''
          if text.count(needle) != 1:
              raise SystemExit(f'expected one deploy workflow insertion point, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement))
          PY
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_patch-crawl-queue-provisioning.yml
          git add .github/workflows/deploy.yml
          git commit -m "fix: provision crawl queues before deploy"
          git push origin "HEAD:${GITHUB_REF_NAME}"
