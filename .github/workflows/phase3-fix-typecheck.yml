name: Phase 3 Fix Typecheck

on:
  push:
    branches:
      - phase3/complete-migration-no-compat

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase3/complete-migration-no-compat
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply caller migration
        run: python3 .github/scripts/phase3_fix_typecheck.py
      - name: Format
        run: |
          npm ci
          npm run format
      - name: Remove one-shot fixer
        run: |
          rm .github/scripts/phase3_fix_typecheck.py
          rm .github/workflows/phase3-fix-typecheck.yml
      - name: Commit fixes
        run: |
          git config user.name "apapaapapapapa"
          git config user.email "83394495+apaapapapapa@users.noreply.github.com"
          git add -A
          git commit -m "fix(phase3): migrate remaining callers to final contract"
          git push origin HEAD:phase3/complete-migration-no-compat
