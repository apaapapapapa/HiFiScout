name: Diagnose Audio Union

on:
  push:
    branches:
      - feat/audiounion-live-source

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe official Audio Union pages
        run: |
          node <<'NODE'
          const ua = 'HiFiScoutBot/0.1 (+https://github.com/apaapapapapa/HiFiScout)';
          const urls = [
            'https://www.audiounion.jp/robots.txt',
            'https://www.audiounion.jp/st/new_arrival_used.html'
          ];
          for (const url of urls) {
            try {
              const res = await fetch(url, { headers: { 'user-agent': ua }, redirect: 'follow' });
              const text = await res.text();
              const hrefs = [...text.matchAll(/href=["']([^"']+)["']/gi)].map(m => m[1].replaceAll('&amp;', '&'));
              const detailIds = [...new Set(hrefs.map(h => h.match(/\/ct\/detail\/used\/(\d+)\/?/)?.[1]).filter(Boolean))];
              const pagination = [...new Set(hrefs.filter(h => /new_arrival_used\.html[^"']*(?:page|pageno|offset|start)=/i.test(h) || /new_arrival_used[^"']*\/page\//i.test(h)))];
              const detailContexts = [];
              if (url.includes('new_arrival_used')) {
                for (const id of detailIds.slice(0, 3)) {
                  const needle = `/ct/detail/used/${id}/`;
                  const index = text.indexOf(needle);
                  const chunk = index >= 0 ? text.slice(Math.max(0, index - 700), index + 1800) : '';
                  const plain = chunk.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;|&#160;/gi, ' ').replace(/&amp;/gi, '&').replace(/\s+/g, ' ').trim();
                  detailContexts.push({ id, context: plain.slice(0, 700) });
                }
              }
              console.log(JSON.stringify({
                url,
                finalUrl: res.url,
                status: res.status,
                contentType: res.headers.get('content-type'),
                bytes: Buffer.byteLength(text),
                robotsLines: url.endsWith('/robots.txt') ? text.split(/\r?\n/).filter(line => /^(user-agent|allow|disallow|crawl-delay|sitemap)\s*:/i.test(line)).slice(0, 80) : undefined,
                uniqueUsedDetails: url.includes('new_arrival_used') ? detailIds.length : undefined,
                pagination,
                yenCount: url.includes('new_arrival_used') ? (text.match(/[¥￥]|円/g) || []).length : undefined,
                soldCount: url.includes('new_arrival_used') ? (text.match(/売約済|売り切れ|SOLD\s*OUT/gi) || []).length : undefined,
                detailContexts: url.includes('new_arrival_used') ? detailContexts : undefined
              }, null, 2));
            } catch (error) {
              console.log(JSON.stringify({ url, error: String(error) }));
            }
          }
          NODE
