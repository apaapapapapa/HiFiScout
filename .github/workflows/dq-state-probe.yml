name: DQ State Probe

on:
  push:
    branches: [fix/resolver-replay-batch-timeout]

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Query production resolver state
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          raw="$(npx wrangler d1 execute DB --remote --json --command "
            SELECT
              COUNT(*) AS active_listings,
              SUM(CASE WHEN manufacturer_resolver_version < 7 THEN 1 ELSE 0 END) AS stale_manufacturer,
              SUM(CASE WHEN model_resolver_version < 6 THEN 1 ELSE 0 END) AS stale_model,
              SUM(CASE WHEN COALESCE(CAST(json_extract(metadata_json, '$.categoryClassification.version') AS INTEGER), 0) < 14 THEN 1 ELSE 0 END) AS stale_category,
              SUM(CASE WHEN remediation_projection_required = 1 THEN 1 ELSE 0 END) AS projection_dirty
            FROM products WHERE is_active = 1;
            SELECT
              SUM(CASE WHEN status = 'pending' THEN 1 ELSE 0 END) AS pending,
              SUM(CASE WHEN status = 'processing' THEN 1 ELSE 0 END) AS processing,
              SUM(CASE WHEN status = 'resolved' THEN 1 ELSE 0 END) AS resolved,
              SUM(CASE WHEN status = 'failed' THEN 1 ELSE 0 END) AS failed
            FROM data_quality_remediation_queue;
          ")"
          jq . <<< "$raw"
          state="$(jq -c '[.[].results[0]]' <<< "$raw")"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Publish probe state
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.probe.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          stale="$(jq -r '.[0].stale_manufacturer + .[0].stale_model + .[0].stale_category + .[0].projection_dirty' <<< "$STATE")"
          pending="$(jq -r '.[1].pending' <<< "$STATE")"
          processing="$(jq -r '.[1].processing' <<< "$STATE")"
          failed="$(jq -r '.[1].failed' <<< "$STATE")"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='diagnostic/dq-state' \
            -f description="stale=${stale} pending=${pending} processing=${processing} failed=${failed}"
