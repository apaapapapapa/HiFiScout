name: Diagnose crawlers

on:
  push:
    branches: ['fix/dns-ippinkan-hifido']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Inspect Ippinkan markup
        shell: bash
        run: |
          UA='HiFiScoutBot/0.1 (+https://github.com/apaapapapa/HiFiScout)'
          curl -L --max-time 30 -A "$UA" -sS 'https://ippinkan.jp/shopbrand/U100000/' -o /tmp/ipp.euc
          iconv -f EUC-JP -t UTF-8 /tmp/ipp.euc > /tmp/ipp.html
          echo '--- shopdetail anchors ---'
          grep -oE '<a[^>]+href="[^"]*shopdetail[^"]*"[^>]*>[^<]{0,180}' /tmp/ipp.html | head -n 8 || true
          echo '--- around USED-35257 ---'
          grep -n -B 12 -A 12 'USED-35257' /tmp/ipp.html | head -n 80 || true
          echo '--- pagination ---'
          grep -oE 'href="[^"]*(page[0-9]+|pageno=[0-9]+)[^"]*"' /tmp/ipp.html | head -n 20 || true
      - name: Probe Hifido endpoints
        shell: bash
        run: |
          UA='HiFiScoutBot/0.1 (+https://github.com/apaapapapapa/HiFiScout)'
          for url in \
            'https://www.hifido.co.jp/robots.txt' \
            'https://www.hifido.co.jp/?L=50&LNG=J&O=0&OD=0' \
            'https://hifido.co.jp/?L=50&LNG=J&O=0&OD=0' \
            'http://www.hifido.co.jp/?L=50&LNG=J&O=0&OD=0'; do
            echo "--- $url"
            curl -L --max-time 30 -A "$UA" -sS -D /tmp/headers -o /tmp/body "$url" || true
            head -n 8 /tmp/headers || true
            echo "body-bytes=$(wc -c < /tmp/body 2>/dev/null || echo 0)"
          done
