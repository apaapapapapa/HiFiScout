name: Diagnose crawlers

on:
  push:
    branches: ['fix/dns-ippinkan-hifido']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Probe target HTTP responses
        shell: bash
        run: |
          set -u
          UA='HiFiScoutBot/0.1 (+https://github.com/apaapapapa/HiFiScout)'
          for url in \
            'https://ippinkan.jp/robots.txt' \
            'https://ippinkan.jp/shopbrand/U100000/' \
            'https://www.hifido.co.jp/robots.txt' \
            'https://www.hifido.co.jp/?L=50&LNG=J&O=0&OD=0' \
            'https://www.hifido.co.jp/?lang=j' \
            'https://www.hifido.co.jp/index.html'; do
            echo "--- $url"
            curl -L --max-time 30 -A "$UA" -sS -D /tmp/headers -o /tmp/body "$url" || true
            head -n 20 /tmp/headers || true
            echo "body-bytes=$(wc -c < /tmp/body 2>/dev/null || echo 0)"
            head -c 400 /tmp/body 2>/dev/null | tr '\n' ' ' || true
            echo
          done
      - name: Run live parsers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { parseProductPage } from './src/crawler/parser.js';
          import { parseHifidoListing } from './src/crawler/shops/hifido.js';
          const ua = 'HiFiScoutBot/0.1 (+https://github.com/apaapapapa/HiFiScout)';
          async function get(url) {
            const r = await fetch(url, {headers: {'User-Agent': ua, 'Accept-Language':'ja,en;q=0.7'}});
            const text = await r.text();
            console.log('fetch', url, r.status, text.length);
            return {r,text};
          }
          const ipp = await get('https://ippinkan.jp/shopbrand/U100000/');
          const ippItems = parseProductPage(ipp.text, {
            shopKey:'ippinkan', baseUrl:'https://ippinkan.jp/shopbrand/U100000/',
            productUrlPattern:/ippinkan\.jp\/(?:shopdetail|view\/item|shop\/products?)/i
          });
          console.log('ippinkan parsed', ippItems.length, ippItems.slice(0,3));
          const hifi = await get('https://www.hifido.co.jp/?L=50&LNG=J&O=0&OD=0');
          const hifiItems = parseHifidoListing(hifi.text);
          console.log('hifido parsed', hifiItems.length, hifiItems.slice(0,3));
          NODE
