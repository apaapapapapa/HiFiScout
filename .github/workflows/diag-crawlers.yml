name: Diagnose crawlers

on:
  push:
    branches: ['fix/dns-ippinkan-hifido']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate live crawler behavior
        run: |
          node --input-type=module <<'NODE'
          import { fetchHtmlPage } from './src/crawler/fetch.js';
          import { ippinkanAdapter } from './src/crawler/shops/ippinkan.js';
          import { hifidoAdapter } from './src/crawler/shops/hifido.js';

          const userAgent = 'HiFiScoutBot/0.1 (+https://github.com/apaapapapa/HiFiScout)';
          const common = { userAgent, requestDelayMs: 0 };

          for (const url of [
            'https://ippinkan.jp/shopbrand/U100000/',
            'https://ippinkan.jp/shopbrand/U100000/page2/order/'
          ]) {
            const html = await fetchHtmlPage(url, { ...common, baseUrl: ippinkanAdapter.baseUrl });
            const items = ippinkanAdapter.parse(html, url);
            console.log('IPPINKAN', url, 'html=', html.length, 'items=', items.length, items.slice(0, 2));
            if (items.length < 20) throw new Error(`Ippinkan parsed too few items: ${items.length}`);
          }

          try {
            const url = 'https://www.hifido.co.jp/?L=50&LNG=J&O=0&OD=0';
            const html = await fetchHtmlPage(url, { ...common, baseUrl: hifidoAdapter.baseUrl });
            console.log('HIFIDO unexpected success', hifidoAdapter.parse(html).length);
          } catch (error) {
            console.log('HIFIDO expected source-side block:', error.message);
            if (!/crawl blocked with HTTP 403/.test(error.message)) throw error;
          }
          NODE
