name: Diagnose crawlers

on:
  push:
    branches: ['fix/dns-ippinkan-hifido']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Inspect Ippinkan markup
        shell: bash
        run: |
          set +e
          UA='HiFiScoutBot/0.1 (+https://github.com/apaapapapapa/HiFiScout)'
          curl -L --max-time 30 -A "$UA" -sS 'https://ippinkan.jp/shopbrand/U100000/' -o /tmp/ipp.html
          echo '--- shopdetail hrefs ---'
          LC_ALL=C grep -aoE 'href="[^"]*shopdetail[^"]*"' /tmp/ipp.html | head -n 12
          echo '--- around USED-35257 (raw/mixed encoding) ---'
          LC_ALL=C grep -an -B 10 -A 10 'USED-35257' /tmp/ipp.html | head -n 80
          echo '--- around first shopdetail ---'
          first_line=$(LC_ALL=C grep -an -m1 'shopdetail' /tmp/ipp.html | cut -d: -f1)
          if [ -n "$first_line" ]; then sed -n "$((first_line-8)),$((first_line+25))p" /tmp/ipp.html | head -n 80; fi
          echo '--- pagination ---'
          LC_ALL=C grep -aoE 'href="[^"]*(page[0-9]+|pageno=[0-9]+)[^"]*"' /tmp/ipp.html | head -n 20
      - name: Probe Hifido endpoints
        shell: bash
        run: |
          set +e
          UA='HiFiScoutBot/0.1 (+https://github.com/apaapapapa/HiFiScout)'
          for url in \
            'https://www.hifido.co.jp/robots.txt' \
            'https://www.hifido.co.jp/?L=50&LNG=J&O=0&OD=0' \
            'https://hifido.co.jp/?L=50&LNG=J&O=0&OD=0' \
            'http://www.hifido.co.jp/?L=50&LNG=J&O=0&OD=0'; do
            echo "--- $url"
            curl -L --max-time 30 -A "$UA" -sS -D /tmp/headers -o /tmp/body "$url" || true
            head -n 8 /tmp/headers || true
            echo "body-bytes=$(wc -c < /tmp/body 2>/dev/null || echo 0)"
          done
