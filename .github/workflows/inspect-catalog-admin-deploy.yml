name: Inspect Catalog Admin Deployment

on:
  pull_request:
    paths:
      - ".github/workflows/inspect-catalog-admin-deploy.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 993e3d11f572a67e0258e4554b25feb7ddafe383
    steps:
      - name: Print matching main runs
        shell: bash
        run: |
          set -euo pipefail
          echo "CI runs for target"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=30" \
            | jq --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | {id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url}'
          echo "Deploy runs for target"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=workflow_run&per_page=30" \
            | jq --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | {id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url}'
          echo "Latest deploy runs"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=workflow_run&per_page=5" \
            | jq '.workflow_runs[] | {id,status,conclusion,head_sha,created_at,updated_at,html_url}'
