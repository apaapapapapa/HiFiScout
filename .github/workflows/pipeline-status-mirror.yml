name: Pipeline Status Mirror

on:
  workflow_run:
    workflows: ["CI", "Deploy Cloudflare"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror upstream workflow result to commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          case "$UPSTREAM_NAME" in
            CI) context="hifiscout/ci" ;;
            "Deploy Cloudflare") context="hifiscout/deploy" ;;
            *) echo "Unexpected workflow: $UPSTREAM_NAME" >&2; exit 1 ;;
          esac

          if [[ "$UPSTREAM_CONCLUSION" == "success" ]]; then
            state="success"
          else
            state="failure"
          fi

          payload="$(jq -nc \
            --arg state "$state" \
            --arg context "$context" \
            --arg description "$UPSTREAM_NAME: $UPSTREAM_CONCLUSION" \
            --arg target_url "$UPSTREAM_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${TARGET_SHA}" \
            -d "$payload" >/dev/null
