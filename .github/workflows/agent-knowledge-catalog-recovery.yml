name: Agent knowledge catalog queue recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply recovery fix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing anchor for {label} in {path}")
              p.write_text(text.replace(old, new, 1))

          # Queue repository: inspect unclaimable jobs instead of assuming they are terminal,
          # and provide an idempotent cleanup for work stranded behind a failed review run.
          replace_once(
              "src/db/knowledge-catalog-verification-queue-repository.ts",
              '''export async function incrementKnowledgeCatalogVerificationSourceAttempt(
          ''',
              '''export async function getKnowledgeCatalogVerificationJob(
            db: QueryableDatabase,
            jobId: number,
          ): Promise<KnowledgeCatalogVerificationJob | null> {
            const row = await db
              .prepare("SELECT * FROM knowledge_catalog_verification_jobs WHERE id = ?")
              .bind(jobId)
              .first<KnowledgeCatalogVerificationJobRow>();
            return jobFromRow(row);
          }

          export async function deadLetterOutstandingKnowledgeCatalogVerificationJobsForRun(
            db: QueryableDatabase,
            runId: number,
            finishedAt: string,
            message: unknown,
          ): Promise<number> {
            const result = await db
              .prepare(`
                UPDATE knowledge_catalog_verification_jobs
                SET status = 'dead_letter',
                    outcome = 'error',
                    finished_at = ?,
                    available_at = NULL,
                    claimed_at = NULL,
                    lease_expires_at = NULL,
                    last_message = ?,
                    updated_at = ?
                WHERE run_id = ?
                  AND status IN ('queued', 'processing', 'retrying')
              `)
              .bind(
                finishedAt,
                String(message || "failed_run_recovery").slice(0, 1000),
                finishedAt,
                runId,
              )
              .run();
            return number(result?.meta?.changes);
          }

          export async function incrementKnowledgeCatalogVerificationSourceAttempt(
          ''',
              "queue recovery helpers",
          )

          # Review repository: atomically create exactly one successor run for the current failed run.
          replace_once(
              "src/db/knowledge-catalog-review-repository.ts",
              '''export async function claimInitialKnowledgeCatalogReviewRun(
          ''',
              '''export async function latestKnowledgeCatalogReviewRunState(
            db: QueryableDatabase,
          ): Promise<Pick<KnowledgeCatalogReviewRunRow, "id" | "status" | "message"> | null> {
            return db
              .prepare("SELECT id, status, message FROM knowledge_catalog_review_runs ORDER BY id DESC LIMIT 1")
              .first<Pick<KnowledgeCatalogReviewRunRow, "id" | "status" | "message">>();
          }

          export async function startKnowledgeCatalogRecoveryReviewRun(
            db: QueryableDatabase,
            failedRunId: number,
            startedAt: string,
          ): Promise<number | null> {
            const run = await db
              .prepare(`
                INSERT INTO knowledge_catalog_review_runs(started_at, status, message)
                SELECT ?, 'running', ?
                WHERE EXISTS (
                  SELECT 1 FROM knowledge_catalog_review_runs
                  WHERE id = ? AND status = 'failed'
                )
                  AND NOT EXISTS (
                    SELECT 1 FROM knowledge_catalog_review_runs
                    WHERE id > ?
                  )
              `)
              .bind(startedAt, `recovery_of_run:${failedRunId}`, failedRunId, failedRunId)
              .run();
            return Number(run?.meta?.changes || 0) > 0 ? Number(run?.meta?.last_row_id || 0) : null;
          }

          export async function claimInitialKnowledgeCatalogReviewRun(
          ''',
              "review recovery claim",
          )

          # Dispatch may populate an already-claimed recovery run rather than creating a second row.
          replace_once(
              "src/knowledge-catalog/types.ts",
              '''  /** Non-zero while a verifier rollout is in flight, so finalization can close it out. */
            verifierVersion?: number;
          }
          ''',
              '''  /** Non-zero while a verifier rollout is in flight, so finalization can close it out. */
            verifierVersion?: number;
            /** Existing atomically-claimed run row used only by failed-run recovery. */
            runId?: number;
          }
          ''',
              "dispatch run id option",
          )
          replace_once(
              "src/knowledge-catalog/dispatch.ts",
              '''  { now = new Date(), mode, preferRetries = false, verifierVersion = 0 }: DispatchRunOptions,
          ) {''',
              '''  {
            now = new Date(),
            mode,
            preferRetries = false,
            verifierVersion = 0,
            runId: existingRunId = 0,
          }: DispatchRunOptions,
          ) {''',
              "dispatch options destructure",
          )
          replace_once(
              "src/knowledge-catalog/dispatch.ts",
              '''  const startedAt = now.toISOString();
            const runId = await startKnowledgeCatalogReviewRun(env.DB, startedAt);
          ''',
              '''  const startedAt = now.toISOString();
            const runId = existingRunId || (await startKnowledgeCatalogReviewRun(env.DB, startedAt));
          ''',
              "dispatch existing recovery run",
          )

          # Consumer: a Queue redelivery while the DB lease is still held must be retried, never ACKed.
          replace_once(
              "src/knowledge-catalog/consumer.ts",
              '''  deadLetterKnowledgeCatalogVerificationJob,
            incrementKnowledgeCatalogVerificationSourceAttempt,
          ''',
              '''  deadLetterKnowledgeCatalogVerificationJob,
            getKnowledgeCatalogVerificationJob,
            incrementKnowledgeCatalogVerificationSourceAttempt,
          ''',
              "consumer get job import",
          )
          replace_once(
              "src/knowledge-catalog/consumer.ts",
              '''const DELIVERY_ATTEMPT_MULTIPLIER = 2;
          ''',
              '''const DELIVERY_ATTEMPT_MULTIPLIER = 2;

          function unclaimableRetryDelaySeconds(
            env: KnowledgeCatalogQueueEnv,
            job: KnowledgeCatalogVerificationJob,
            now: Date,
          ): number {
            const retryAt = job.status === "processing" ? job.leaseExpiresAt : job.availableAt;
            const untilRetry = retryAt
              ? Math.ceil((new Date(retryAt).getTime() - now.getTime()) / 1000)
              : domainRetrySeconds(env);
            return Math.max(1, Math.min(jobLeaseSeconds(env), untilRetry > 0 ? untilRetry : domainRetrySeconds(env)));
          }
          ''',
              "unclaimable retry delay",
          )
          replace_once(
              "src/knowledge-catalog/consumer.ts",
              '''  // Already claimed, already finished, or already dead-lettered: another consumer owns the outcome.
            if (!job) {
              message.ack();
              return { status: "ignored", reason: "job_not_claimable" };
            }
          ''',
              '''  if (!job) {
              const current = await getKnowledgeCatalogVerificationJob(env.DB, jobId);
              if (!current || current.status === "completed" || current.status === "dead_letter") {
                message.ack();
                return { status: "ignored", reason: "job_terminal_or_missing" };
              }

              // A redelivery can race a still-valid D1 lease after the previous Worker was interrupted.
              // ACKing here loses the only Queue message and strands the row in `processing` forever.
              const delaySeconds = unclaimableRetryDelaySeconds(env, current, now);
              message.retry({ delaySeconds });
              return {
                status: "retrying",
                reason: current.status === "processing" ? "job_lease_held" : "job_not_ready",
                delaySeconds,
              };
            }
          ''',
              "do not ack leased job",
          )

          # General cron: recover a failed latest review exactly once, clean its stranded jobs,
          # then populate the atomically-created successor run with retry-prioritized work.
          replace_once(
              "src/scheduled.ts",
              '''import { knowledgeCatalogVerificationQueueStatus } from "./db/knowledge-catalog-verification-queue-repository.js";
          ''',
              '''import {
            deadLetterOutstandingKnowledgeCatalogVerificationJobsForRun,
            knowledgeCatalogVerificationQueueStatus,
          } from "./db/knowledge-catalog-verification-queue-repository.js";
          import {
            finishKnowledgeCatalogReviewRunFailure,
            latestKnowledgeCatalogReviewRunState,
            startKnowledgeCatalogRecoveryReviewRun,
          } from "./db/knowledge-catalog-review-repository.js";
          ''',
              "scheduled recovery imports",
          )
          replace_once(
              "src/scheduled.ts",
              '''  const [state, queue] = await Promise.all([
            knowledgeCatalogVerifierState(env.DB),
            knowledgeCatalogVerificationQueueStatus(env.DB),
          ]);
            if (queue.latestRunId) {
              return { status: "skipped", reason: "knowledge_catalog_queue_already_bootstrapped" };
            }

            // A rollout that claimed the version but never finished keeps its version; anything else
            // bootstraps at 0 so the run is treated as a plain first fill rather than a rollout.
            const verifierVersion =
              state?.version === KNOWLEDGE_CATALOG_VERIFIER_VERSION && state.status !== "success"
                ? KNOWLEDGE_CATALOG_VERIFIER_VERSION
                : 0;
          ''',
              '''  const [state, queue, latestReview] = await Promise.all([
            knowledgeCatalogVerifierState(env.DB),
            knowledgeCatalogVerificationQueueStatus(env.DB),
            latestKnowledgeCatalogReviewRunState(env.DB),
          ]);

            // A rollout that claimed the version but never finished keeps its version; anything else
            // bootstraps at 0 so the run is treated as a plain first fill rather than a rollout.
            const verifierVersion =
              state?.version === KNOWLEDGE_CATALOG_VERIFIER_VERSION && state.status !== "success"
                ? KNOWLEDGE_CATALOG_VERIFIER_VERSION
                : 0;

            if (latestReview?.status === "running") {
              return { status: "skipped", reason: "knowledge_catalog_review_in_progress" };
            }
            if (latestReview?.status === "failed") {
              const failedRunId = Number(latestReview.id || 0);
              const recoveryRunId = failedRunId
                ? await startKnowledgeCatalogRecoveryReviewRun(env.DB, failedRunId, startedAt)
                : null;
              if (!recoveryRunId) {
                return { status: "skipped", reason: "knowledge_catalog_recovery_already_claimed" };
              }
              try {
                const abandonedJobs = await deadLetterOutstandingKnowledgeCatalogVerificationJobsForRun(
                  env.DB,
                  failedRunId,
                  startedAt,
                  `abandoned_after_failed_run:${failedRunId}`,
                );
                console.warn(
                  JSON.stringify({
                    event: "knowledge_catalog_failed_run_recovery_started",
                    failedRunId,
                    recoveryRunId,
                    abandonedJobs,
                    verifierVersion,
                  }),
                );
                return await dispatchKnowledgeCatalogDailyVerification(env, {
                  now,
                  preferRetries: true,
                  verifierVersion,
                  runId: recoveryRunId,
                });
              } catch (error) {
                await finishKnowledgeCatalogReviewRunFailure(
                  env.DB,
                  recoveryRunId,
                  new Date().toISOString(),
                  `knowledge_catalog_recovery_dispatch_failed:${errorMessage(error)}`,
                );
                throw error;
              }
            }
            if (queue.latestRunId) {
              return { status: "skipped", reason: "knowledge_catalog_queue_already_bootstrapped" };
            }
          ''',
              "scheduled failed run recovery",
          )

          # Existing test codified the bug. It now asserts that a held lease causes Queue retry.
          replace_once(
              "test/knowledge-catalog-verification-queue-behavior.test.ts",
              '''test("a job another consumer already holds is acked without being processed", async () => {
            // Claiming is a conditional UPDATE; zero changed rows means the lease is held elsewhere.
            const db = queueDatabase((sql) =>
              sql.includes("SET status = 'processing'") ? { changes: 0 } : {},
            );
            const { message, acks, retries } = queueMessage();

            const result = await consumeKnowledgeCatalogVerificationMessage(queueEnv(db), message);

            assert.deepEqual(result, { status: "ignored", reason: "job_not_claimable" });
            assert.equal(acks.length, 1);
            assert.equal(retries.length, 0);
            assert.equal(db.ran("SET status = 'retrying'").length, 0);
          });''',
              '''test("a redelivery while another consumer holds the lease is retried instead of lost", async () => {
            // Claiming is a conditional UPDATE; zero changed rows means the lease is held elsewhere.
            const db = queueDatabase((sql) => {
              if (sql.includes("SET status = 'processing'")) return { changes: 0 };
              if (sql.includes("SELECT * FROM knowledge_catalog_verification_jobs")) {
                return {
                  row: knowledgeJobRow({
                    status: "processing",
                    lease_expires_at: "2099-01-01T00:00:00.000Z",
                  }),
                };
              }
              return {};
            });
            const { message, acks, retries } = queueMessage();

            const result = await consumeKnowledgeCatalogVerificationMessage(queueEnv(db), message);

            assert.equal(result.status, "retrying");
            assert.equal("reason" in result && result.reason, "job_lease_held");
            assert.equal(acks.length, 0);
            assert.equal(retries[0]?.delaySeconds, 900);
            assert.equal(
              db.ran("SET status = 'retrying'").length,
              0,
              "the consumer that owns the current lease remains the only writer of the job state",
            );
          });

          test("a redelivery for a terminal job is acknowledged without reprocessing", async () => {
            const db = queueDatabase((sql) => {
              if (sql.includes("SET status = 'processing'")) return { changes: 0 };
              if (sql.includes("SELECT * FROM knowledge_catalog_verification_jobs")) {
                return { row: knowledgeJobRow({ status: "completed" }) };
              }
              return {};
            });
            const { message, acks, retries } = queueMessage();

            const result = await consumeKnowledgeCatalogVerificationMessage(queueEnv(db), message);

            assert.deepEqual(result, { status: "ignored", reason: "job_terminal_or_missing" });
            assert.equal(acks.length, 1);
            assert.equal(retries.length, 0);
          });''',
              "leased message behavior test",
          )

          # Dispatch test: an atomically pre-created recovery row is populated, not duplicated.
          replace_once(
              "test/knowledge-catalog-verification-dispatch.test.ts",
              '''test("dispatch refuses to start when the queue binding is missing", async () => {
          ''',
              '''test("a pre-created recovery run is populated without inserting a duplicate review row", async () => {
            const db = dispatchDatabase();
            const queue = queueBinding();

            const result = await dispatchKnowledgeCatalogDailyVerification(queueEnv(db, queue.binding), {
              runId: RUN_ID,
              preferRetries: true,
            });

            assert.equal(result.runId, RUN_ID);
            assert.equal(db.ran("INSERT INTO knowledge_catalog_review_runs").length, 0);
          });

          test("dispatch refuses to start when the queue binding is missing", async () => {
          ''',
              "recovery run dispatch test",
          )

          # Repository-focused recovery tests require only the lightweight D1 recorder.
          Path("test/knowledge-catalog-recovery.test.ts").write_text('''import test from "node:test";
          import assert from "node:assert/strict";

          import {
            latestKnowledgeCatalogReviewRunState,
            startKnowledgeCatalogRecoveryReviewRun,
          } from "../src/db/knowledge-catalog-review-repository.js";
          import { deadLetterOutstandingKnowledgeCatalogVerificationJobsForRun } from "../src/db/knowledge-catalog-verification-queue-repository.js";
          import { queueDatabase } from "./helpers/knowledge-queue.js";

          test("failed review recovery is claimed by one atomic successor insert", async () => {
            const db = queueDatabase((sql) => {
              if (sql.includes("SELECT id, status, message")) {
                return { row: { id: 13, status: "failed", message: "finalizer exhausted" } };
              }
              if (sql.includes("INSERT INTO knowledge_catalog_review_runs")) {
                return { changes: 1, lastRowId: 14 };
              }
              return {};
            });

            assert.deepEqual(await latestKnowledgeCatalogReviewRunState(db), {
              id: 13,
              status: "failed",
              message: "finalizer exhausted",
            });
            assert.equal(await startKnowledgeCatalogRecoveryReviewRun(db, 13, "2026-08-18T12:00:00.000Z"), 14);
            const insert = db.ran("INSERT INTO knowledge_catalog_review_runs")[0];
            assert.ok(insert.sql.includes("NOT EXISTS"));
            assert.deepEqual(insert.binds.slice(-2), [13, 13]);
          });

          test("failed review recovery closes every stranded non-terminal queue row", async () => {
            const db = queueDatabase((sql) =>
              sql.includes("status IN ('queued', 'processing', 'retrying')") ? { changes: 3 } : {},
            );

            const count = await deadLetterOutstandingKnowledgeCatalogVerificationJobsForRun(
              db,
              13,
              "2026-08-18T12:00:00.000Z",
              "abandoned_after_failed_run:13",
            );

            assert.equal(count, 3);
            const update = db.ran("status IN ('queued', 'processing', 'retrying')")[0];
            assert.equal(update.binds.at(-1), 13);
            assert.ok(update.sql.includes("status = 'dead_letter'"));
            assert.ok(update.sql.includes("lease_expires_at = NULL"));
          });
          ''')

      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npx oxfmt --write src/db/knowledge-catalog-verification-queue-repository.ts src/db/knowledge-catalog-review-repository.ts src/knowledge-catalog/types.ts src/knowledge-catalog/dispatch.ts src/knowledge-catalog/consumer.ts src/scheduled.ts test/knowledge-catalog-verification-queue-behavior.test.ts test/knowledge-catalog-verification-dispatch.test.ts test/knowledge-catalog-recovery.test.ts
      - name: Validate
        run: |
          npm run check
          npm run build
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/db/knowledge-catalog-verification-queue-repository.ts src/db/knowledge-catalog-review-repository.ts src/knowledge-catalog/types.ts src/knowledge-catalog/dispatch.ts src/knowledge-catalog/consumer.ts src/scheduled.ts test/knowledge-catalog-verification-queue-behavior.test.ts test/knowledge-catalog-verification-dispatch.test.ts test/knowledge-catalog-recovery.test.ts
          git commit -m 'fix: recover stranded knowledge catalog queue jobs'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
