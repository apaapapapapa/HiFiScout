name: Apply Post-Merge Switch Pipeline Fix

on:
  push:
    branches: [fix/post-merge-switch-pipeline]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'fix/post-merge-switch-pipeline')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/post-merge-switch-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch E2E semantics and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/tests/catalog.spec.ts')
          text = path.read_text()
          old = '    await expect(titleControl).toHaveAttribute("data-offers", /.+/);'
          new = '''    const tagName = await titleControl.evaluate((element) => element.tagName);
              if (tagName === "BUTTON") {
                await expect(titleControl).toHaveAttribute("data-offers", /.+/);
              } else {
                expect(tagName).toBe("A");
                await expect(titleControl).toHaveAttribute("href", /^https?:\\/\\//);
                await expect(titleControl).toHaveAttribute("target", "_blank");
              }'''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('catalog title assertion line not found')
          path.write_text(text.replace(old, new, 1))
          PY

          npx oxfmt --write e2e/tests/catalog.spec.ts
          git diff --check
          npm run typecheck
          npm run lint
          npm run test:unit

          git add e2e/tests/catalog.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(e2e): accept single-offer title links'
          git push origin HEAD:fix/post-merge-switch-pipeline
