name: Temporary category taxonomy PR trigger v4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/refine-audio-category-taxonomy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/refine-audio-category-taxonomy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply structural taxonomy patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def one(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected 1 literal match, got {text.count(old)}")
              return text.replace(old, new, 1)

          def block(text, category_id, replacement):
              pattern = rf'  \{{\n    id: "{re.escape(category_id)}",.*?\n  \}},\n'
              text, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"block {category_id}: expected 1, got {count}")
              return text

          def order(text, category_id, value):
              pattern = rf'(id: "{re.escape(category_id)}",.*?\n    order: )\d+'
              text, count = re.subn(pattern, rf'\g<1>{value}', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"order {category_id}: expected 1, got {count}")
              return text

          # types.ts
          path = 'src/catalog/types.ts'
          text = read(path)
          text = one(text, '  | "cd_sacd_player"\n  | "dap"', '  | "cd_sacd_player"\n  | "cd_sacd_transport"\n  | "dap"', 'types transport')
          text = one(text, '  | "phono_eq"\n  | "speaker_bookshelf"', '  | "phono_eq"\n  | "phono_step_up_transformer"\n  | "speaker_bookshelf"', 'types step-up')
          text = one(text, '  | "headphone"\n  | "earphone"', '  | "wired_headphone"\n  | "wired_earphone"\n  | "btw_headphone"\n  | "btw_earphone"', 'types headphones')
          text = one(text, '  | "rack"\n  | "power_accessory"\n  | "vacuum_tube"', '  | "rack"\n  | "power_strip"\n  | "clean_power"\n  | "vacuum_tube"', 'types power')
          text = one(text, '/** Every id present in `CATEGORIES` (45 entries). */', '/** Every id present in `CATEGORIES` (50 entries). */', 'count comment')
          text = one(text,
              'export type LegacyCategoryAlias = "network_transport" | "accessory" | "speaker_other";',
              'export type LegacyCategoryAlias =\n  | "network_transport"\n  | "accessory"\n  | "speaker_other"\n  | "headphone"\n  | "earphone"\n  | "power_accessory";',
              'legacy type')
          write(path, text)

          # categories.ts
          path = 'src/catalog/categories.ts'
          text = read(path)
          text = block(text, 'cd_sacd_player', '''  {
            id: "cd_sacd_player",
            name: "CD/SACDプレーヤー",
            parentId: "digital",
            order: 3,
            classifiable: true,
            filterable: true,
            aliases: [
              "cd player",
              "sacd player",
              "sacd/cd player",
              "cdプレーヤー",
              "sacdプレーヤー",
              "sacd/cdプレーヤー",
              "cd/sacdプレーヤー",
            ],
          },
          {
            id: "cd_sacd_transport",
            name: "CD/SACDトランスポート",
            parentId: "digital",
            order: 4,
            classifiable: true,
            filterable: true,
            aliases: [
              "cd transport",
              "sacd transport",
              "super audio cd transport",
              "disc transport",
              "cdトランスポート",
              "sacdトランスポート",
              "cd/sacdトランスポート",
              "トランスポート",
            ],
          },
          ''')
          for cid, value in [('dap',5),('network_switch',6),('optical_isolator',7),('router',8),('music_server',9),('master_clock',10)]:
              text = order(text, cid, value)
          text = block(text, 'phono_eq', '''  {
            id: "phono_eq",
            name: "フォノイコライザー",
            parentId: "analog",
            order: 4,
            classifiable: true,
            filterable: true,
            aliases: ["phono equalizer", "phono eq", "phono stage", "フォノイコライザー", "フォノアンプ"],
          },
          {
            id: "phono_step_up_transformer",
            name: "昇圧トランス",
            parentId: "analog",
            order: 5,
            classifiable: true,
            filterable: true,
            aliases: ["step-up transformer", "step up transformer", "mc transformer", "moving coil transformer", "昇圧トランス", "mc昇圧トランス"],
          },
          ''')
          text = block(text, 'headphone', '''  {
            id: "wired_headphone",
            name: "有線ヘッドホン",
            parentId: "headphone_group",
            order: 1,
            classifiable: true,
            filterable: true,
            aliases: ["wired headphone", "wired headphones", "有線ヘッドホン"],
          },
          {
            id: "wired_earphone",
            name: "有線イヤホン",
            parentId: "headphone_group",
            order: 2,
            classifiable: true,
            filterable: true,
            aliases: ["wired earphone", "wired earphones", "wired earbuds", "有線イヤホン"],
          },
          {
            id: "btw_headphone",
            name: "BTWヘッドホン",
            parentId: "headphone_group",
            order: 3,
            classifiable: true,
            filterable: true,
            aliases: ["bluetooth headphone", "bluetooth headphones", "wireless headphone", "wireless headphones", "bluetoothヘッドホン", "ワイヤレスヘッドホン", "BTWヘッドホン"],
          },
          {
            id: "btw_earphone",
            name: "BTWイヤホン",
            parentId: "headphone_group",
            order: 4,
            classifiable: true,
            filterable: true,
            aliases: ["bluetooth earphone", "bluetooth earphones", "wireless earphone", "wireless earphones", "wireless earbuds", "true wireless", "tws", "bluetoothイヤホン", "ワイヤレスイヤホン", "完全ワイヤレスイヤホン", "BTWイヤホン"],
          },
          ''')
          text = block(text, 'earphone', '')
          text = block(text, 'power_accessory', '''  {
            id: "power_strip",
            name: "電源タップ",
            parentId: "accessories",
            order: 3,
            classifiable: true,
            filterable: true,
            aliases: ["power strip", "power distributor", "power distribution", "電源タップ", "電源ボックス"],
          },
          {
            id: "clean_power",
            name: "クリーン電源",
            parentId: "accessories",
            order: 4,
            classifiable: true,
            filterable: true,
            aliases: ["clean power", "power conditioner", "power regenerator", "ac regenerator", "クリーン電源", "電源コンディショナー", "電源コンディショナ", "電源リジェネレーター"],
          },
          ''')
          text = order(text, 'vacuum_tube', 5)
          text = order(text, 'other_accessory', 6)
          legacy_pattern = r'const LEGACY_ALIASES: Readonly<Record<string, ClassifiableCategoryId>> = Object\.freeze\(\{.*?\n\}\);'
          legacy_replacement = '''const LEGACY_ALIASES: Readonly<Record<string, ClassifiableCategoryId>> = Object.freeze({
            network_transport: "network_player",
            accessory: "other_accessory",
            speaker_other: "other",
            headphone: "wired_headphone",
            earphone: "wired_earphone",
            power_accessory: "clean_power",
          });'''
          text, count = re.subn(legacy_pattern, lambda _: legacy_replacement, text, count=1, flags=re.S)
          if count != 1: raise SystemExit(f'legacy map: {count}')
          filter_pattern = r'export function categoryFilterIds\(value: string = ""\): CategoryId\[\] \{.*?\n\}'
          filter_replacement = '''export function categoryFilterIds(value: string = ""): string[] {
            const categoryId = categoryIdForFilter(value);
            if (!categoryId) return [];
            const canonicalIds = CATEGORIES.filter(
              (candidate) =>
                candidate.id === categoryId || categoryClosureIds(candidate.id).includes(categoryId),
            ).map((candidate) => candidate.id);
            const legacyIds = Object.entries(LEGACY_ALIASES)
              .filter(([, canonical]) => canonicalIds.includes(canonical))
              .map(([legacy]) => legacy);
            return [...new Set([...canonicalIds, ...legacyIds])];
          }'''
          text, count = re.subn(filter_pattern, lambda _: filter_replacement, text, count=1, flags=re.S)
          if count != 1: raise SystemExit(f'filter ids: {count}')
          write(path, text)

          # category-evidence.ts
          path = 'src/catalog/category-evidence.ts'
          text = read(path)
          marker = '  "cable_other",\n]);'
          text = one(text, marker, '  "cable_other",\n  "wired_headphone",\n  "wired_earphone",\n  "clean_power",\n]);', 'broad seller ids')
          write(path, text)

          # category-rules.ts: replace rule regions by id boundaries
          path = 'src/catalog/category-rules.ts'
          text = read(path)
          text = one(text,
              '  ["power_accessory", /power\\s*(?:strip|conditioner)|電源タップ|電源コンディショナ(?:ー)?/i],',
              '''  [
            "clean_power",
            /power\\s*(?:conditioner|regenerator)|ac\\s*regenerator|clean\\s*power|クリーン電源|電源コンディショナ(?:ー)?|電源リジェネレータ(?:ー)?/i,
          ],
          ["power_strip", /power\\s*(?:strip|distributor|distribution)|電源タップ|電源ボックス/i],''',
              'power rules')
          start = text.index('  [\n    "cd_sacd_player",')
          end = text.index('\n  ["phono_eq",', start)
          text = text[:start] + '''  [
            "cd_sacd_transport",
            /(?:sacd|cd)\\s*(?:\\/\\s*(?:sacd|cd))?\\s*(?:transport|トランスポート)|super\\s+audio\\s+cd\\s+transport|(?:cd|sacd)\\s*\\/\\s*(?:sacd|cd)\\s*トランスポート/i,
          ],
          [
            "cd_sacd_player",
            /network\\s+cd\\s+receiver|(?:sacd|cd)\\s*(?:\\/\\s*(?:sacd|cd))?\\s*(?:player|プレーヤー|プレイヤー)|(?:sacd\\s*\\/\\s*cd|cd\\s*\\/\\s*sacd)(?!\\s*トランスポート)/i,
          ],
          [
            "phono_step_up_transformer",
            /(?:mc|moving\\s+coil)\\s+(?:step[\\s-]*up\\s+)?transformer|step[\\s-]*up\\s+transformer|(?:mc)?昇圧トランス/i,
          ],''' + text[end:]
          start = text.index('  ["earphone", /')
          end = text.index('\n  ["dj_dtm",', start)
          text = text[:start] + '''  [
            "btw_earphone",
            /(?:bluetooth|wireless|true\\s+wireless|\\btws\\b).*?(?:earphones?|earbuds?|\\biem\\b)|(?:earphones?|earbuds?|\\biem\\b).*?(?:bluetooth|wireless|true\\s+wireless|\\btws\\b)|(?:bluetooth|ワイヤレス|完全ワイヤレス).*?イヤホン|イヤホン.*?(?:bluetooth|ワイヤレス|完全ワイヤレス)/i,
          ],
          [
            "btw_headphone",
            /(?:bluetooth|wireless).*?headphones?|headphones?.*?(?:bluetooth|wireless)|(?:bluetooth|ワイヤレス).*?ヘッドホン|ヘッドホン.*?(?:bluetooth|ワイヤレス)/i,
          ],
          ["wired_earphone", /\\bearphones?\\b|\\bearbuds?\\b|\\biem\\b|イヤホン/i],
          ["wired_headphone", /\\bheadphones?\\b|ヘッドホン/i],''' + text[end:]
          write(path, text)

          # version
          path = 'src/catalog/product-normalizer.ts'
          text = one(read(path), 'const CLASSIFICATION_METADATA_VERSION = 6;', 'const CLASSIFICATION_METADATA_VERSION = 7;', 'classification version')
          write(path, text)

          # metadata counts: canonicalize legacy ids while replay drains
          path = 'src/http/meta.ts'
          text = read(path)
          pattern = r'  const counts = new Map\(\n    \(facets\[1\]\?\.results \|\| \[\]\)\.map\(\(row\): \[string, number\] => \[\n      row\.value,\n      Number\(row\.active_product_count \|\| 0\),\n    \]\),\n  \);'
          replacement = '''  const counts = new Map<string, number>();
          for (const row of facets[1]?.results || []) {
            const categoryId = getCategory(row.value)?.id || row.value;
            counts.set(categoryId, (counts.get(categoryId) || 0) + Number(row.active_product_count || 0));
          }'''
          text, count = re.subn(pattern, lambda _: replacement, text, count=1)
          if count != 1: raise SystemExit(f'meta counts: {count}')
          write(path, text)

          # UI separator
          path = 'frontend/product-view.ts'
          text = read(path)
          start = text.index('  const topLevel = ungrouped')
          end = text.index('\n  const groups =', start)
          text = text[:start] + '''  const topLevel = ungrouped
            .map((facet) => {
              const topLevelFacet = facet.parentId === null;
              const before =
                topLevelFacet && (!facet.classifiable || facet.id === "dj_dtm")
                  ? CATEGORY_SEPARATOR
                  : "";
              const after = topLevelFacet && facet.id === "dj_dtm" ? CATEGORY_SEPARATOR : "";
              return `${before}${option(facet)}${after}`;
            })
            .join("");''' + text[end:]
          write(path, text)

          # tests: use direct targeted substitutions
          path = 'test/category-taxonomy-v2.test.ts'
          text = read(path)
          text = one(text, '      "cd_sacd_player",\n      "dap",', '      "cd_sacd_player",\n      "cd_sacd_transport",\n      "dap",', 'test digital list')
          text = one(text,
              '  assert.deepEqual(\n    children("speaker").map((category) => category.id),',
              '  assert.deepEqual(\n    children("analog").map((category) => category.id),\n    ["turntable", "tonearm", "cartridge", "phono_eq", "phono_step_up_transformer"],\n  );\n  assert.deepEqual(\n    children("speaker").map((category) => category.id),',
              'test analog list')
          text = one(text,
              '  assert.deepEqual(\n    children("accessories").map((category) => category.id),\n    ["cable", "rack", "power_accessory", "vacuum_tube", "other_accessory"],\n  );',
              '  assert.deepEqual(\n    children("headphone_group").map((category) => category.id),\n    ["wired_headphone", "wired_earphone", "btw_headphone", "btw_earphone"],\n  );\n  assert.deepEqual(\n    children("accessories").map((category) => category.id),\n    ["cable", "rack", "power_strip", "clean_power", "vacuum_tube", "other_accessory"],\n  );',
              'test accessory list')
          text = one(text, '  assert.equal(categoryIdForFilter("speaker_other"), "speaker");', '  assert.equal(categoryIdForFilter("speaker_other"), "speaker");\n  assert.equal(categoryIdForFilter("headphone"), "wired_headphone");\n  assert.equal(categoryIdForFilter("earphone"), "wired_earphone");\n  assert.equal(categoryIdForFilter("power_accessory"), "clean_power");', 'legacy tests')
          start = text.index('test("transports are classified as their player family"')
          end = text.index('\n\ntest("digital network infrastructure', start)
          text = text[:start] + '''test("CD/SACD transports are independent from players while network transport stays a network player", () => {
            assert.equal(classify("Network Transport N1").primaryCategoryId, "network_player");
            assert.equal(classify("CD Transport D1").primaryCategoryId, "cd_sacd_transport");
            assert.equal(classify("SACD Player D2").primaryCategoryId, "cd_sacd_player");
          });''' + text[end:]
          start = text.index('test("accessory precedence prevents target component words from stealing classification"')
          text = text[:start] + '''test("headphone, phono and power refinements classify into their dedicated leaves", () => {
            assert.equal(classify("有線ヘッドホン MDR-1").primaryCategoryId, "wired_headphone");
            assert.equal(classify("有線イヤホン IER-1").primaryCategoryId, "wired_earphone");
            assert.equal(classify("Bluetooth ワイヤレスヘッドホン WH-1").primaryCategoryId, "btw_headphone");
            assert.equal(classify("完全ワイヤレスイヤホン WF-1").primaryCategoryId, "btw_earphone");
            assert.equal(classify("MC昇圧トランス T-1").primaryCategoryId, "phono_step_up_transformer");
            assert.equal(classify("フォノイコライザー EQ-1").primaryCategoryId, "phono_eq");
            assert.equal(classify("電源タップ 6口").primaryCategoryId, "power_strip");
            assert.equal(classify("クリーン電源 Power Conditioner P-1").primaryCategoryId, "clean_power");
            assert.equal(classify("インシュレーター 4個").primaryCategoryId, "other_accessory");
          });\n'''
          write(path, text)

          path = 'test/meta-category-hierarchy.test.ts'
          text = read(path)
          text = one(text, 'ids.slice(accessoriesIndex, accessoriesIndex + 14)', 'ids.slice(accessoriesIndex, accessoriesIndex + 15)', 'meta slice')
          text = one(text, '    "rack",\n    "power_accessory",\n    "vacuum_tube",', '    "rack",\n    "power_strip",\n    "clean_power",\n    "vacuum_tube",', 'meta power list')
          write(path, text)

          path = 'test/frontend-category-options.test.ts'
          text = read(path)
          text = one(text, 'assert.equal((markup.match(/data-category-separator="true"/g) || []).length, 2);', 'assert.equal((markup.match(/data-category-separator="true"/g) || []).length, 4);', 'separator count')
          old = '/<option value="dac">　DAC<\\/option><option value="dj_dtm">DJ機器・DTM<\\/option>$/u,'
          new = '/<option value="dac">　DAC<\\/option><option disabled data-category-separator="true">────────────<\\/option><option value="dj_dtm">DJ機器・DTM<\\/option><option disabled data-category-separator="true">────────────<\\/option>$/u,'
          text = one(text, old, new, 'separator shape')
          write(path, text)

          path = 'e2e/tests/category-taxonomy.spec.ts'
          text = read(path)
          text = one(text, '    "cd_sacd_player",\n    "dap",', '    "cd_sacd_player",\n    "cd_sacd_transport",\n    "dap",', 'e2e transport')
          text = one(text, '    "phono_eq",\n    "speaker",', '    "phono_eq",\n    "phono_step_up_transformer",\n    "speaker",', 'e2e step-up')
          text = one(text, '    "headphone_group",\n    "headphone",\n    "earphone",\n    "accessories",', '    "headphone_group",\n    "wired_headphone",\n    "wired_earphone",\n    "btw_headphone",\n    "btw_earphone",\n    "accessories",', 'e2e headphones')
          text = one(text, '    "rack",\n    "power_accessory",\n    "vacuum_tube",', '    "rack",\n    "power_strip",\n    "clean_power",\n    "vacuum_tube",', 'e2e power')
          write(path, text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npm run format
      - name: Validate
        run: npm run check
      - name: Commit implementation and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/tmp-category-taxonomy-patch.yml
          rm .github/workflows/tmp-category-taxonomy-pr-trigger.yml
          rm .github/workflows/tmp-category-taxonomy-pr-trigger-v2.yml
          rm .github/workflows/tmp-category-taxonomy-pr-trigger-v3.yml
          rm .github/workflows/tmp-category-taxonomy-pr-trigger-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine audio category taxonomy"
          git push origin HEAD:feat/refine-audio-category-taxonomy
