name: Phase 2.5 Workspace Snapshot

on:
  push:
    branches:
      - feat/phase-2-5-typescript-complete-migration

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package validated workspace
        run: tar --exclude=.git --exclude=phase-2-5-workspace.tar.gz -czf phase-2-5-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: phase-2-5-workspace
          path: phase-2-5-workspace.tar.gz
          retention-days: 1
