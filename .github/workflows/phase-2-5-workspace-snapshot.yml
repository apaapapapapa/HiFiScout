name: Phase 2.5 Workspace Snapshot

on:
  push:
    branches:
      - feat/phase-2-5-typescript-complete-migration

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: tar -czf phase-2-5-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: phase-2-5-dependencies
          path: phase-2-5-node-modules.tar.gz
          retention-days: 1
