name: Apply date-safe export test fix

on:
  push:
    branches: [chore/retry-main-validation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chore/retry-main-validation
      - name: Remove date bombs from export tests
        shell: python
        run: |
          from pathlib import Path

          catalog = Path('test/knowledge-catalog-export-core.test.ts')
          text = catalog.read_text()
          old = 'const NOW = "2026-08-22T00:00:00.000Z";'
          assert old in text
          text = text.replace(old, 'const NOW = new Date().toISOString();', 1)
          old_regex = '/hifiscout-knowledge-catalog-2026-08-22\\.csv/u,'
          assert old_regex in text
          text = text.replace(
              old_regex,
              'new RegExp(`hifiscout-knowledge-catalog-${NOW.slice(0, 10)}\\\\.csv`, "u"),',
              1,
          )
          catalog.write_text(text)

          audit = Path('test/product-audit-export-job.test.ts')
          text = audit.read_text()
          old_date = 'new Date("2026-08-22T00:00:00.000Z")'
          assert text.count(old_date) >= 5
          text = text.replace(old_date, 'new Date()')
          audit.write_text(text)

          Path('.github/workflows/apply-date-safe-export-tests.yml').unlink()
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/knowledge-catalog-export-core.test.ts test/product-audit-export-job.test.ts .github/workflows/apply-date-safe-export-tests.yml
          git commit -m "test: make export job clocks date-independent"
          git push origin HEAD:chore/retry-main-validation
