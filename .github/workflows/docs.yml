name: Developer Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Validate module dependencies
        run: npm run docs:architecture:check
      - name: Build developer documentation
        run: npm run docs:build
        env:
          DOCS_BASE: "${{ steps.pages.outputs.base_path }}/"
      - name: Validate generated report links
        env:
          DOCS_BASE: "${{ steps.pages.outputs.base_path }}/"
        run: |
          test -f docs/.vitepress/dist/db/index.html
          test -f docs/.vitepress/dist/generated/dependencies.html
          grep -F "href=\"${DOCS_BASE}db/index.html\"" docs/.vitepress/dist/database/index.html
          grep -F 'target="_self"' docs/.vitepress/dist/database/index.html
          grep -F "href=\"${DOCS_BASE}generated/dependencies.html\"" docs/.vitepress/dist/architecture/dependencies.html
          grep -F 'target="_self"' docs/.vitepress/dist/architecture/dependencies.html
      - name: Upload developer documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-docs
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 14
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
