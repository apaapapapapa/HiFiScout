name: CI No Barrier Benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-no-barrier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: nb-static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
        with:
          cache-write: "true"
      - name: Verify canonical Vite+ migration state
        shell: bash
        run: |
          set -euo pipefail
          vp migrate --no-interactive
          vp env pin 22 --target dev-engines
          git diff --exit-code
      - name: Reject legacy project toolchain entrypoints
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'uses:[[:space:]]+actions/setup-node@|run:[[:space:]]+(npm|npx)([[:space:]]|$)|^[[:space:]]+(npm|npx)[[:space:]]' .github/workflows; then
            echo 'A workflow bypasses Vite+ runtime/tool resolution.' >&2
            exit 1
          fi
          if grep -RInE '^[[:space:]]*(npm|npx)[[:space:]]' README.md AGENTS.md docs; then
            echo 'Documentation contains a standalone npm/npx command; document the Vite+ entrypoint instead.' >&2
            exit 1
          fi
      - run: vp run ci:lint
      - run: vp run ci:format-check
      - run: vp run ci:no-js-source

  typecheck:
    name: nb-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
        with:
          task-cache: "true"
          task-cache-scope: typecheck
      - run: vp run ci:typecheck

  unit-test:
    name: nb-unit-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - run: vp run ci:test-shard-${{ matrix.shard }}

  integration:
    name: nb-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - run: vp run db:migrate:local
      - name: Verify listing admin overrides survive crawler writes
        run: vp exec tsx scripts/verify-listing-admin-overrides.ts
      - name: Verify D1 FTS search migration
        run: vp exec tsx scripts/verify-search-integration.ts

  build:
    name: nb-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
        with:
          task-cache: "true"
          task-cache-scope: build
      - run: vp run ci:build

  dependency-security:
    name: nb-dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-deps
      - name: Verify npm registry signatures and provenance
        run: vp env exec npm audit signatures
      - name: Fail on high or critical dependency vulnerabilities
        run: vp env exec npm audit --audit-level=high

  fan-out:
    name: fan-out
    needs:
      - static-checks
      - typecheck
      - unit-test
      - integration
      - build
      - dependency-security
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify no-barrier fan-out
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static-checks.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit-test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-security.result }}
        run: |
          set -euo pipefail
          for result in \
            "${STATIC_RESULT}" \
            "${TYPECHECK_RESULT}" \
            "${UNIT_RESULT}" \
            "${INTEGRATION_RESULT}" \
            "${BUILD_RESULT}" \
            "${DEPENDENCY_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Required CI job finished with result: ${result}" >&2
              exit 1
            fi
          done
