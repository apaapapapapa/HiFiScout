name: autofix.ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  oxfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply oxfmt
        run: npm run format
      # The workflow token intentionally stays read-only. The autofix.ci GitHub
      # App applies the generated patch to the PR branch with scoped privileges.
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
