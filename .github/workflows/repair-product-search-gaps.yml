name: Repair Product Search Projection Gaps

on:
  workflow_run:
    workflows: ["Deploy Cloudflare"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: production-product-search-gap-repair
  cancel-in-progress: false

jobs:
  repair-and-rerun:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve inherited production D1 binding
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          info="$(npx wrangler d1 info DB --json)"
          id="$(jq -r '.uuid // .database_id // .id // empty' <<< "$info")"
          if [[ -z "$id" ]]; then
            echo 'Could not resolve the deployed DB binding to an explicit D1 id.' >&2
            jq . <<< "$info" >&2
            exit 1
          fi
          echo "database_id=$id" >> "$GITHUB_OUTPUT"

      - name: Repair active listing Product Search projection gaps
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          # Only a real projection gap is allowed to trigger an automatic deploy rerun.
          # Unrelated deploy failures stop here instead of entering a rerun loop.
          npx tsx scripts/repair-product-search-gaps.ts \
            --batch-size 20 \
            --max-listings 100 \
            --require-repair

      - name: Re-run failed Cloudflare deployment jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "Projection gaps repaired; rerunning failed jobs in Deploy Cloudflare run ${FAILED_DEPLOY_RUN_ID}."
          gh run rerun "$FAILED_DEPLOY_RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
