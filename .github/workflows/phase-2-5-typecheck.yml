name: Phase 2.5 Typecheck

on:
  push:
    branches:
      - feat/phase-2-5-typescript-complete-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run strict typecheck
        shell: bash
        run: |
          echo "::remove-matcher owner=tsc::"
          set +e
          output="$(npm run typecheck 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then
            escaped="${output//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error title=Full TypeScript diagnostics::$escaped"
          fi
          exit "$status"
