name: Agent speaker legacy compatibility fix

on:
  push:
    branches:
      - feat/expand-speaker-avamp-categories

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compatibility fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/catalog/categories.ts")
          text = p.read_text()
          old = '  network_transport: "network_player",\n  accessory: "other_accessory",\n});'
          new = '  network_transport: "network_player",\n  accessory: "other_accessory",\n  speaker_other: "other",\n});'
          if text.count(old) != 1:
              raise SystemExit("legacy alias anchor mismatch")
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npx oxfmt src/catalog/categories.ts
          npm run check
          npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/agent-speaker-legacy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalog/categories.ts .github/workflows/agent-speaker-legacy-fix.yml
          git commit -m "fix: preserve legacy speaker category inputs"
          git push origin HEAD:feat/expand-speaker-avamp-categories
