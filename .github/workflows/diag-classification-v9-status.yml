name: Diagnose classification v9 status

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.head_ref == 'ops/diag-classification-v9-status'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recent replay workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/${{ github.repository }}/actions/workflows/resolver-replay-drain.yml/runs?branch=main&per_page=20' \
            --jq '.workflow_runs[] | [.id,.run_number,.status,(.conclusion // "-"),.created_at,.updated_at,.head_sha] | @tsv'
      - name: Snapshot classification v9 backlog twice
        shell: bash
        run: |
          set -euo pipefail
          query() {
            npx wrangler d1 execute DB --remote --json --command "
              SELECT
                COUNT(*) AS active_listings,
                SUM(CASE WHEN COALESCE(CAST(json_extract(metadata_json, '$.categoryClassification.version') AS INTEGER), 0) < 9 THEN 1 ELSE 0 END) AS stale_v9,
                SUM(CASE WHEN COALESCE(CAST(json_extract(metadata_json, '$.categoryClassification.version') AS INTEGER), 0) = 9 THEN 1 ELSE 0 END) AS at_v9,
                MIN(COALESCE(CAST(json_extract(metadata_json, '$.categoryClassification.version') AS INTEGER), 0)) AS min_version,
                MAX(COALESCE(CAST(json_extract(metadata_json, '$.categoryClassification.version') AS INTEGER), 0)) AS max_version
              FROM products
              WHERE is_active = 1;"
          }
          echo '=== SNAPSHOT_1 ==='
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          query
          sleep 60
          echo '=== SNAPSHOT_2 ==='
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          query
      - name: Queue status
        run: |
          npx wrangler d1 execute DB --remote --json --command "
            SELECT status, COUNT(*) AS count
            FROM data_quality_remediation_queue
            GROUP BY status
            ORDER BY status;"
