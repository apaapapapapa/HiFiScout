name: Vite+ lockfile synchronization

on:
  push:
    branches: [refactor/migrate-to-vite-plus]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          version: "0.2.9"
          node-version: "22"
          run-install: false
          cache: false

      - name: Synchronize lockfile
        run: vp install

      - name: Verify bundled Vitest resolution
        run: |
          test "$(vp toolchain vitest)" = "4.1.10"
          npm ls vitest

      - name: Commit synchronized lockfile
        run: |
          rm .github/workflows/vitest-migration-bootstrap.yml
          git add package-lock.json .github/workflows/vitest-migration-bootstrap.yml
          git commit -m "chore: synchronize Vite+ lockfile"
          git push origin HEAD:refactor/migrate-to-vite-plus
