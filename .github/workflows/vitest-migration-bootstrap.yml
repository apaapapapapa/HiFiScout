name: Vite+ migration validation

on:
  push:
    branches: [refactor/migrate-to-vite-plus]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          version: "0.2.9"
          node-version: "22"
          run-install: false
          cache: false

      - name: Synchronize dependencies
        run: vp install

      - name: Show resolved toolchain
        run: vp toolchain

      - name: Format migration changes
        run: vp fmt vite.config.ts test/admin-frontend-split.test.ts test/react-migration.test.ts

      - name: Run repository checks
        run: vp run check

      - name: Build all application artifacts
        run: vp run build

      - name: Verify dependency security gates
        run: |
          npm audit signatures
          npm audit --audit-level=high

      - name: Commit validated migration
        run: |
          rm .github/workflows/vitest-migration-bootstrap.yml
          git add -A
          git status --short
          git commit -m "chore: finalize Vite+ migration"
          git push origin HEAD:refactor/migrate-to-vite-plus
