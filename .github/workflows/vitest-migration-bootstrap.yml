name: Vite+ migration bootstrap

on:
  push:
    branches: [refactor/migrate-to-vite-plus]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          version: "0.2.9"
          node-version: "22"
          run-install: false
          cache: false

      - name: Upgrade Vite prerequisite
        run: |
          npm pkg set overrides.vite=8.2.2
          npm install --package-lock-only --ignore-scripts
          git add package.json package-lock.json
          git commit -m "chore: upgrade Vite prerequisite"
          npm ci

      - name: Run official Vite+ migration
        run: vp migrate --no-interactive --no-agent --no-editor --no-hooks

      - name: Synchronize dependencies
        run: vp install

      - name: Commit generated migration
        run: |
          rm .github/workflows/vitest-migration-bootstrap.yml
          git add -A
          git commit -m "refactor: migrate toolchain to Vite+"
          git push origin HEAD:refactor/migrate-to-vite-plus
