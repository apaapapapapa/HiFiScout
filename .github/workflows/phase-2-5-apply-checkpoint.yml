name: Phase 2.5 Apply Typecheck Checkpoint

on:
  push:
    branches:
      - feat/phase-2-5-typescript-complete-migration
    paths:
      - 'scripts/phase-2-5-apply-checkpoint.sh'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Apply checkpoint patch
        run: bash scripts/phase-2-5-apply-checkpoint.sh
      - name: Install dependencies
        run: npm ci
      - name: Verify strict TypeScript
        run: npm run typecheck
      - name: Commit checkpoint and remove temporary applier
        shell: bash
        run: |
          rm -f scripts/phase-2-5-apply-checkpoint.sh
          rm -f .github/workflows/phase-2-5-apply-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No checkpoint changes to commit.'
            exit 1
          fi
          git commit -m 'fix(types): complete strict TypeScript migration'
          git push origin HEAD:feat/phase-2-5-typescript-complete-migration
