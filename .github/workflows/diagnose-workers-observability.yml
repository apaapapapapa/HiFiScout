name: Diagnose Workers Observability

on:
  push:
    branches:
      - diagnostics/workers-observability-20260828-0916

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Query Workers Observability telemetry
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error title=Missing Cloudflare token::CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from typing import Any

          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          API_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          FROM_MS = 1787908560000  # 2026-08-28T09:16:00Z
          TO_MS = 1787911200000    # 2026-08-28T10:00:00Z
          BASE_URL = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{ACCOUNT_ID}/workers/observability/telemetry"
          )


          def abort(message: str) -> None:
              print(f"::error title=Workers Observability query failed::{message}")
              raise SystemExit(1)


          def post(endpoint: str, payload: dict[str, Any]) -> Any:
              request = urllib.request.Request(
                  f"{BASE_URL}/{endpoint}",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {API_TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "HiFiScout-observability-diagnostic/1.0",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = json.load(response)
              except urllib.error.HTTPError as error:
                  raw = error.read().decode(errors="replace")
                  try:
                      parsed = json.loads(raw)
                      details = "; ".join(
                          item.get("message", str(item))
                          for item in parsed.get("errors", [])
                      ) or f"HTTP {error.code}"
                  except json.JSONDecodeError:
                      details = f"HTTP {error.code}"
                  if error.code in (401, 403):
                      abort(
                          f"Cloudflare rejected the token ({details}). "
                          "The token needs Workers Observability Write permission."
                      )
                  abort(f"Cloudflare returned {details} for {endpoint}.")
              except urllib.error.URLError as error:
                  abort(f"Network error while calling {endpoint}: {error.reason}")

              if not body.get("success"):
                  details = "; ".join(
                      item.get("message", str(item))
                      for item in body.get("errors", [])
                  ) or "unknown Cloudflare API error"
                  abort(f"Cloudflare returned {details} for {endpoint}.")
              return body.get("result")


          def iso(timestamp_ms: int | float | None) -> str:
              if timestamp_ms is None:
                  return "unknown"
              return dt.datetime.fromtimestamp(
                  float(timestamp_ms) / 1000, tz=dt.timezone.utc
              ).isoformat(timespec="milliseconds").replace("+00:00", "Z")


          def metadata(event: dict[str, Any]) -> dict[str, Any]:
              value = event.get("$metadata")
              return value if isinstance(value, dict) else {}


          def workers(event: dict[str, Any]) -> dict[str, Any]:
              value = event.get("$workers")
              return value if isinstance(value, dict) else {}


          def request_id(event: dict[str, Any], fallback: str = "") -> str:
              worker_id = workers(event).get("requestId")
              metadata_id = metadata(event).get("requestId")
              return str(worker_id or metadata_id or fallback)


          def is_queue_event(event: dict[str, Any]) -> bool:
              worker_type = str(workers(event).get("eventType", "")).lower()
              event_metadata = metadata(event)
              origin = str(event_metadata.get("origin", "")).lower()
              trigger = str(event_metadata.get("trigger", "")).lower()
              return worker_type == "queue" or origin == "queue" or "queue" in trigger


          def contains_d1_error(event: dict[str, Any]) -> bool:
              return "D1_ERROR" in json.dumps(event, ensure_ascii=False).upper()


          keys = post(
              "keys",
              {
                  "datasets": [],
                  "from": FROM_MS,
                  "to": TO_MS,
                  "limit": 2000,
              },
          )
          key_types = {
              item["key"]: item["type"]
              for item in keys
              if isinstance(item, dict) and "key" in item and "type" in item
          }

          relevant_keys = sorted(
              key
              for key in key_types
              if any(
                  needle in key.lower()
                  for needle in (
                      "service",
                      "scriptname",
                      "eventtype",
                      "origin",
                      "trigger",
                      "outcome",
                      "cputime",
                      "requestid",
                      "error",
                  )
              )
          )
          print("discovered_relevant_keys=" + ",".join(relevant_keys))

          service_key = next(
              (
                  key
                  for key in ("$metadata.service", "$workers.scriptName")
                  if key in key_types
              ),
              None,
          )
          queue_key = next(
              (
                  key
                  for key in ("$workers.eventType", "$metadata.origin")
                  if key in key_types
              ),
              None,
          )
          if service_key is None:
              abort("Neither $metadata.service nor $workers.scriptName was discoverable.")

          def leaf(key: str, value: str) -> dict[str, Any]:
              return {
                  "key": key,
                  "operation": "eq",
                  "type": key_types.get(key, "string"),
                  "value": value,
              }

          service_filter = leaf(service_key, "hifiscout")
          filters = [service_filter]
          if queue_key is not None:
              filters.append(leaf(queue_key, "queue"))

          def invocation_query(query_filters: list[dict[str, Any]]) -> dict[str, Any]:
              result = post(
                  "query",
                  {
                      "queryId": "hifiscout-queue-diagnostic-20260828",
                      "timeframe": {"from": FROM_MS, "to": TO_MS},
                      "dry": True,
                      "limit": 2000,
                      "view": "invocations",
                      "parameters": {
                          "datasets": [],
                          "filterCombination": "and",
                          "filters": query_filters,
                      },
                  },
              )
              return result if isinstance(result, dict) else {}

          invocation_result = invocation_query(filters)
          invocation_groups = invocation_result.get("invocations") or {}
          if not invocation_groups and queue_key is not None:
              print(
                  "queue_filter_returned_no_rows=true; "
                  "retrying_with_service_filter_only=true"
              )
              invocation_result = invocation_query([service_filter])
              invocation_groups = invocation_result.get("invocations") or {}

          d1_result = post(
              "query",
              {
                  "queryId": "hifiscout-d1-error-diagnostic-20260828",
                  "timeframe": {"from": FROM_MS, "to": TO_MS},
                  "dry": True,
                  "limit": 2000,
                  "view": "events",
                  "parameters": {
                      "datasets": [],
                      "filterCombination": "and",
                      "filters": [service_filter],
                      "needle": {
                          "value": "D1_ERROR",
                          "isRegex": False,
                          "matchCase": False,
                      },
                  },
              },
          )
          d1_container = d1_result.get("events") if isinstance(d1_result, dict) else {}
          d1_events = (
              d1_container.get("events", [])
              if isinstance(d1_container, dict)
              else []
          )
          d1_events = [event for event in d1_events if isinstance(event, dict)]
          d1_by_request = {request_id(event) for event in d1_events if request_id(event)}
          d1_timestamps = [
              int(event["timestamp"])
              for event in d1_events
              if isinstance(event.get("timestamp"), (int, float))
          ]

          summaries: list[dict[str, Any]] = []
          if isinstance(invocation_groups, dict):
              groups = invocation_groups.items()
          else:
              groups = []

          for group_id, raw_events in groups:
              if not isinstance(raw_events, list):
                  continue
              events = [event for event in raw_events if isinstance(event, dict)]
              if not events or not any(is_queue_event(event) for event in events):
                  continue
              queue_events = [event for event in events if is_queue_event(event)]
              terminal_events = [
                  event
                  for event in queue_events
                  if workers(event).get("outcome") is not None
                  or workers(event).get("cpuTimeMs") is not None
              ]
              timestamp_events = terminal_events or queue_events or events
              timestamps = [
                  int(event["timestamp"])
                  for event in timestamp_events
                  if isinstance(event.get("timestamp"), (int, float))
              ]
              observed_at = max(timestamps) if timestamps else None
              invocation_id = next(
                  (request_id(event) for event in events if request_id(event)),
                  str(group_id),
              )
              outcomes = sorted(
                  {
                      str(workers(event)["outcome"])
                      for event in events
                      if workers(event).get("outcome") is not None
                  }
              )
              cpu_times = [
                  float(workers(event)["cpuTimeMs"])
                  for event in events
                  if isinstance(workers(event).get("cpuTimeMs"), (int, float))
              ]
              nearby_d1 = bool(
                  observed_at is not None
                  and any(abs(observed_at - timestamp) <= 5000 for timestamp in d1_timestamps)
              )
              summaries.append(
                  {
                      "timestamp": observed_at,
                      "request_id": invocation_id,
                      "outcome": ",".join(outcomes) if outcomes else "missing",
                      "cpu_time_ms": max(cpu_times) if cpu_times else None,
                      "d1_same_invocation": (
                          invocation_id in d1_by_request
                          or any(contains_d1_error(event) for event in events)
                      ),
                      "d1_within_5s": nearby_d1,
                  }
              )

          summaries.sort(key=lambda item: item["timestamp"] or 0)
          print("=== WORKERS_OBSERVABILITY_DIAGNOSTIC ===")
          print("timeframe_utc=2026-08-28T09:16:00Z/2026-08-28T10:00:00Z")
          print(f"service_filter_key={service_key}")
          print(f"queue_filter_key={queue_key or 'client-side-only'}")
          print(f"queue_invocation_count={len(summaries)}")
          print(
              "timestamp_utc | request_id | outcome | cpuTimeMs | "
              "D1_ERROR_same_invocation | D1_ERROR_within_5s"
          )
          for summary in summaries:
              cpu_value = summary["cpu_time_ms"]
              cpu_text = "missing" if cpu_value is None else f"{cpu_value:g}"
              print(
                  f"{iso(summary['timestamp'])} | {summary['request_id']} | "
                  f"{summary['outcome']} | {cpu_text} | "
                  f"{str(summary['d1_same_invocation']).lower()} | "
                  f"{str(summary['d1_within_5s']).lower()}"
              )

          print(f"d1_error_event_count={len(d1_events)}")
          for event in sorted(d1_events, key=lambda item: item.get("timestamp", 0)):
              print(
                  "d1_error_event="
                  f"{iso(event.get('timestamp'))} "
                  f"request_id={request_id(event) or 'missing'}"
              )

          if not summaries:
              print(
                  "::warning title=No queue invocations found::"
                  "No hifiscout queue invocation was retained for the requested timeframe."
              )
          PY
