name: Deep Workers Incident Diagnostic

on:
  push:
    branches:
      - diagnostics/workers-observability-20260828-0916

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9af87af4dbc00be3bfd4c8af3f52f684
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read deployed settings and correlate telemetry
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error title=Missing Cloudflare token::CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

          python3 - <<'PY'
          from __future__ import annotations

          import collections
          import datetime as dt
          import json
          import math
          import os
          import re
          import statistics
          import urllib.error
          import urllib.parse
          import urllib.request
          from typing import Any, Iterable

          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          API_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          SCRIPT = "hifiscout"
          TARGET_VERSION = "9baf0a6d-6722-42f5-821f-1c045f50a577"
          INCIDENT_FROM = 1787908500000  # 2026-08-28T09:15:00Z
          INCIDENT_TO = 1787911200000    # 2026-08-28T10:00:00Z
          HISTORY_FROM = 1787788800000   # 2026-08-27T00:00:00Z
          HISTORY_TO = 1787976000000     # 2026-08-29T04:00:00Z
          FAILURE_IDS = {
              "75fcaf4b64b8597745992c582799bf88",
              "1746d7107e5805d416f9bf1f1df67e1b",
          }
          API_ROOT = f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT_ID}"
          TELEMETRY_ROOT = f"{API_ROOT}/workers/observability/telemetry"


          def iso(timestamp_ms: int | float | None) -> str:
              if timestamp_ms is None:
                  return "missing"
              return (
                  dt.datetime.fromtimestamp(float(timestamp_ms) / 1000, tz=dt.timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              )


          def api_call(
              method: str,
              url: str,
              payload: dict[str, Any] | None = None,
              *,
              label: str,
          ) -> Any | None:
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  url,
                  data=body,
                  headers={
                      "Authorization": f"Bearer {API_TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "HiFiScout-deep-incident-diagnostic/1.0",
                  },
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      parsed = json.load(response)
              except urllib.error.HTTPError as error:
                  raw = error.read().decode(errors="replace")
                  try:
                      parsed_error = json.loads(raw)
                      detail = "; ".join(
                          str(item.get("message", "Cloudflare API error"))
                          for item in parsed_error.get("errors", [])[:3]
                          if isinstance(item, dict)
                      )
                  except json.JSONDecodeError:
                      detail = "Cloudflare API error"
                  print(f"api_check={label} status=HTTP_{error.code} detail={detail[:240]}")
                  return None
              except urllib.error.URLError as error:
                  print(f"api_check={label} status=network_error detail={str(error.reason)[:160]}")
                  return None
              if not isinstance(parsed, dict) or not parsed.get("success"):
                  errors = parsed.get("errors", []) if isinstance(parsed, dict) else []
                  detail = "; ".join(
                      str(item.get("message", "Cloudflare API error"))
                      for item in errors[:3]
                      if isinstance(item, dict)
                  )
                  print(f"api_check={label} status=failed detail={detail[:240]}")
                  return None
              print(f"api_check={label} status=success")
              return parsed.get("result")


          def get(path: str, *, label: str) -> Any | None:
              return api_call("GET", f"{API_ROOT}{path}", label=label)


          def telemetry(endpoint: str, payload: dict[str, Any], *, label: str) -> Any | None:
              return api_call(
                  "POST", f"{TELEMETRY_ROOT}/{endpoint}", payload, label=label
              )


          def compact(value: Any) -> str:
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))


          def dig(value: Any, *path: str) -> Any:
              current = value
              for key in path:
                  if not isinstance(current, dict):
                      return None
                  current = current.get(key)
              return current


          print("=== DEPLOYED_CONFIGURATION ===")
          settings = get(
              f"/workers/scripts/{SCRIPT}/settings", label="worker_script_settings"
          )
          if isinstance(settings, dict):
              print(f"script_settings_limits={compact(settings.get('limits'))}")
              print(f"script_settings_usage_model={compact(settings.get('usage_model'))}")
              print(f"script_settings_compatibility_date={compact(settings.get('compatibility_date'))}")
              print(f"script_settings_compatibility_flags={compact(settings.get('compatibility_flags'))}")
              print(f"script_settings_observability={compact(settings.get('observability'))}")
              print(f"script_settings_placement={compact(settings.get('placement'))}")

          account_settings = get("/workers/account-settings", label="worker_account_settings")
          if isinstance(account_settings, dict):
              safe_account = {
                  key: account_settings.get(key)
                  for key in (
                      "default_usage_model",
                      "usage_model",
                      "standard",
                      "green_compute",
                      "startup_limits",
                  )
                  if key in account_settings
              }
              print(f"worker_account_settings={compact(safe_account)}")

          deployments = get(
              f"/workers/scripts/{SCRIPT}/deployments", label="worker_deployments"
          )
          raw_deployments: list[Any]
          if isinstance(deployments, dict):
              raw_deployments = deployments.get("deployments", [])
          elif isinstance(deployments, list):
              raw_deployments = deployments
          else:
              raw_deployments = []
          for deployment in raw_deployments[:20]:
              if not isinstance(deployment, dict):
                  continue
              versions = []
              for item in deployment.get("versions", []) or []:
                  if isinstance(item, dict):
                      versions.append(
                          {
                              "version_id": item.get("version_id") or item.get("id"),
                              "percentage": item.get("percentage"),
                          }
                      )
              print(
                  "deployment="
                  + compact(
                      {
                          "id": deployment.get("id"),
                          "created_on": deployment.get("created_on"),
                          "source": deployment.get("source"),
                          "strategy": deployment.get("strategy"),
                          "versions": versions,
                      }
                  )
              )

          version = get(
              f"/workers/scripts/{SCRIPT}/versions/{TARGET_VERSION}",
              label="incident_worker_version",
          )
          if isinstance(version, dict):
              print(
                  "incident_version="
                  + compact(
                      {
                          "id": version.get("id") or version.get("version_id"),
                          "number": version.get("number"),
                          "created_on": version.get("created_on"),
                          "source": version.get("source"),
                          "annotations": version.get("annotations"),
                          "compatibility_date": dig(version, "resources", "script", "runtime", "compatibility_date")
                          or dig(version, "metadata", "compatibility_date"),
                          "limits": dig(version, "resources", "script", "settings", "limits")
                          or dig(version, "settings", "limits"),
                      }
                  )
              )

          queues = get("/queues?per_page=100", label="queue_list")
          queue_rows = queues if isinstance(queues, list) else []
          if isinstance(queues, dict):
              queue_rows = queues.get("queues", []) or queues.get("result", []) or []
          for queue in queue_rows:
              if not isinstance(queue, dict) or not str(queue.get("queue_name", queue.get("name", ""))).startswith("hifiscout-crawl"):
                  continue
              queue_id = queue.get("queue_id") or queue.get("id")
              queue_name = queue.get("queue_name") or queue.get("name")
              print(
                  "queue="
                  + compact(
                      {
                          "id": queue_id,
                          "name": queue_name,
                          "created_on": queue.get("created_on"),
                          "modified_on": queue.get("modified_on"),
                          "settings": queue.get("settings"),
                      }
                  )
              )
              if queue_id:
                  consumers = get(
                      f"/queues/{queue_id}/consumers", label=f"queue_consumers_{queue_name}"
                  )
                  consumer_rows = consumers if isinstance(consumers, list) else []
                  if isinstance(consumers, dict):
                      consumer_rows = consumers.get("consumers", []) or []
                  for consumer in consumer_rows:
                      if not isinstance(consumer, dict):
                          continue
                      print(
                          "queue_consumer="
                          + compact(
                              {
                                  "queue": queue_name,
                                  "consumer_id": consumer.get("consumer_id") or consumer.get("id"),
                                  "type": consumer.get("type"),
                                  "script": consumer.get("script_name") or consumer.get("script"),
                                  "settings": consumer.get("settings"),
                                  "dead_letter_queue": consumer.get("dead_letter_queue"),
                              }
                          )
                      )

          print("=== TELEMETRY_SCHEMA ===")
          keys = telemetry(
              "keys",
              {
                  "datasets": [],
                  "from": INCIDENT_FROM,
                  "to": INCIDENT_TO,
                  "limit": 5000,
              },
              label="telemetry_keys",
          )
          key_types = {
              item["key"]: item["type"]
              for item in (keys or [])
              if isinstance(item, dict) and "key" in item and "type" in item
          }
          relevant_keys = sorted(
              key
              for key in key_types
              if any(
                  needle in key.lower()
                  for needle in (
                      "service",
                      "script",
                      "version",
                      "event",
                      "origin",
                      "trigger",
                      "queue",
                      "outcome",
                      "cpu",
                      "wall",
                      "duration",
                      "requestid",
                      "invocation",
                      "error",
                      "exception",
                      "batch",
                      "retry",
                      "attempt",
                      "colo",
                      "region",
                      "trace",
                      "span",
                  )
              )
          )
          print("relevant_telemetry_keys=" + ",".join(relevant_keys))
          service_key = next(
              (key for key in ("$metadata.service", "$workers.scriptName") if key in key_types),
              None,
          )
          event_type_key = next(
              (key for key in ("$workers.eventType", "$metadata.origin") if key in key_types),
              None,
          )
          outcome_key = "$workers.outcome" if "$workers.outcome" in key_types else None
          if service_key is None:
              raise SystemExit("Unable to discover the Worker service filter key")


          def leaf(key: str, value: str) -> dict[str, Any]:
              return {
                  "key": key,
                  "operation": "eq",
                  "type": key_types.get(key, "string"),
                  "value": value,
              }


          service_filter = leaf(service_key, SCRIPT)


          def query_invocations(
              from_ms: int,
              to_ms: int,
              filters: list[dict[str, Any]],
              *,
              label: str,
              limit: int = 5000,
          ) -> dict[str, list[dict[str, Any]]]:
              result = telemetry(
                  "query",
                  {
                      "queryId": label,
                      "timeframe": {"from": from_ms, "to": to_ms},
                      "dry": True,
                      "limit": limit,
                      "view": "invocations",
                      "parameters": {
                          "datasets": [],
                          "filterCombination": "and",
                          "filters": filters,
                      },
                  },
                  label=label,
              )
              groups = result.get("invocations") if isinstance(result, dict) else None
              if not isinstance(groups, dict):
                  return {}
              return {
                  str(group_id): [event for event in events if isinstance(event, dict)]
                  for group_id, events in groups.items()
                  if isinstance(events, list)
              }


          def metadata(event: dict[str, Any]) -> dict[str, Any]:
              value = event.get("$metadata")
              return value if isinstance(value, dict) else {}


          def workers(event: dict[str, Any]) -> dict[str, Any]:
              value = event.get("$workers")
              return value if isinstance(value, dict) else {}


          def request_id(events: Iterable[dict[str, Any]], fallback: str) -> str:
              for event in events:
                  value = workers(event).get("requestId") or metadata(event).get("requestId")
                  if value:
                      return str(value)
              return fallback


          def scalar_values(value: Any, key_predicate: Any) -> list[Any]:
              found: list[Any] = []

              def walk(current: Any, path: tuple[str, ...]) -> None:
                  if isinstance(current, dict):
                      for key, child in current.items():
                          child_path = (*path, str(key))
                          if key_predicate(child_path, child) and not isinstance(child, (dict, list)):
                              found.append(child)
                          walk(child, child_path)
                  elif isinstance(current, list):
                      for index, child in enumerate(current[:30]):
                          walk(child, (*path, str(index)))

              walk(value, ())
              return found


          def first_number(events: Iterable[dict[str, Any]], key_name: str) -> float | None:
              values = [
                  value
                  for event in events
                  for value in scalar_values(
                      event,
                      lambda path, _value: path and path[-1].lower() == key_name.lower(),
                  )
                  if isinstance(value, (int, float)) and not isinstance(value, bool)
              ]
              return max(map(float, values)) if values else None


          def group_summary(group_id: str, events: list[dict[str, Any]]) -> dict[str, Any]:
              timestamps = [
                  int(event["timestamp"])
                  for event in events
                  if isinstance(event.get("timestamp"), (int, float))
              ]
              outcomes = sorted(
                  {
                      str(workers(event).get("outcome"))
                      for event in events
                      if workers(event).get("outcome") is not None
                  }
              )
              event_types = sorted(
                  {
                      str(workers(event).get("eventType"))
                      for event in events
                      if workers(event).get("eventType") is not None
                  }
              )
              queue_values = scalar_values(
                  events,
                  lambda path, value: bool(path)
                  and (
                      path[-1].lower() in {"queue", "queuename", "queue_name"}
                      or "queue" in path[-1].lower()
                  )
                  and isinstance(value, (str, int)),
              )
              queue_names = sorted(
                  {
                      str(value)
                      for value in queue_values
                      if str(value).startswith("hifiscout-")
                  }
              )
              triggers = sorted(
                  {
                      str(metadata(event).get("trigger"))
                      for event in events
                      if metadata(event).get("trigger") is not None
                  }
              )
              origins = sorted(
                  {
                      str(metadata(event).get("origin"))
                      for event in events
                      if metadata(event).get("origin") is not None
                  }
              )
              versions = scalar_values(
                  events,
                  lambda path, value: bool(path)
                  and "version" in path[-1].lower()
                  and isinstance(value, (str, int)),
              )
              return {
                  "group_id": group_id,
                  "request_id": request_id(events, group_id),
                  "first_event_ms": min(timestamps) if timestamps else None,
                  "last_event_ms": max(timestamps) if timestamps else None,
                  "event_span_ms": (max(timestamps) - min(timestamps)) if timestamps else None,
                  "outcome": ",".join(outcomes) if outcomes else "missing",
                  "event_type": ",".join(event_types) if event_types else "missing",
                  "cpu_time_ms": first_number(events, "cpuTimeMs"),
                  "wall_time_ms": first_number(events, "wallTimeMs"),
                  "queue": ",".join(queue_names) if queue_names else "missing",
                  "trigger": ",".join(triggers) if triggers else "missing",
                  "origin": ",".join(origins) if origins else "missing",
                  "versions": sorted({str(value) for value in versions}),
                  "event_count": len(events),
              }


          incident_groups = query_invocations(
              INCIDENT_FROM,
              INCIDENT_TO,
              [service_filter],
              label="hifiscout_incident_all_invocations",
          )
          incident_summaries = [
              group_summary(group_id, events)
              for group_id, events in incident_groups.items()
          ]
          queue_summaries = [
              item
              for item in incident_summaries
              if "queue" in item["event_type"].lower()
              or item["origin"].lower() == "queue"
              or item["queue"] != "missing"
          ]
          queue_summaries.sort(key=lambda item: item["last_event_ms"] or 0)

          print("=== INCIDENT_QUEUE_INVOCATIONS ===")
          print(f"incident_queue_invocation_count={len(queue_summaries)}")
          print(
              "last_event_utc | first_event_utc | event_span_ms | request_id | queue | "
              "outcome | cpuTimeMs | wallTimeMs | trigger | origin | versions | event_count"
          )
          for item in queue_summaries:
              print(
                  f"{iso(item['last_event_ms'])} | {iso(item['first_event_ms'])} | "
                  f"{item['event_span_ms']} | {item['request_id']} | {item['queue']} | "
                  f"{item['outcome']} | {item['cpu_time_ms']} | {item['wall_time_ms']} | "
                  f"{item['trigger']} | {item['origin']} | {','.join(item['versions']) or 'missing'} | "
                  f"{item['event_count']}"
              )

          sensitive_key = re.compile(
              r"authorization|cookie|password|passwd|secret|token|api[_-]?key|credential",
              re.IGNORECASE,
          )
          sensitive_value = re.compile(
              r"(?i)(bearer\s+)[A-Za-z0-9._~+/=-]+|\beyJ[A-Za-z0-9._-]{20,}\b"
          )


          def safe_projection(value: Any, depth: int = 0) -> Any:
              if depth > 7:
                  return "<depth-limit>"
              if isinstance(value, dict):
                  result: dict[str, Any] = {}
                  for key, child in list(value.items())[:80]:
                      if sensitive_key.search(str(key)):
                          result[str(key)] = "<redacted>"
                      else:
                          result[str(key)] = safe_projection(child, depth + 1)
                  return result
              if isinstance(value, list):
                  return [safe_projection(item, depth + 1) for item in value[:30]]
              if isinstance(value, str):
                  redacted = sensitive_value.sub(r"\1<redacted>", value)
                  return redacted[:800] + ("…" if len(redacted) > 800 else "")
              return value


          print("=== FAILURE_INVOCATION_DETAILS ===")
          found_failure_ids: set[str] = set()
          for group_id, events in incident_groups.items():
              rid = request_id(events, group_id)
              if rid not in FAILURE_IDS:
                  continue
              found_failure_ids.add(rid)
              print(f"failure_request_id={rid} group_id={group_id} event_count={len(events)}")
              for index, event in enumerate(events):
                  print(
                      f"failure_event[{rid}][{index}]="
                      + compact(safe_projection(event))[:12000]
                  )
          print("missing_failure_request_ids=" + ",".join(sorted(FAILURE_IDS - found_failure_ids)))

          d1_result = telemetry(
              "query",
              {
                  "queryId": "hifiscout_incident_d1_errors_deep",
                  "timeframe": {"from": INCIDENT_FROM, "to": INCIDENT_TO},
                  "dry": True,
                  "limit": 5000,
                  "view": "events",
                  "parameters": {
                      "datasets": [],
                      "filterCombination": "and",
                      "filters": [service_filter],
                      "needle": {"value": "D1_ERROR", "isRegex": False, "matchCase": False},
                  },
              },
              label="incident_d1_error_events",
          )
          d1_container = d1_result.get("events") if isinstance(d1_result, dict) else None
          d1_events = d1_container.get("events", []) if isinstance(d1_container, dict) else []
          d1_request_ids = sorted(
              {
                  str(workers(event).get("requestId") or metadata(event).get("requestId"))
                  for event in d1_events
                  if isinstance(event, dict)
                  and (workers(event).get("requestId") or metadata(event).get("requestId"))
              }
          )
          print("d1_request_ids=" + ",".join(d1_request_ids))
          by_request = {item["request_id"]: item for item in incident_summaries}
          for rid in d1_request_ids:
              item = by_request.get(rid)
              print(f"d1_invocation_summary[{rid}]={compact(item) if item else 'not_found'}")

          print("=== QUEUE_HISTORY ===")
          history_filters = [service_filter]
          if event_type_key is not None:
              history_filters.append(leaf(event_type_key, "queue"))
          history_groups: dict[str, list[dict[str, Any]]] = {}
          chunk_ms = 4 * 60 * 60 * 1000
          chunk_start = HISTORY_FROM
          chunk_index = 0
          while chunk_start < HISTORY_TO:
              chunk_end = min(chunk_start + chunk_ms, HISTORY_TO)
              chunk = query_invocations(
                  chunk_start,
                  chunk_end,
                  history_filters,
                  label=f"hifiscout_queue_history_{chunk_index}",
              )
              history_groups.update(chunk)
              chunk_start = chunk_end
              chunk_index += 1

          history = [group_summary(group_id, events) for group_id, events in history_groups.items()]
          if event_type_key is None:
              history = [
                  item
                  for item in history
                  if "queue" in item["event_type"].lower()
                  or item["origin"].lower() == "queue"
                  or item["queue"] != "missing"
              ]
          history.sort(key=lambda item: item["last_event_ms"] or 0)
          outcomes = collections.Counter(item["outcome"] for item in history)
          print(f"history_queue_invocation_count={len(history)}")
          print(f"history_outcomes={compact(dict(sorted(outcomes.items())))}")
          cpu_values = sorted(
              float(item["cpu_time_ms"])
              for item in history
              if item["cpu_time_ms"] is not None
          )


          def percentile(values: list[float], p: float) -> float | None:
              if not values:
                  return None
              position = (len(values) - 1) * p
              lower = math.floor(position)
              upper = math.ceil(position)
              if lower == upper:
                  return values[lower]
              return values[lower] + (values[upper] - values[lower]) * (position - lower)


          print(
              "history_cpu_ms="
              + compact(
                  {
                      "min": min(cpu_values) if cpu_values else None,
                      "p50": percentile(cpu_values, 0.50),
                      "p95": percentile(cpu_values, 0.95),
                      "p99": percentile(cpu_values, 0.99),
                      "max": max(cpu_values) if cpu_values else None,
                  }
              )
          )
          for item in history:
              if item["outcome"] != "ok":
                  print(f"history_non_ok={compact({**item, 'last_event_utc': iso(item['last_event_ms'])})}")

          cpu_by_queue: dict[str, list[float]] = collections.defaultdict(list)
          for item in history:
              if item["cpu_time_ms"] is not None:
                  cpu_by_queue[item["queue"]].append(float(item["cpu_time_ms"]))
          for queue_name, values in sorted(cpu_by_queue.items()):
              values.sort()
              print(
                  "history_queue_cpu="
                  + compact(
                      {
                          "queue": queue_name,
                          "count": len(values),
                          "p50": percentile(values, 0.50),
                          "p95": percentile(values, 0.95),
                          "max": max(values),
                      }
                  )
              )

          if outcome_key is not None:
              cpu_fail_filters = [*history_filters, leaf(outcome_key, "exceededCpu")]
              direct_cpu_failures = query_invocations(
                  HISTORY_FROM,
                  HISTORY_TO,
                  cpu_fail_filters,
                  label="hifiscout_direct_exceeded_cpu_history",
                  limit=5000,
              )
              print(f"direct_exceeded_cpu_group_count={len(direct_cpu_failures)}")

          print("=== END_DEEP_DIAGNOSTIC ===")
          PY
