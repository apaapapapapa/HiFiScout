name: Phase 3 capability refactor

on:
  push:
    branches:
      - phase3/diagnostics-data-quality-capabilities

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase3/diagnostics-data-quality-capabilities
      - name: Apply capability refactor
        run: python3 .github/scripts/phase3_capability_refactor.py
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase3-capability-refactor.yml
          rm .github/scripts/phase3_capability_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(shops): isolate diagnostics and quality capabilities"
          git push origin HEAD:phase3/diagnostics-data-quality-capabilities
