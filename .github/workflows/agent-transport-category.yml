name: Agent transport category patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/transport-category-label'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show current transport references
        run: grep -RInE "network_transport|network transport|ネットワークトランスポート|cd_sacd_transport|CD/SACDトランスポート" src test e2e || true
      - name: Apply transport taxonomy patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          replace(
              'src/catalog/categories.ts',
              '''      "network player",\n      "network transport",\n      "network cd receiver",\n      "streamer",\n      "streaming player",\n      "streaming transport",\n      "ネットワークプレーヤー",\n      "ネットワークプレイヤー",\n      "ネットワークトランスポート",\n      "ネットワーク",''',
              '''      "network player",\n      "network cd receiver",\n      "streamer",\n      "streaming player",\n      "ネットワークプレーヤー",\n      "ネットワークプレイヤー",\n      "ネットワーク",''',
          )
          replace(
              'src/catalog/categories.ts',
              '''    id: "cd_sacd_transport",\n    name: "CD/SACDトランスポート",''',
              '''    // Historical id retained so existing URLs/data remain compatible; the category is now medium-agnostic.\n    id: "cd_sacd_transport",\n    name: "トランスポート",''',
          )
          replace(
              'src/catalog/categories.ts',
              '''      "disc transport",\n      "cdトランスポート",\n      "sacdトランスポート",\n      "cd/sacdトランスポート",\n      "トランスポート",''',
              '''      "disc transport",\n      "network transport",\n      "network audio transport",\n      "streaming transport",\n      "cdトランスポート",\n      "sacdトランスポート",\n      "cd/sacdトランスポート",\n      "ネットワークトランスポート",\n      "ネットワークオーディオトランスポート",\n      "ストリーミングトランスポート",\n      "トランスポート",''',
          )
          replace(
              'src/catalog/categories.ts',
              '  network_transport: "network_player",',
              '  network_transport: "cd_sacd_transport",',
          )

          replace(
              'src/catalog/category-rules.ts',
              '''  [\n    "network_player",\n    /network\\s+(?:audio\\s+)?(?:player|transport)|network\\s+cd\\s+receiver|streaming\\s+(?:player|transport)|ネットワーク(?:オーディオ)?(?:プレーヤー|プレイヤー|トランスポート)/i,\n  ],\n  [\n    "cd_sacd_transport",\n    /(?:sacd|cd)\\s*(?:\\/\\s*(?:sacd|cd))?\\s*(?:transport|トランスポート)|super\\s+audio\\s+cd\\s+transport|(?:cd|sacd)\\s*\\/\\s*(?:sacd|cd)\\s*トランスポート/i,\n  ],''',
              '''  [\n    "cd_sacd_transport",\n    /(?:network(?:\\s+audio)?|streaming)\\s+transport|ネットワーク(?:オーディオ)?トランスポート|ストリーミングトランスポート|(?:sacd|cd)\\s*(?:\\/\\s*(?:sacd|cd))?\\s*(?:transport|トランスポート)|super\\s+audio\\s+cd\\s+transport|(?:cd|sacd)\\s*\\/\\s*(?:sacd|cd)\\s*トランスポート/i,\n  ],\n  [\n    "network_player",\n    /network\\s+(?:audio\\s+)?player|network\\s+cd\\s+receiver|streaming\\s+player|ネットワーク(?:オーディオ)?(?:プレーヤー|プレイヤー)/i,\n  ],''',
          )
          replace(
              'src/catalog/product-normalizer.ts',
              'const CLASSIFICATION_METADATA_VERSION = 7;',
              'const CLASSIFICATION_METADATA_VERSION = 8;',
          )
          replace(
              'test/category-taxonomy-v2.test.ts',
              '  assert.equal(categoryIdForFilter("network_transport"), "network_player");',
              '  assert.equal(categoryIdForFilter("network_transport"), "cd_sacd_transport");',
          )
          replace(
              'test/category-taxonomy-v2.test.ts',
              '''test("CD/SACD transports are independent from players while network transport stays a network player", () => {\n  assert.equal(classify("Network Transport N1").primaryCategoryId, "network_player");\n  assert.equal(classify("CD Transport D1").primaryCategoryId, "cd_sacd_transport");\n  assert.equal(classify("SACD Player D2").primaryCategoryId, "cd_sacd_player");\n});''',
              '''test("disc and network transports share one transport category independent from players", () => {\n  assert.equal(classify("Network Transport N1").primaryCategoryId, "cd_sacd_transport");\n  assert.equal(classify("ネットワークトランスポート N2").primaryCategoryId, "cd_sacd_transport");\n  assert.equal(classify("Streaming Transport N3").primaryCategoryId, "cd_sacd_transport");\n  assert.equal(classify("CD Transport D1").primaryCategoryId, "cd_sacd_transport");\n  assert.equal(classify("SACD Player D2").primaryCategoryId, "cd_sacd_player");\n  assert.equal(classify("Network Player P1").primaryCategoryId, "network_player");\n  assert.equal(getCategory("cd_sacd_transport")?.name, "トランスポート");\n});''',
          )
          replace(
              'test/catalog-normalization.test.ts',
              '''  assert.deepEqual(normalizeCategory({ title: "Network Transport" }).categoryIds, [\n    "network_player",\n  ]);''',
              '''  assert.deepEqual(normalizeCategory({ title: "Network Transport" }).categoryIds, [\n    "cd_sacd_transport",\n  ]);''',
          )
          replace(
              'test/category-feature-query.test.ts',
              '''test("legacy network transport filter resolves to network player", async () => {\n  const db = captureDatabase();\n  await searchProducts(db, productQuery("?category=network_transport"));\n  assert.equal(db.calls[0].binds[0], "network_player");\n});''',
              '''test("legacy network transport filter resolves to transport", async () => {\n  const db = captureDatabase();\n  await searchProducts(db, productQuery("?category=network_transport"));\n  assert.equal(db.calls[0].binds[0], "cd_sacd_transport");\n});''',
          )
          replace(
              'e2e/tests/category-taxonomy.spec.ts',
              '''  expect(facets.find((category) => category.id === "pre_amp")).toMatchObject({\n    name: "　プリアンプ",\n    parentId: "amplifier",\n  });''',
              '''  expect(facets.find((category) => category.id === "pre_amp")).toMatchObject({\n    name: "　プリアンプ",\n    parentId: "amplifier",\n  });\n  expect(facets.find((category) => category.id === "cd_sacd_transport")).toMatchObject({\n    name: "　トランスポート",\n    parentId: "digital",\n  });''',
          )
          PY
      - run: npx oxfmt src/catalog/categories.ts src/catalog/category-rules.ts src/catalog/product-normalizer.ts test/category-taxonomy-v2.test.ts test/catalog-normalization.test.ts test/category-feature-query.test.ts e2e/tests/category-taxonomy.spec.ts
      - run: npm run check
      - run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/catalog/categories.ts src/catalog/category-rules.ts src/catalog/product-normalizer.ts test/category-taxonomy-v2.test.ts test/catalog-normalization.test.ts test/category-feature-query.test.ts e2e/tests/category-taxonomy.spec.ts
          git commit -m "fix: classify network transports as transports"
          git push origin HEAD:${{ github.head_ref }}
