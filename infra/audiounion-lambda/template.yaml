AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HiFiScout AudioUnion HTML relay in AWS Tokyo region

Parameters:
  RelayToken:
    Type: String
    NoEcho: true
    MinLength: 32
  RelayPermitSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  AudioUnionEntryUrl:
    Type: String
    Default: https://www.audiounion.jp/st/new_arrival_used.html
  CrawlerUserAgent:
    Type: String
    Default: HiFiScoutBot/0.1 (+https://github.com/apaapapapa/HiFiScout)
  MinimumRequestDelayMs:
    Type: Number
    Default: 10000
    MinValue: 0

Resources:
  AudioUnionFetcher:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hifiscout-audiounion-fetcher
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: .
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 30
      Environment:
        Variables:
          RELAY_TOKEN: !Ref RelayToken
          RELAY_PERMIT_SECRET: !Ref RelayPermitSecret
          AUDIOUNION_ENTRY_URL: !Ref AudioUnionEntryUrl
          CRAWLER_USER_AGENT: !Ref CrawlerUserAgent
          MIN_REQUEST_DELAY_MS: !Ref MinimumRequestDelayMs
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  FunctionUrl:
    Description: Configure this as the Cloudflare secret CRAWL_RELAY_URL
    Value: !GetAtt AudioUnionFetcherUrl.FunctionUrl
  FunctionName:
    Value: !Ref AudioUnionFetcher