<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">HiFiScout — 中古オーディオを、ショップをまたいで探す。</title>
  <desc id="desc">白と墨色を基調にしたHiFiScoutの紹介バナー。レコードとトーンアームのオリジナル線画に、探す・比べる・販売店で確認する、の3ステップを添えています。</desc>
  <rect width="1280" height="400" fill="#fcfaee"/>
  <g fill="#191817" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK JP', sans-serif">
    <text x="56" y="61" font-size="15" font-weight="600" letter-spacing="3">USED AUDIO SEARCH</text>
    <text x="51" y="163" font-size="88" font-weight="500" letter-spacing="-5">HiFiScout</text>
    <text x="56" y="226" font-size="29" font-weight="500">中古オーディオを、ショップをまたいで探す。</text>
    <text x="56" y="270" font-size="18" fill="#555555">次の一台との出会いを、ここから。</text>
  </g>
  <g fill="none" stroke="#191817">
    <rect x="847" y="51" width="364" height="242" rx="8" stroke-width="2"/>
    <circle cx="990" cy="172" r="103" fill="#191817"/>
    <g stroke="#9ea29f" stroke-width="1" opacity="0.7">
      <circle cx="990" cy="172" r="88"/>
      <circle cx="990" cy="172" r="79"/>
      <circle cx="990" cy="172" r="70"/>
      <circle cx="990" cy="172" r="61"/>
    </g>
    <circle cx="990" cy="172" r="36" fill="#fcfaee" stroke="none"/>
    <circle cx="990" cy="172" r="5" fill="#191817" stroke="none"/>
    <circle cx="1160" cy="91" r="13" fill="#fcfaee" stroke-width="2"/>
    <path d="M1160 91 L1160 198 L1104 244" stroke-width="5" stroke-linejoin="round"/>
    <path d="M1105 239 L1090 252" stroke-width="11"/>
    <circle cx="1175" cy="260" r="7" stroke-width="2"/>
  </g>
  <path d="M56 321 H1224" stroke="#c9c9bf"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK JP', sans-serif" font-size="21" fill="#191817">
    <text x="56" y="369"><tspan fill="#555555" font-size="16">01</tspan><tspan dx="20">探す</tspan></text>
    <text x="460" y="369"><tspan fill="#555555" font-size="16">02</tspan><tspan dx="20">比べる</tspan></text>
    <text x="847" y="369"><tspan fill="#555555" font-size="16">03</tspan><tspan dx="20">販売店で確認</tspan></text>
  </g>
</svg>
