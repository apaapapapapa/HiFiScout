<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="中古オーディオを複数ショップから横断検索する非公式ツール">
  <title>HiFiScout — 中古オーディオ横断検索</title>
  <link rel="icon" type="image/jpeg" href="/hifiscout-mark.jpg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/brand.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">USED AUDIO SEARCH</p>
      <h1>HiFiScout</h1>
      <p class="lead">中古オーディオを、ショップをまたいで探す。</p>
    </div>
    <details id="sync-status" class="sync-status">
      <summary>
        <span class="sync-indicator" aria-hidden="true"></span>
        <span id="sync-summary-text">同期状況を取得中…</span>
        <span aria-hidden="true" style="font-size:10px;font-weight:600;color:#8a867e;white-space:nowrap">詳細 ▾</span>
      </summary>
      <div id="sync-status-details" class="sync-status-details"></div>
      <button id="sync-status-close" type="button" aria-label="同期状況を閉じる" title="閉じる" style="position:absolute;right:8px;top:calc(100% + 12px);z-index:16;width:32px;height:32px;border:0;border-radius:8px;background:#fff;color:#555;font-size:22px;line-height:1;cursor:pointer">×</button>
    </details>
  </header>

  <main>
    <section class="search-shell" aria-label="商品検索">
      <label class="search-primary" for="q">
        <span>検索</span>
        <div class="search-row">
          <input id="q" type="search" placeholder="例: TAD ME1 / LUXMAN / DAC" autocomplete="off">
          <button id="filter-toggle" class="filter-toggle" type="button" aria-controls="filter-panel" aria-expanded="false">
            絞り込み <span id="filter-count" class="filter-count" hidden>0</span>
          </button>
        </div>
      </label>
    </section>

    <div id="filter-backdrop" class="filter-backdrop" hidden></div>
    <section id="filter-panel" class="filters" aria-label="絞り込み条件">
      <div class="filters-head">
        <strong>絞り込み</strong>
        <button id="filter-close" class="filter-close" type="button" aria-label="絞り込みを閉じる">×</button>
      </div>

      <label><span>ショップ</span><select id="shop"><option value="">すべて</option></select></label>
      <label><span>メーカー</span><input id="manufacturer" type="search" list="manufacturer-options" placeholder="メーカー名を入力" autocomplete="off"><datalist id="manufacturer-options"></datalist></label>
      <label><span>カテゴリ</span><select id="category"><option value="">すべて</option></select></label>
      <label><span>最低価格</span><input id="minPrice" inputmode="numeric" placeholder="0"></label>
      <label><span>最高価格</span><input id="maxPrice" inputmode="numeric" placeholder="1000000"></label>
      <label class="check"><input id="inStock" type="checkbox" checked><span>在庫ありのみ</span></label>
      <label class="check"><input id="recentOnly" type="checkbox"><span>48時間以内の新着</span></label>
      <label class="check"><input id="priceDropped" type="checkbox"><span>値下げ商品</span></label>
      <label class="check"><input id="favoritesOnly" type="checkbox"><span>お気に入りのみ <small id="favorites-count">(0)</small></span></label>

      <div class="filter-actions">
        <button id="clear-filters" class="button-secondary" type="button">すべて解除</button>
        <button id="apply-filters" class="button-primary" type="button">結果を見る</button>
      </div>
    </section>

    <div id="active-filters" class="active-filters" aria-live="polite"></div>

    <div class="result-header">
      <div class="result-count">
        <strong id="count">—</strong><span id="count-label">件を表示中</span>
        <span id="more-available" class="more-available" hidden>さらに商品があります</span>
      </div>
      <span id="loading" class="loading" role="status" aria-live="polite">更新中</span>
      <div class="result-tools">
        <label class="sort-control"><span>並び順</span><select id="sort"><option value="newest">新着・更新順</option><option value="priceAsc">価格が安い順</option><option value="priceDesc">価格が高い順</option></select></label>
        <div class="view-switch" role="group" aria-label="表示形式">
          <button type="button" data-view="list" aria-label="リスト表示">リスト</button>
          <button type="button" data-view="cards" aria-label="カード表示">カード</button>
        </div>
      </div>
    </div>

    <p id="favorites-note" class="favorites-note" hidden>お気に入りはこの端末にのみ保存されます。価格や在庫は最後に表示した時点の情報です。</p>
    <section id="products" class="products view-list" aria-live="polite"></section>
    <nav id="pagination" class="pagination" aria-label="商品一覧のページ"></nav>
  </main>

  <dialog id="history-dialog" aria-labelledby="history-title">
    <button class="dialog-close" aria-label="閉じる">×</button>
    <div id="history-content"></div>
  </dialog>

  <footer>
    <p>HiFiScout は各販売店とは関係のない非公式の横断検索ツールです。価格・在庫・商品状態は必ず販売店の商品ページで確認してください。</p>
    <p>商品画像・販売店の商品説明文・スタッフコメントは保存・転載しません。</p>
  </footer>
  <script>
    const syncStatus = document.getElementById('sync-status');
    const syncClose = document.getElementById('sync-status-close');
    syncClose?.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      syncStatus?.removeAttribute('open');
      syncStatus?.querySelector('summary')?.focus({ preventScroll: true });
    });
  </script>
  <script src="/catalog-url-state.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
