extends=sqlite-xerial

# Xerial SQLite JDBC reports null JDBC catalog/schema metadata. Returning both
# values as NULL lets SchemaSpy associate each discovered table with the schema
# selected by -s while still using SQLite's own schema catalog for discovery.
selectTablesSql=SELECT name AS table_name, NULL AS table_catalog, NULL AS table_schema, NULL AS table_comment, NULL AS table_rows FROM sqlite_schema WHERE type = 'table' AND name NOT LIKE 'sqlite_%' ORDER BY name
