extends=sqlite-xerial

# Xerial SQLite JDBC exposes tables with null JDBC catalog/schema metadata.
# SchemaSpy expects those values to identify the schema being documented, so
# provide the canonical SQLite primary database name explicitly for discovery.
selectTablesSql=SELECT name AS table_name, 'main' AS table_catalog, 'main' AS table_schema, NULL AS table_comment, NULL AS table_rows FROM sqlite_schema WHERE type = 'table' AND name NOT LIKE 'sqlite\\_%' ESCAPE '\\' ORDER BY name
